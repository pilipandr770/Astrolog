<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>{% block title %}Admin{% endblock %} — Lal Kitab Bot</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #f7f5f2; color: #2b2320; margin: 0; }
  header { background: #2b2320; color: #f7f5f2; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
  header a { color: #f7f5f2; text-decoration: none; margin-left: 1.5rem; opacity: .85; }
  header a:hover { opacity: 1; text-decoration: underline; }
  main { max-width: 900px; margin: 2rem auto; padding: 0 1.5rem; }
  .card { background: #fff; border-radius: 10px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h1 { font-size: 1.4rem; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; }
  .stat { background: #f7f5f2; border-radius: 8px; padding: 1rem; text-align: center; }
  .stat .value { font-size: 1.6rem; font-weight: 700; }
  .stat .label { font-size: .85rem; opacity: .7; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #eee; font-size: .9rem; }
  textarea { width: 100%; min-height: 160px; font-family: inherit; padding: .6rem; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
  button, .btn { background: #6b46c1; color: #fff; border: none; padding: .6rem 1.2rem; border-radius: 6px; cursor: pointer; font-size: 1rem; text-decoration: none; display: inline-block; }
  input[type=password] { padding: .6rem; border-radius: 6px; border: 1px solid #ccc; width: 100%; box-sizing: border-box; margin-bottom: 1rem; }
  .error { color: #b91c1c; }
  .success { color: #15803d; }
</style>
</head>
<body>
{% if session.get('is_admin') %}
<header>
  <strong>Lal Kitab Bot — Admin</strong>
  <nav>
    <a href="{{ url_for('admin.dashboard') }}">Übersicht</a>
    <a href="{{ url_for('admin.instructions') }}">Anweisungen</a>
    <a href="{{ url_for('admin.logout') }}">Abmelden</a>
  </nav>
</header>
{% endif %}
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
