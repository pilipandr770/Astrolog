services:
  bot:
    build: .
    container_name: whatsapp-astrologer-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Host-Port 5010, da 5000 auf diesem VPS bereits von einem anderen
      # Projekt (autoposter) belegt ist. Container-intern bleibt 5000.
      - "5010:5000"
    volumes:
      - ./data:/app/data
      - ./ephe:/app/ephe
    networks:
      - astrolog-net

  admin:
    build: .
    container_name: whatsapp-astrologer-bot-admin
    restart: unless-stopped
    env_file:
      - .env
    # --worker-class gthread --threads 4: derselbe Grund wie beim bot-Service
    # (Dockerfile) — ein einzelner sync-Worker blockiert komplett auf jeder
    # offenen Verbindung, die keine HTTP-Anfrage schickt (z.B. Browser-
    # Vorab-Verbindungen über den SSH-Tunnel), bis zum Timeout.
    command: ["gunicorn", "--bind", "0.0.0.0:5001", "--workers", "1", "--worker-class", "gthread", "--threads", "4", "admin_app:app"]
    ports:
      # NUR an localhost gebunden — von außerhalb des VPS nicht erreichbar.
      # Zugriff via SSH-Tunnel: ssh -L 5001:localhost:5001 user@vps
      - "127.0.0.1:5001:5001"
    volumes:
      - ./data:/app/data
    networks:
      - astrolog-net

networks:
  astrolog-net:
    driver: bridge
