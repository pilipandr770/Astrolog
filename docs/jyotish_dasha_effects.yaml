# Vimshottari Dasha — эффекты Антардаш внутри каждой Махадаши.
# Структура и стиль условий/эффектов — по аналогии с docs/lal_kitab_rules.yaml.
#
# Источник: Brihat Parashara Hora Shastra, англ. перевод (старая, наиболее
# читаемая из проверенных электронных копий; см. обсуждение в чате —
# перевод Girish Chandra Sharma оказался с нечитаемым OCR, Santhanam 1984
# явно современный и копирайтный, эта копия — без явного указания
# переводчика/года, использована только как приватный справочник).
# Полный текст: docs/jyotish_source/bphs_ebook_djvu.txt (НЕ в git, см.
# .gitignore) — главы 52-60, "Effects of the Antar Dashas in the Dasha of
# [Graha] (Vimshottari)".
#
# Условия описывают положение планеты-владыки Антардаши (сила/достоинство,
# дом от Лагны, дом от владыки Махадаши) — как и в Лал Китаб, конкретная
# карта может удовлетворять НЕСКОЛЬКИМ условиям сразу; Claude решает, какие
# из них применимы к конкретному расчёту (см. app/services/claude_service.py).
#
# mahadasha_lord/antardasha_lord используют те же английские имена планет,
# что и app/services/dasha.py (DASHA_ORDER) и app/services/ephemeris.py —
# для программной сверки id из кода без дополнительного маппинга.
#
# СТАТУС: заполнена глава 52 (Sun Mahadasha, 9/9 антардаш). Остаются главы
# 53-60 (Moon, Mars, Rahu, Jupiter, Saturn, Mercury, Ketu, Venus Mahadasha) —
# 72 записи, см. docs/TODO.md п.10.

- id: dasha_sun_sun
  mahadasha_lord: Sun
  antardasha_lord: Sun
  summary: >
    The Sun's own sub-period within its own main period — a "pure" reading
    of how strong or weak the Sun is in this chart, since there is no
    second planet's placement to blend in.
  severity: mixed
  benefit_effects:
    - condition: "Sun exalted, in its own sign, in House 11, in a Kendra (1/4/7/10), or in a Trikona (1/5/9)"
      effect: "Gains of wealth and grain; generally auspicious period."
    - condition: "Sun placed in houses other than the above (neither clearly strong nor clearly afflicted)"
      effect: "Moderate, middling results."
  malefic_effects:
    - condition: "Sun debilitated, or placed in an inauspicious house/sign"
      effect: "Adverse results overall."
    - condition: "Sun rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Risk of premature death or death-like suffering — the most severe warning attached to this Antardasha."
  remedy: "Mrityunjaya Japa, or worship of the Sun (mantra recitation, charity)."

- id: dasha_sun_moon
  mahadasha_lord: Sun
  antardasha_lord: Moon
  summary: >
    The Moon's sub-period during a Sun main period — outcomes swing sharply
    between family/property gains and emotional distress depending on the
    Moon's waxing/waning state and house placement.
  severity: mixed
  benefit_effects:
    - condition: "Moon in a Kendra or a Trikona"
      effect: "Marriage-related functions, gain of wealth/property, acquisition of house, land, cattle and vehicles."
    - condition: "Moon in its exaltation sign or its own sign"
      effect: "Marriage of the native, birth of children, favour from authority figures, fulfillment of ambitions."
    - condition: "Benefic planets in House 1, House 9, or a Kendra counted from the Antardasha lord (Moon)"
      effect: "Luxury and comfort, rise of fortune, more joy from spouse and children, gain of a position of authority, marriages and religious ceremonies at home, gain of clothes/land/vehicle, birth of children and grandchildren."
  malefic_effects:
    - condition: "Moon waning, or associated with malefic planets"
      effect: "Distress to spouse and children, failed ventures, disputes, loss of servants, conflict with authority, loss of wealth and grain."
    - condition: "Moon in House 6 (Ari), House 8 (Randhr), or House 12 (Vyaya)"
      effect: "Danger from water, mental agony, imprisonment-like restriction, illness, loss of position, difficult travel, disputes with relatives, poor food, trouble from thieves, friction with authority, urinary trouble, bodily pain."
    - condition: "Moon in House 6, 8, or 12 counted from the Antardasha lord, or generally weak"
      effect: "Unpalatable/coarse food, exile to distant places."
    - condition: "Moon rules a Marak (death-inflicting) house"
      effect: "Risk of premature death."
  remedy: "Charity of a white cow and a female buffalo."

- id: dasha_sun_mars
  mahadasha_lord: Sun
  antardasha_lord: Mars
  summary: >
    Mars energizes this Sun period toward action, leadership and physical
    vitality when well-placed, or toward conflict and health strain when
    weak or afflicted.
  severity: mixed
  benefit_effects:
    - condition: "Mars in its exaltation sign, own sign, a Kendra, or a Trikona"
      effect: "Acquisition of land, gain of wealth and grain, acquisition of a house."
    - condition: "Mars conjunct the Lagna lord"
      effect: "All-round gains, rise to a position of military/organizational command, destruction of rivals, peace of mind, family comfort, increase in the number of siblings."
  malefic_effects:
    - condition: "Mars in House 8 or House 12 from the Antardasha lord, associated with malefics, or without dignity/strength"
      effect: "Harshness of temperament, mental affliction, imprisonment-like restriction, loss of relatives, disputes with brothers, failed ventures."
    - condition: "Mars debilitated or weak"
      effect: "Loss of wealth through the displeasure of authority."
    - condition: "Mars rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Diseases of mind and body."
  remedy: "Vedic recitation, Japa, and Vrashotsarg (a purification ritual) — said to restore health, longevity and success in undertakings."

- id: dasha_sun_rahu
  mahadasha_lord: Sun
  antardasha_lord: Rahu
  summary: >
    A famously two-phase Antardasha — an initial rough patch even under
    otherwise favourable placement, followed by a turn toward comfort and
    recognition; the source is explicit that timing within the period
    matters as much as Rahu's placement.
  severity: mixed
  benefit_effects:
    - condition: "Rahu in a Kendra or Trikona from Lagna, AND associated with benefics or in a benefic's Navamsa (after the first ~2 months of the Antardasha)"
      effect: "Following an initial rough patch, comfort, sound health, satisfaction and favour from authority figures."
    - condition: "Rahu in an Upachaya house (3, 6, 10, or 11) from Lagna, associated with a Yogakaraka, or auspiciously placed from the Antardasha lord"
      effect: "Recognition from authority, good fortune, name and fame, birth of a son, family happiness (alongside some distress to spouse/children)."
  malefic_effects:
    - condition: "Rahu in a Kendra or Trikona from Lagna (first ~2 months of the Antardasha, before any benefic influence takes hold)"
      effect: "Loss of wealth, danger from thieves and snakes, injury, distress to spouse and children."
    - condition: "Rahu weak, or in House 8 or House 12 from the Antardasha lord"
      effect: "Imprisonment-like restriction, loss of position, danger from thieves and snakes, injury, destruction of cattle/house/fields, disease, dysentery-like ailments."
    - condition: "Rahu placed in House 2 (Dhan) or House 7 (Yuvati), or associated with the lords of those houses"
      effect: "Risk of premature death, danger from snakes."
  remedy: "Worship of Goddess Durga, Japa, charity of a black cow or female buffalo."

- id: dasha_sun_jupiter
  mahadasha_lord: Sun
  antardasha_lord: Jupiter
  summary: >
    Jupiter tends to bring growth, status and good fortune to a Sun period
    when dignified, with an emphasis on religious/family life; affliction
    turns this into frustration and unmet goals rather than acute danger.
  severity: mixed
  benefit_effects:
    - condition: "Jupiter in a Kendra or Trikona from Lagna, in its exaltation sign, own sign, or own Varga"
      effect: "Marriage, favour from authority, gain of wealth and grain, birth of a son, fulfilled ambitions, gain of clothes."
    - condition: "Jupiter rules House 9 (Dharma) or House 10 (Karma)"
      effect: "Acquisition of a position of authority, comfort of transport/vehicles, rise in status."
    - condition: "Jupiter well-placed relative to the Antardasha lord"
      effect: "Improved fortune, charitable and religious inclination, devotion to teachers/deities, fulfilled ambitions."
  malefic_effects:
    - condition: "Jupiter in House 6 or House 8 from the Antardasha lord, or associated with malefics"
      effect: "Distress to spouse and children, bodily pain, displeasure of authority, unmet goals, loss of wealth traceable to past misdeeds, mental worry."
  remedy: "Charity of gold or a tawny-coloured cow, worship of one's chosen deity (Ishta Devata)."

- id: dasha_sun_saturn
  mahadasha_lord: Sun
  antardasha_lord: Saturn
  summary: >
    A Saturn sub-period known for an uneven arc within itself — the source
    explicitly describes friends lost early, gains in the middle, and
    difficulty toward the end, on top of whatever the placement-based
    effects indicate.
  severity: mixed
  benefit_effects:
    - condition: "Saturn in a Kendra or Trikona from Lagna"
      effect: "Destruction of rivals, general enjoyment, some gain of grain, auspicious domestic ceremonies such as marriage."
    - condition: "Saturn exalted, in its own sign, in a friendly sign, or conjunct a friendly planet"
      effect: "Wellbeing, growth in property, recognition from authority, national-level renown, wealth from multiple sources."
  malefic_effects:
    - condition: "Saturn in House 8 or House 12 from the Antardasha lord, or associated with malefics"
      effect: "Rheumatic pain, fever, dysentery-like illness, imprisonment-like restriction, business losses, loss of wealth, disputes with relatives/claimants."
    - condition: "Saturn in its debilitation sign"
      effect: "On top of other adverse effects: separation from parents and unsettled wandering."
    - condition: "Saturn rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Risk of premature death."
    - condition: "General timing pattern within this Antardasha, independent of the above"
      effect: "Loss of friends at the start, favourable middle portion, distress toward the end."
  remedy: "Charity of a black cow, buffalo, or goat; Mrityunjaya Japa."

- id: dasha_sun_mercury
  mahadasha_lord: Sun
  antardasha_lord: Mercury
  summary: >
    Mercury tends to bring social/religious recognition and prosperity to a
    Sun period when well-placed; the source notes Mercury can rarely fall
    badly-placed from the Sun by house count, so severe affliction here is
    less common than in other Antardashas.
  severity: mixed
  benefit_effects:
    - condition: "Mercury in a Kendra or Trikona from Lagna"
      effect: "Rise to a position of authority, enthusiasm and vigour, family happiness, gain of a vehicle through favour of authority, clothes and ornaments, pilgrimage, acquisition of a cow."
    - condition: "Mercury conjunct the lord of House 9 (Dharma), or placed in House 9, House 5 (Putra), or House 10 (Karma)"
      effect: "Reverence and popularity among people, performance of pious deeds and religious rites, devotion to teacher and deities, growth in wealth and grain, birth of a son."
    - condition: "Mercury in an auspicious house (e.g. a Trikona) counted from the Antardasha lord"
      effect: "Marriage, charitable/religious offerings, fame (sometimes under another name), good food, prosperity comparable to royal fortune through wealth, robes and ornaments."
  malefic_effects:
    - condition: "Mercury in House 6, 8, or 12 from the Antardasha lord (rare in a Sun period, since Mercury cannot stray far from the Sun)"
      effect: "Bodily distress, disturbed peace of mind, distress to spouse and children — typically worse at the start and end of the Antardasha than in the middle, with possible friction with authority and exile toward the end."
    - condition: "Mercury rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Bodily pain and feverish illness."
  remedy: "Recitation of the Vishnu Sahasranama; charity of grain and a silver idol."

- id: dasha_sun_ketu
  mahadasha_lord: Sun
  antardasha_lord: Ketu
  summary: >
    Generally one of the more difficult Antardashas of a Sun period by
    default — the source frames good outcomes as the exception (specific
    favourable house placements) rather than the rule.
  severity: caution
  benefit_effects:
    - condition: "Ketu placed in House 3 (Sahaja), House 6 (Ari), House 10 (Karma), or House 11 (Labha)"
      effect: "Happiness from spouse and children, satisfaction, growth in friendships, gain of clothes, good reputation."
  malefic_effects:
    - condition: "Default, absent other qualifying placements"
      effect: "Bodily pain, mental agony, loss of wealth, trouble from authority, disputes with relatives."
    - condition: "Ketu conjunct the Lagna lord"
      effect: "Some happiness at the start of the Antardasha, distress in the middle, and news of a death toward the end."
    - condition: "Ketu in House 8 or House 12 from the Antardasha lord"
      effect: "Dental or facial ailments, urinary trouble, loss of position/friends/wealth, death of the father, forced travel abroad, trouble from adversaries."
    - condition: "Ketu rules or occupies House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Risk of premature death."
  remedy: "Recitation of Durga mantras (Shat Chandi Path), charity of a goat."

- id: dasha_sun_venus
  mahadasha_lord: Sun
  antardasha_lord: Venus
  summary: >
    When well-dignified, one of the more pleasant Antardashas of a Sun
    period — marriage, comfort and status are emphasized; the source again
    notes a three-phase arc (moderate, then good, then difficult) within
    the period itself.
  severity: mixed
  benefit_effects:
    - condition: "Venus in a Kendra or Trikona, in its exaltation sign, own sign, own Varga, or a friendly sign"
      effect: "Marriage and marital happiness, gain of property, travel, meeting scholars and dignitaries, rise to a position of authority, wealth, generosity and stature, auspicious domestic ceremonies, fine food, gain of jewels/clothes/cattle/wealth/grain/vehicles, enthusiasm, good reputation."
  malefic_effects:
    - condition: "Venus in House 6, 8, or 12 from the Antardasha lord"
      effect: "Displeasure of authority, mental agony, distress to spouse and children — moderate at the start of the Antardasha, good in the middle, but turning to disrepute, loss of position, hostility from relatives and loss of comforts toward the end."
    - condition: "Venus rules House 7 (Yuvati) or House 2 (Dhan)"
      effect: "Bodily pain, risk of illness."
    - condition: "Venus associated with the lord of House 6 (Ari) or House 8 (Randhr)"
      effect: "Risk of premature death."
  remedy: "Mrityunjaya Japa, Rudra Japa, charity of a tawny cow or female buffalo."

- id: dasha_moon_moon
  mahadasha_lord: Moon
  antardasha_lord: Moon
  summary: >
    The Moon's own sub-period within its own main period — a "pure" reading
    of the Moon's strength in this chart, emphasizing devotion, comfort and
    fame when well-placed.
  severity: mixed
  benefit_effects:
    - condition: "Moon exalted, in its own sign, in a Kendra, a Trikona, or associated with the lord of House 9 (Dharma) or House 10 (Karma)"
      effect: "Gain of horses, elephants and fine clothes; devotion to deities and teacher; religious singing; rise to a position of authority; great happiness and enjoyment; name and fame."
  malefic_effects:
    - condition: "Moon debilitated, associated with malefics, or in House 6, 8, or 12"
      effect: "Loss of wealth, loss of position, lethargy, mental agony, conflict with authority figures, distress to the mother, imprisonment-like restriction, loss of relatives."
    - condition: "Moon rules House 2 (Dhan) or House 7 (Yuvati), or is associated with the lord of House 8 or House 12"
      effect: "Bodily pain and danger of premature death."
  remedy: "Charity of a tawny-coloured cow or a female buffalo."

- id: dasha_moon_mars
  mahadasha_lord: Moon
  antardasha_lord: Mars
  summary: >
    Mars brings drive and material gain to a Moon period when dignified,
    or friction and setbacks at home/work when poorly placed.
  severity: mixed
  benefit_effects:
    - condition: "Mars in a Kendra or Trikona"
      effect: "Advancement of fortune, government recognition, gain of clothes and ornaments, success in undertakings, growth in agricultural yield, prosperity at home, business profits."
    - condition: "Mars in its exaltation sign or own sign"
      effect: "Great happiness and enjoyment of comforts."
  malefic_effects:
    - condition: "Mars in House 6, 8, or 12 from Lagna, or associated with/aspected by malefics from House 6, 8, or 12 counted from the Antardasha lord"
      effect: "Bodily distress, losses at home and in agriculture, business losses, friction with employees and authority, separation from relatives, a hot temperament."
  remedy: null

- id: dasha_moon_rahu
  mahadasha_lord: Moon
  antardasha_lord: Rahu
  summary: >
    Similar to the Sun-Rahu Antardasha, this period is described as
    time-phased — even a favourable placement can turn difficult later in
    the period, according to the source.
  severity: mixed
  benefit_effects:
    - condition: "Rahu aspected by benefics, placed in House 3 (Sahaja), 6 (Ari), 10 (Karma), or 11 (Labha), or conjunct a Yogakaraka planet"
      effect: "Success in all undertakings, gain of vehicles and garments through favour of authority (associated with the south-west direction)."
    - condition: "Rahu in a Kendra, a Trikona, House 3, or House 11 from the Antardasha lord"
      effect: "Pilgrimage to holy places, visits to sacred shrines, charitable inclination."
  malefic_effects:
    - condition: "Rahu in a Kendra or Trikona (early in the Antardasha, before turning difficult later per the source's explicit timing note)"
      effect: "Danger from authority, thieves and snakes, distress to cattle, loss of relatives and friends, loss of reputation, mental agony."
    - condition: "Rahu weak and placed in House 8 or House 12 from the Antardasha lord"
      effect: "Loss of position, mental agony, distress to spouse and children, danger of disease, danger from authority, scorpions and snakes."
    - condition: "Rahu placed in House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Bodily afflictions."
  remedy: "Rahu Japa, charity of a goat."

- id: dasha_moon_jupiter
  mahadasha_lord: Moon
  antardasha_lord: Jupiter
  summary: >
    Jupiter tends to bring status, family gains and royal favour to a Moon
    period when dignified; affliction turns this toward loss of position
    and strained family ties rather than acute danger.
  severity: mixed
  benefit_effects:
    - condition: "Jupiter in a Kendra or Trikona to Lagna, in its own sign, or in its exaltation sign"
      effect: "Acquisition of a position of authority, auspicious celebrations at home, gain of clothes and ornaments, favour of one's chosen deity, gains of wealth, land and vehicles, success in undertakings through royal favour."
    - condition: "Jupiter in House 3 or House 11 from the Antardasha lord"
      effect: "Gains of cattle, grain and clothes; happiness through brothers; property acquisition; valour and patience; celebrations such as marriage; rise to a position of authority."
  malefic_effects:
    - condition: "Jupiter in House 6, 8, or 12 from Lagna, combust, debilitated, or associated with malefics"
      effect: "Loss/harm to teacher, father or children; loss of position; mental agony; quarrels; destruction of house, vehicles or agricultural land."
    - condition: "Jupiter weak and placed in House 6, 8, or 12 from the Moon"
      effect: "Unpalatable food, forced travel away from home; good effects at the start of the Antardasha but distress toward its end."
    - condition: "Jupiter rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Risk of premature death."
  remedy: "Recitation of the Shiva Sahasranama, charity of gold."

- id: dasha_moon_saturn
  mahadasha_lord: Moon
  antardasha_lord: Saturn
  summary: >
    A generally favourable Antardasha when Saturn is dignified, tied to
    steady material gains through effort and children; weaker placements
    bring more disruptive, unsettled effects rather than acute misfortune.
  severity: mixed
  benefit_effects:
    - condition: "Saturn in a Kendra or Trikona from Lagna, in its own sign, own Navamsa, or exaltation sign, aspected by or associated with benefics, or strong in House 11 (Labha)"
      effect: "Birth of a son, friendship, gain of wealth and property, business profit (with help of ordinary working people), growth in agricultural yield, gains through one's son, riches and glory through royal favour."
    - condition: "Saturn in a Kendra or Trikona from the Antardasha lord, or generally strong"
      effect: "Alternating enjoyment and wealth gains with periods of friction with spouse and children."
  malefic_effects:
    - condition: "Saturn in House 6, 8, 12, or 2 from Lagna, or in its debilitation sign"
      effect: "Pilgrimage and holy bathing alongside trouble stirred by many people and distress from adversaries."
    - condition: "Saturn placed in House 2 (Dhan), House 7 (Yuvati), or House 8 (Randhr)"
      effect: "Bodily distress."
  remedy: "Mrityunjaya Japa, charity of a black cow or female buffalo."

- id: dasha_moon_mercury
  mahadasha_lord: Moon
  antardasha_lord: Mercury
  summary: >
    Generally one of the more comfortable Antardashas of a Moon period —
    wealth, learning and social/religious life are emphasized when Mercury
    is dignified.
  severity: mixed
  benefit_effects:
    - condition: "Mercury in a Kendra or Trikona, in its own sign, own Navamsa, or exaltation sign, with strength"
      effect: "Acquisition of wealth, royal recognition, gain of clothes, scriptural discussion, company of learned and holy people, enjoyment, birth of children, satisfaction, business profits, gain of a vehicle and ornaments."
    - condition: "Mercury in a Kendra, a Trikona, House 11, or House 2 from the Antardasha lord"
      effect: "Marriage, religious offerings, charity, religious rites, close relations with authority, company of learned people, gain of pearls/coral/jewels/vehicles/clothes/ornaments, good health, affection, fine food and drink."
  malefic_effects:
    - condition: "Mercury in House 6, 8, or 12 from the Antardasha lord, or in its debilitation sign"
      effect: "Bodily pain, losses in agricultural ventures, imprisonment-like restriction, distress to spouse and children."
    - condition: "Mercury rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Fear of fever."
  remedy: "Recitation of the Vishnu Sahasranama, charity of a goat."

- id: dasha_moon_ketu
  mahadasha_lord: Moon
  antardasha_lord: Ketu
  summary: >
    Generally favourable when Ketu is dignified, with wealth effects
    concentrated at the edges of the period — some loss at the very start
    or very end even in an otherwise good Antardasha.
  severity: mixed
  benefit_effects:
    - condition: "Ketu in a Kendra, a Trikona, or House 3 (Sahaja), with strength"
      effect: "Gain of wealth, enjoyment, happiness to spouse and children, religious inclination — though some loss of wealth is likely right at the start of the Antardasha, improving afterward."
    - condition: "Ketu in a Kendra, House 9, House 5, or House 11 from the Antardasha lord, with strength"
      effect: "Gain of wealth and cattle — though some loss of wealth is likely toward the end of the Antardasha."
  malefic_effects:
    - condition: "Ketu in House 8 or House 12 from the Antardasha lord, or aspected by/associated with malefics"
      effect: "Obstacles in undertakings caused by rivals' interference and quarrels."
    - condition: "Ketu placed in House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Danger of bodily affliction/disease."
  remedy: "Mrityunjaya Japa — said to relieve the adverse effects and bring gain of wealth and property through Lord Shiva's grace."

- id: dasha_moon_venus
  mahadasha_lord: Moon
  antardasha_lord: Venus
  summary: >
    One of the more materially and domestically rich Antardashas of a Moon
    period when Venus is dignified — new property, comfort and family
    happiness are emphasized.
  severity: mixed
  benefit_effects:
    - condition: "Venus in a Kendra, a Trikona, House 11 (Labha), House 4 (Bandhu), or House 9 (Dharma), in its exaltation sign, or in its own sign"
      effect: "Acquisition of a position of authority, gain of clothes/ornaments/cattle/vehicles, happiness to spouse and children, construction of a new house, daily fine food, use of perfumes, romantic affairs, sound health."
    - condition: "Venus conjunct the Antardasha lord"
      effect: "Physical wellbeing, good reputation, acquisition of more land and houses."
    - condition: "Venus in House 2 (Dhan), in its exaltation sign or own sign, or associated with the lord of House 11 (Labha)"
      effect: "Discovery of hidden/underground treasure, gain of land, enjoyment, birth of a son."
    - condition: "Venus conjunct the lord of House 9 (Dharma) or House 11 (Labha)"
      effect: "Advancement of fortune, fulfilled ambitions through royal favour, devotion to deities and Brahmins, gain of pearls and similar jewels."
    - condition: "Venus in a Kendra or Trikona from the Antardasha lord"
      effect: "Acquisition of more house property and agricultural land, gain of wealth and enjoyment."
  malefic_effects:
    - condition: "Venus debilitated, combust, or aspected by/associated with malefics"
      effect: "Loss of landed property, children, spouse and cattle; opposition from authority."
    - condition: "Venus in House 6, 8, or 12 from the Antardasha lord"
      effect: "Forced travel to foreign lands, sorrow, death, danger from thieves and snakes."
    - condition: "Venus rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Risk of premature death."
  remedy: "Rudra Japa, charity of a white cow and silver."

- id: dasha_moon_sun
  mahadasha_lord: Moon
  antardasha_lord: Sun
  summary: >
    Generally favourable when the Sun is dignified, framed around recovery
    and consolidation of status and wealth; a mild health dip toward the
    end of the Antardasha is noted regardless of placement.
  severity: mixed
  benefit_effects:
    - condition: "Sun in its exaltation sign, own sign, a Kendra, House 5 (Putra), House 9 (Dharma), House 11 (Labha), House 2 (Dhan), or House 3 (Sahaja)"
      effect: "Recovery of lost status and wealth, family happiness, acquisition of land/villages with the help of friends and authority figures, birth of a son, favour of Goddess Lakshmi. Some risk of fever and lethargy is still noted toward the end of the Antardasha."
  malefic_effects:
    - condition: "Sun in House 8 or House 12 from the Antardasha lord"
      effect: "Danger from authority, thieves and snakes; feverish affliction; trouble during foreign travel."
    - condition: "Sun rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Suffering from fever during this Antardasha."
  remedy: "Worship of Lord Shiva."

- id: dasha_mars_mars
  mahadasha_lord: Mars
  antardasha_lord: Mars
  summary: >
    Mars's own sub-period within its own main period — favours recovery of
    status/wealth and childbirth when dignified, with health/mind strain as
    the main risk when afflicted.
  severity: mixed
  benefit_effects:
    - condition: "Mars in a Kendra, House 5 (Putra), House 9 (Dharma), House 11 (Labha), House 3 (Sahaja), House 2 (Dhan), or conjunct the Lagna lord"
      effect: "Gain of wealth through royal favour, favour of Goddess Lakshmi, recovery of lost status and wealth, birth of a son."
    - condition: "Mars in its exaltation sign, own sign, or own Navamsa, with strength"
      effect: "Fulfilled ambitions through royal favour, acquisition of a house, land, cows and buffaloes."
  malefic_effects:
    - condition: "Mars in House 8 or House 12, or aspected by/associated with malefics"
      effect: "Urinary trouble, wounds, danger from snakes and from authority."
    - condition: "Mars rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Mental agony and bodily pain."
  remedy: "Rudra Japa, charity of a red-coloured bull."

- id: dasha_mars_rahu
  mahadasha_lord: Mars
  antardasha_lord: Rahu
  summary: >
    Strongly placement-dependent — favourable dignity brings recognition
    and business gains, while affliction brings physical danger and
    imprisonment-like restriction rather than mild setbacks.
  severity: mixed
  benefit_effects:
    - condition: "Rahu in its Mulatrikona, its exaltation sign, a Kendra, House 11 (Labha), House 5 (Putra), or House 9 (Dharma), and associated with benefics"
      effect: "Recognition from authority, gain of a house and land, happiness through a son, extraordinary business profits, pilgrimage bathing (e.g. the Ganges), foreign travel."
  malefic_effects:
    - condition: "Rahu in House 8 or House 12, or aspected by/associated with malefics"
      effect: "Danger from snakes, wounds, destruction of cattle, danger from animals, bile/wind-imbalance diseases, imprisonment-like restriction."
    - condition: "Rahu placed in House 2 (Dhan)"
      effect: "Loss of wealth."
    - condition: "Rahu placed in House 7 (Yuvati)"
      effect: "Great danger of premature death."
  remedy: "Naga Puja (serpent worship), feeding Brahmins, Mrityunjaya Japa — said to help prolong life."

- id: dasha_mars_jupiter
  mahadasha_lord: Mars
  antardasha_lord: Jupiter
  summary: >
    Generally favourable for status, family and property when Jupiter is
    dignified; affliction brings conflict with authority and health strain
    rather than the acute danger seen in some other Antardashas.
  severity: mixed
  benefit_effects:
    - condition: "Jupiter in House 9 (Dharma), House 5 (Putra), a Kendra, House 11 (Labha), or House 2 (Dhan), in its exaltation sign, or own Navamsa"
      effect: "Good reputation and renown, honours from authority, growth in wealth and grain, happiness at home, gain of property, happiness through spouse and children."
    - condition: "Jupiter in a Kendra, a Trikona, or House 11 from the Antardasha lord, associated with the lord of House 9, 10, or 4, or in a benefic Navamsa"
      effect: "Acquisition of a house and land, wellbeing, gain of property, sound health, good reputation, gains of cattle, success in business, spousal/children happiness, reverence from authority, gain of wealth."
  malefic_effects:
    - condition: "Jupiter in House 6, 8, or 12, debilitated, aspected by/associated with malefics, or otherwise weak"
      effect: "Danger from thieves and snakes, wrath of authority, bilious disease, a sense of oppressive/hostile forces, loss of servants and siblings."
    - condition: "Jupiter rules House 2 (Dhan)"
      effect: "Suffering from fever, or danger of premature death."
  remedy: "Recitation of the Shiva Sahasranama."

- id: dasha_mars_saturn
  mahadasha_lord: Mars
  antardasha_lord: Saturn
  summary: >
    A demanding Antardasha overall — even generally favourable dignity
    brings only moderate, narrowly-timed benefit, while affliction (with
    malefic association) is described as one of the more severe outcomes
    in the whole Dasha system.
  severity: caution
  benefit_effects:
    - condition: "Saturn in a Kendra, a Trikona, its Mulatrikona, its exaltation sign, own Navamsa, or associated with the Lagna lord or benefics"
      effect: "Recognition from authority, growing reputation, gain of wealth and grain, happiness through children/grandchildren, increase in cattle — results tend to manifest on Saturdays."
  malefic_effects:
    - condition: "Saturn debilitated, in an enemy sign, or in House 8 or House 12"
      effect: "Danger from foreign dignitaries, loss of wealth, imprisonment-like restriction, possible illness, loss in agricultural production."
    - condition: "Saturn rules House 2 (Dhan) or House 7 (Yuvati), associated with malefics"
      effect: "Grave danger, loss of life, wrath of authority, mental agony, danger from thieves and fire, punishment, loss of siblings, family discord, loss of cattle, fear of death, distress to spouse and children, imprisonment-like restriction."
    - condition: "Saturn in a Kendra, House 11, or House 5 from the Antardasha lord (dignity here does not offset the difficulty)"
      effect: "Foreign travel, loss of reputation, violent conduct, loss from selling agricultural land, loss of position, agony, defeat in disputes, urinary trouble."
    - condition: "Saturn in House 8 or House 12 from the Antardasha lord, associated with malefics"
      effect: "Danger to life, danger from authority and thieves, rheumatic pain, danger from rivals and family members."
  remedy: "Mrityunjaya Japa, performed properly, is said to bring relief through Lord Shiva's grace."

- id: dasha_mars_mercury
  mahadasha_lord: Mars
  antardasha_lord: Mercury
  summary: >
    Mixed and placement-sensitive, with an unusual note that even close
    association with the Mahadasha lord (Mars) itself is described as
    bringing hardship rather than help.
  severity: mixed
  benefit_effects:
    - condition: "Mercury in a Kendra or Trikona from Lagna"
      effect: "Company of pious/holy people, religious recitation (Ajaya Japa), charity, religious rites, growing reputation, inclination toward diplomacy, fine food, gain of vehicles/clothes/cattle, conferment of authority, success in agricultural projects."
    - condition: "Mercury in a Kendra or Trikona from the Antardasha lord, or in its exaltation sign"
      effect: "Fulfilled ambitions, gain of wealth and grain, royal recognition, acquisition of a position of authority, gain of clothes and ornaments, musical inclination, rise to a military command position, scriptural discussion, riches to spouse and children, favour of Goddess Lakshmi."
  malefic_effects:
    - condition: "Mercury in its debilitation sign, combust, or in House 6, 8, or 12"
      effect: "Heart-related disease, imprisonment-like restriction, loss of relatives, distress to spouse and children, destruction of wealth and cattle."
    - condition: "Mercury conjunct the Mahadasha lord (Mars) itself"
      effect: "Foreign travel, growth in the number of rivals, various ailments, conflict with authority, quarrels with relatives."
    - condition: "Mercury in House 6, 8, or 12 from Mars, or associated with malefics"
      effect: "Defamation, harmful/sinful thinking, harsh speech, danger from thieves/fire/authority, causeless quarrels, fear of robbers while travelling."
    - condition: "Mercury rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Possibility of a critical illness."
  remedy: "Recitation of the Vishnu Sahasranama, charity of a horse."

- id: dasha_mars_ketu
  mahadasha_lord: Mars
  antardasha_lord: Ketu
  summary: >
    Generally favourable when Ketu carries Yogakaraka status or is
    well-placed, with wealth gains typically building over the course of
    the Antardasha rather than appearing immediately.
  severity: mixed
  benefit_effects:
    - condition: "Ketu in a Kendra, a Trikona, House 3 (Sahaja), or House 11 (Labha), or aspected by/associated with benefics"
      effect: "Royal favour, gain of wealth, land gains (modest at first, substantial later), birth of a son, conferment of authority, gain of cattle."
    - condition: "Ketu acting as a Yogakaraka (conjunct a planet that rules both a Kendra and a Trikona) and endowed with strength"
      effect: "Birth of a son, growing reputation, favour of Goddess Lakshmi, wealth gains through employees, rise to a military command position, friendship with authority figures, religious offerings, gain of clothes and ornaments."
  malefic_effects:
    - condition: "Ketu in House 6, 8, or 12 from the Antardasha lord"
      effect: "Quarrels, dental trouble, distress from thieves and predators, fever, dysentery, skin disease, distress to spouse and children."
    - condition: "Ketu placed in House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Disease, disgrace, agony, loss of wealth."
  remedy: null

- id: dasha_mars_venus
  mahadasha_lord: Mars
  antardasha_lord: Venus
  summary: >
    Favourable for comfort, status and property when Venus is dignified,
    with a domestic/celebratory character to the good effects described.
  severity: mixed
  benefit_effects:
    - condition: "Venus in a Kendra to Lagna, in its exaltation sign or own sign, or ruling Lagna, House 5 (Putra), or House 9 (Dharma)"
      effect: "Acquisition of a position of authority, great enjoyment and luxury, gain of elephants/horses/clothes."
    - condition: "Venus related to the Lagna lord"
      effect: "Happiness through spouse and children, opulence and glory, growing good fortune."
    - condition: "Venus in House 5, 9, 11, or 2 from the Antardasha lord"
      effect: "Gain of property, celebrations at a son's birth, wealth gain through one's employer, acquisition of a house/land/village through royal favour; late in the period, celebratory functions and pilgrimage bathing; if Venus is connected with the lord of House 10 (Karma), construction of wells/reservoirs and religious/charitable deeds."
  malefic_effects:
    - condition: "Venus in House 6, 8, or 12 from the Antardasha lord, or associated with malefics"
      effect: "Sorrow, physical distress, loss of wealth, danger from thieves and authority, family discord, distress to spouse and children, loss of cattle."
    - condition: "Venus rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Bodily pain."
  remedy: "Charity of a cow or female buffalo."

- id: dasha_mars_sun
  mahadasha_lord: Mars
  antardasha_lord: Sun
  summary: >
    Generally favourable for health, status and prosperity when the Sun is
    dignified; affliction brings physical/health complaints rather than
    acute danger.
  severity: mixed
  benefit_effects:
    - condition: "Sun in its exaltation sign, own sign, a Kendra, a Trikona, or House 11 (Labha) together with the lords of House 10 (Karma) and House 11"
      effect: "Acquisition of a vehicle, growing reputation, birth of a son, growth of wealth, family harmony, sound health, vitality, royal recognition, extraordinary business profits, audience with authority figures."
  malefic_effects:
    - condition: "Sun in House 6, 8, or 12 from the Antardasha lord, or associated with malefics"
      effect: "Bodily distress, agony, failed ventures, possible trouble affecting the forehead, fever, dysentery."
    - condition: "Sun rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Feverish attacks, danger from snakes and poison, distress concerning a son."
  remedy: "Worship of the Sun in the prescribed manner."

- id: dasha_mars_moon
  mahadasha_lord: Mars
  antardasha_lord: Moon
  summary: >
    Favourable for status, property and family harmony when the Moon is
    dignified and waxing; effects are amplified by a waxing Moon and
    dampened by a waning one, per the source.
  severity: mixed
  benefit_effects:
    - condition: "Moon in its exaltation sign, own sign, a Kendra, House 9 (Dharma), House 4 (Bandhu), House 10 (Karma), or Lagna together with the lords of those houses"
      effect: "Further acquisition of status, gain of perfumes and clothes, construction of reservoirs and shelters for cows, auspicious ceremonies such as marriage, spousal/children happiness, good relations with parents, property gain through royal favour, success in desired projects. Effects manifest fully if the Moon is waxing, and are somewhat reduced if waning."
  malefic_effects:
    - condition: "Moon in its debilitation sign, an enemy sign, or House 6/8/12 from Lagna or from the Antardasha lord"
      effect: "Death, distress to spouse and children, loss of land/wealth/cattle, danger of conflict."
    - condition: "Moon rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Possibility of premature death, bodily distress, mental agony."
  remedy: "Recitation of mantras of Goddess Durga and Goddess Lakshmi."

- id: dasha_rahu_rahu
  mahadasha_lord: Rahu
  antardasha_lord: Rahu
  summary: >
    Rahu's own sub-period within its own main period — favours ambition,
    status and family happiness in specific signs/houses, with fairly
    sharp affliction effects otherwise.
  severity: mixed
  benefit_effects:
    - condition: "Rahu in Cancer, Scorpio, Virgo, or Sagittarius, AND in House 3 (Sahaja), 6 (Ari), 10 (Karma), or 11 (Labha), or conjunct a Yogakaraka planet in its exaltation sign"
      effect: "Acquisition of a position of authority, enthusiasm, cordial relations with authority figures, happiness through spouse and children, growth in property."
  malefic_effects:
    - condition: "Rahu in House 8 or House 12, or associated with malefics"
      effect: "Danger from thieves, distress from wounds, conflict with officials, harm to relatives, distress to spouse and children."
    - condition: "Rahu rules or occupies House 2 (Dhan) or House 7 (Yuvati)"
      effect: "General distress and disease."
  remedy: "Worship of Rahu (mantra recitation), charity of items associated with Rahu."

- id: dasha_rahu_jupiter
  mahadasha_lord: Rahu
  antardasha_lord: Jupiter
  summary: >
    Favourable for steady, growing prosperity and pilgrimage/religious
    activity when Jupiter is dignified; affliction brings financial and
    domestic setbacks rather than acute danger.
  severity: mixed
  benefit_effects:
    - condition: "Jupiter in its exaltation sign, own sign, own Navamsa, or exalted Navamsa, or in a Kendra/Trikona to Lagna"
      effect: "Gain of a position of authority, patience, destruction of rivals, enjoyment, cordial relations with authority, steady growth of wealth and property, gain of a vehicle and cows, audience with authority through travel (west/south-east), success in undertakings, return to one's homeland, good deeds toward Brahmins, pilgrimage, gain of a village, devotion to deities and Brahmins, family happiness, daily fine food."
    - condition: "Jupiter in a Kendra, a Trikona, House 11, House 2, or House 3 from the Antardasha lord, with strength"
      effect: "Gains of land, good food, gains of cattle, inclination toward charitable and religious work."
  malefic_effects:
    - condition: "Jupiter in its debilitation sign, combust, in House 6, 8, or 12, in an enemy sign, or associated with malefics"
      effect: "Loss of wealth, obstacles in work, defamation, distress to spouse and children, heart-related disease, entrusted governmental authority that later proves troublesome."
    - condition: "Jupiter in House 6, 8, or 12 from the Antardasha lord, or associated with malefics"
      effect: "Loss of wealth and bodily distress."
    - condition: "Jupiter rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Danger of premature death."
  remedy: "Worship of a gold idol of Lord Shiva."

- id: dasha_rahu_saturn
  mahadasha_lord: Rahu
  antardasha_lord: Saturn
  summary: >
    A notably unpredictable Antardasha — the source describes both
    domestic favour and financial setback occurring together even under
    reasonably good placement, and an unusual "sudden gain amid distress"
    note under affliction.
  severity: mixed
  benefit_effects:
    - condition: "Saturn in a Kendra, a Trikona, its exaltation sign, own sign, its Mulatrikona, House 3 (Sahaja), or House 11 (Labha)"
      effect: "Favour from authority through devoted service, auspicious home functions such as marriage, construction of a garden or reservoir, gain of wealth and cattle from well-to-do commoners — alongside some financial loss connected with travel and reduced income from lethargy before returning home."
  malefic_effects:
    - condition: "Saturn in its debilitation sign, an enemy sign, or House 8 or House 12"
      effect: "Danger from servants/subordinates, authority and enemies; distress to spouse, children and relatives; disputes with coparceners and in dealings with others — though sometimes accompanied by a sudden gain of ornaments."
    - condition: "Saturn in House 6, 8, or 12 from the Antardasha lord"
      effect: "Heart-related disease, defamation, quarrels, danger from enemies, foreign travel, a Gulma-type ailment, poor food, sorrow."
    - condition: "Saturn rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Premature death is likely."
  remedy: "Charity of a black cow or a she-buffalo."

- id: dasha_rahu_mercury
  mahadasha_lord: Rahu
  antardasha_lord: Mercury
  summary: >
    Generally favourable for status and comfort when Mercury is dignified,
    with a devotional/moral character to the warnings under affliction.
  severity: mixed
  benefit_effects:
    - condition: "Mercury in its exaltation sign, a Kendra, or House 5 (Putra), with strength"
      effect: "A Raj Yoga-like rise, family wellbeing, business profits, vehicle comfort, marriage and auspicious functions, increase in cattle, comforts — these results are said to manifest especially on Wednesdays in Mercury's month."
    - condition: "Mercury in a Kendra, House 11, House 3, House 9, or House 10 from the Antardasha lord"
      effect: "Sound health, fulfillment of cherished wishes, attending discourse on scripture/history, marriage, religious offerings, charity, religious inclination, sympathy toward others."
  malefic_effects:
    - condition: "Mercury in House 6, 8, or 12, or aspected by Saturn"
      effect: "Disrespect toward deities and Brahmins, dishonesty, unwise actions, fear from snakes/thieves/authority, quarrels, distress to spouse and children."
    - condition: "Mercury rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Fear of premature death."
  remedy: "Recitation of the Vishnu Sahasranama."

- id: dasha_rahu_ketu
  mahadasha_lord: Rahu
  antardasha_lord: Ketu
  summary: >
    Difficult by default (foreign travel, health strain, loss of cattle),
    turning favourable mainly through benefic association or connection to
    the Lagna lord.
  severity: caution
  benefit_effects:
    - condition: "Ketu aspected by or associated with benefics"
      effect: "Enjoyment, gain of wealth, recognition from authority, acquisition of gold."
    - condition: "Ketu related to or associated with the Lagna lord"
      effect: "Fulfillment of cherished wishes; if associated with the Lagna lord specifically, a definite gain of wealth."
    - condition: "Ketu in a Kendra or Trikona"
      effect: "A definite increase in the number of cattle."
  malefic_effects:
    - condition: "Default, absent the above"
      effect: "Foreign travel, danger from authority, rheumatic/feverish illness, loss of cattle."
    - condition: "Ketu conjunct the lord of House 8 (Randhr)"
      effect: "Bodily distress and mental tension."
    - condition: "Ketu weak and placed in House 8 or House 12"
      effect: "Danger from thieves and snakes, distress from wounds, separation from parents, antagonistic relations with relatives, mental agony."
    - condition: "Ketu rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Bodily distress."
  remedy: "Charity of a goat."

- id: dasha_rahu_venus
  mahadasha_lord: Rahu
  antardasha_lord: Venus
  summary: >
    Strongly favourable for status, comfort and family life when Venus is
    dignified; affliction (especially with malefic association) brings a
    notably severe list of health/legal troubles.
  severity: mixed
  benefit_effects:
    - condition: "Venus with strength in a Kendra, a Trikona, or House 11 (Labha)"
      effect: "Wealth gains connected with religious scholars, increase in cattle, celebrations at a son's birth, wellbeing, government recognition, acquisition of a position of authority, high standing, great enjoyment and comfort."
    - condition: "Venus in its exaltation sign, own sign, exalted Navamsa, or own Navamsa"
      effect: "Construction of a new house, fine food, spousal/children happiness, friendship, charitable giving, royal favour, gain of vehicles and clothes, extraordinary business profits, sacred-thread-type ceremonies."
    - condition: "Venus in a Kendra, a Trikona, House 11, or House 10 from the Antardasha lord"
      effect: "Enjoyment of perfumes, comfort, music; gain of a desired object; fulfillment of wishes."
  malefic_effects:
    - condition: "Venus in House 6, 8, or 12, in its debilitation sign, an enemy sign, or associated with Saturn, Mars, or Rahu"
      effect: "Disease, quarrels, separation from a son or father, distress to relatives, disputes with coparceners, danger to one's own life or an employer's, unhappiness through spouse and children, stomach pain."
    - condition: "Venus associated with malefics in House 6, 8, or 12 from the Antardasha lord"
      effect: "Danger from the wrath of Brahmins/snakes/authority, urinary and metabolic disease (diabetes-like), blood disorders, anemia, only coarse food available, nervous disorder, imprisonment-like restriction, wealth loss from fines/penalties."
    - condition: "Venus rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Distress to spouse and children, danger of premature death."
  remedy: "Worship of Goddess Durga and Goddess Lakshmi."

- id: dasha_rahu_sun
  mahadasha_lord: Rahu
  antardasha_lord: Sun
  summary: >
    Favourable for reputation and status when the Sun is dignified,
    including a note about foreign recognition; affliction brings illness
    and conflict.
  severity: mixed
  benefit_effects:
    - condition: "Sun in its exaltation sign, own sign, House 11 (Labha), a Kendra, a Trikona, exalted Navamsa, or own Navamsa"
      effect: "Cordial relations with authority, increase in wealth and grain, some popularity/respect, a chance of a leadership position within one's community."
    - condition: "Sun aspected by or associated with the lord of Lagna, House 2 (Dhan), or House 10 (Karma)"
      effect: "Good reputation, government encouragement and assistance, foreign travel, rise to national leadership, gains of elephants/horses/clothes/ornaments, fulfilled ambitions, happy children."
    - condition: "Sun in a Kendra, a Trikona, House 3, or House 11 from the Antardasha lord"
      effect: "Overall wellbeing and recognition from authorities abroad."
  malefic_effects:
    - condition: "Sun in its debilitation sign, or in House 6, 8, or 12 from the Antardasha lord"
      effect: "Fevers, dysentery, other diseases, quarrels, conflict with authority, forced travel, danger from rivals/thieves/fire."
    - condition: "Sun rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Danger of critical illness."
  remedy: "Worship of the Sun."

- id: dasha_rahu_moon
  mahadasha_lord: Rahu
  antardasha_lord: Moon
  summary: >
    Favourable for status, health and property when the Moon is dignified;
    affliction brings household/agricultural disruption rather than acute
    personal danger, except where the Moon rules the sensitive houses.
  severity: mixed
  benefit_effects:
    - condition: "Moon in its exaltation sign, own sign, a Kendra, a Trikona, House 11 (Labha), or a friendly sign aspected by benefics"
      effect: "Acquisition of a position of authority, respect from authority, gains of wealth, sound health, gains of clothes and ornaments, happiness through children, comfort of vehicles, increase in house and landed property."
    - condition: "Moon in House 5, House 9, a Kendra, or House 11 from the Antardasha lord"
      effect: "Favour of Goddess Lakshmi, all-round success, increase in wealth and grain, good reputation, devotion to deities."
  malefic_effects:
    - condition: "Moon weak and placed in House 6, 8, or 12 from the Antardasha lord"
      effect: "Disturbances at home and in agricultural activity attributed to malevolent influences/wild animals, danger from thieves while travelling, stomach disorders."
    - condition: "Moon rules House 2 (Dhan) or House 12 (Vyaya)"
      effect: "Possibility of premature death."
  remedy: "Charity of a white cow or a female buffalo."

- id: dasha_rahu_mars
  mahadasha_lord: Rahu
  antardasha_lord: Mars
  summary: >
    Favourable for recovering lost status/wealth and family happiness when
    Mars is dignified; affliction brings domestic conflict and physical
    harm.
  severity: mixed
  benefit_effects:
    - condition: "Mars in House 11 (Labha), House 5 (Putra), House 9 (Dharma), a Kendra, aspected by benefics, or in its exaltation/own sign"
      effect: "Recovery of lost status and wealth, growth in household/agricultural prosperity, gain of wealth, blessing of one's household deity, children's happiness, good food."
    - condition: "Mars in a Kendra, House 5, House 9, House 3, or House 11 from the Antardasha lord"
      effect: "Acquisition of red-coloured garments, travel, audience with authority, wellbeing of children and one's employer, rise to a military command position, enthusiasm, wealth through relatives."
  malefic_effects:
    - condition: "Mars in House 6, 8, or 12 from the Antardasha lord, aspected by malefics"
      effect: "Distress to spouse, children and siblings, loss of position, antagonism with close relatives, danger from thieves, wounds, bodily pain."
    - condition: "Mars rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Lethargy and danger of death."
  remedy: "Charity of a cow or a bull."

- id: dasha_jupiter_jupiter
  mahadasha_lord: Jupiter
  antardasha_lord: Jupiter
  summary: >
    Jupiter's own sub-period within its own main period — among the most
    strongly positive readings in the whole system when dignified, and
    correspondingly harsh when afflicted.
  severity: mixed
  benefit_effects:
    - condition: "Jupiter in its exaltation sign, own sign, a Kendra, or a Trikona"
      effect: "Standing comparable to sovereignty over many rulers, great wealth, reverence from authority, gains of cattle/clothes/ornaments/vehicles, construction of a fine new house, opulence and glory, the dawn of good fortune, success in undertakings, meetings with scholars and dignitaries, extraordinary profit through one's employer, spousal/children happiness."
  malefic_effects:
    - condition: "Jupiter in its debilitation sign, debilitated Navamsa, or House 6, 8, or 12"
      effect: "Association with lowly company, great distress, slander from coparceners, an employer's wrath, danger of premature death, separation from spouse and children, loss of wealth and grain."
    - condition: "Jupiter rules House 7 (Yuvati) or House 2 (Dhan)"
      effect: "Bodily pain."
  remedy: "Rudra Japa and recitation of the Shiva Sahasranama."

- id: dasha_jupiter_saturn
  mahadasha_lord: Jupiter
  antardasha_lord: Saturn
  summary: >
    Favourable for status, property and royal connection when Saturn is
    dignified; affliction brings a fairly broad mix of financial, health
    and domestic setbacks.
  severity: mixed
  benefit_effects:
    - condition: "Saturn in its exaltation sign, own sign, a Kendra, or a Trikona, with strength"
      effect: "Acquisition of a position of authority, gains of clothes/ornaments/wealth/grain/vehicles/cattle, happiness through a son and friends, gain of a notably blue-coloured horse, travel to the west, audience with and wealth from a ruler."
    - condition: "Saturn in a Kendra, a Trikona, House 11, or House 2 from the Antardasha lord"
      effect: "Gain of land, a house, a son and cattle; acquisition of riches and property, sometimes even through a rival."
  malefic_effects:
    - condition: "Saturn in House 6, 8, or 12, combust, or in an enemy sign"
      effect: "Loss of wealth, feverish affliction, mental agony, harm to spouse and children, inauspicious domestic events, loss of cattle and employment, antagonism with relatives."
    - condition: "Saturn in House 6, 8, or 12 from the Antardasha lord, or associated with a malefic"
      effect: "Loss of wealth, antagonism with relatives, obstacles in business ventures, bodily pain, danger from family members."
    - condition: "Saturn rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Fear of premature death."
  remedy: "Recitation of the Vishnu Sahasranama, charity of a black cow or a female buffalo."

- id: dasha_jupiter_mercury
  mahadasha_lord: Jupiter
  antardasha_lord: Mercury
  summary: >
    Generally favourable when Mercury is dignified, with the source noting
    a time-phased pattern (good at the start, difficult toward the end)
    even under otherwise mixed placement.
  severity: mixed
  benefit_effects:
    - condition: "Mercury in its exaltation sign, own sign, a Kendra, a Trikona, or associated with the Antardasha lord"
      effect: "Gain of wealth, physical wellbeing, acquisition of a position of authority, gain of vehicles/clothes/cattle."
    - condition: "Mercury in a Kendra, House 5, or its exaltation sign from the Antardasha lord"
      effect: "Wealth gained within one's own country, happiness through parents, acquisition of a vehicle through royal favour."
    - condition: "Mercury associated with a malefic yet still aspected by a benefic (mixed placement)"
      effect: "Enjoyment, gains of wealth/vehicles/clothes early in the Antardasha, though wealth loss and bodily distress tend to appear toward its end."
  malefic_effects:
    - condition: "Mercury aspected by Mars"
      effect: "Growth in the number of rivals, loss of enjoyment and comfort, business loss, feverish/dysenteric affliction."
    - condition: "Mercury in House 6, 8, or 12 from the Antardasha lord, or associated with a malefic without benefic aspect"
      effect: "Loss of wealth, forced foreign travel, danger from thieves while travelling, wounds, burning sensations, eye trouble, prolonged foreign wandering."
    - condition: "Mercury with malefic(s) in House 6, 8, or 12"
      effect: "Unprovoked distress, anger, loss of cattle, business loss, fear of premature death."
    - condition: "Mercury rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Premature death may be expected."
  remedy: "Recitation of the Vishnu Sahasranama — described as the single most effective remedy here, both for longevity and general relief."

- id: dasha_jupiter_ketu
  mahadasha_lord: Jupiter
  antardasha_lord: Ketu
  summary: >
    Modest at best under benefic influence, and one of the harsher
    Antardashas of a Jupiter period when afflicted, though certain house
    placements bring a distinctly different, favourable reading.
  severity: caution
  benefit_effects:
    - condition: "Ketu associated with or aspected by a benefic"
      effect: "Moderate enjoyment and moderate wealth gain (though the source notes this may come via coarse food, food given by others, or wealth acquired through undesirable means)."
    - condition: "Ketu in House 5, 9, 4, or 10 from the Antardasha lord"
      effect: "Acquisition of vehicles (e.g. a palanquin or elephants), royal favour, success in chosen pursuits, business profit, growth in cattle, gain of wealth/clothes through a foreign dignitary."
  malefic_effects:
    - condition: "Ketu in House 6, 8, or 12 from the Antardasha lord, or associated with malefics"
      effect: "Loss of wealth through a ruler's wrath, imprisonment-like restriction, disease, loss of physical strength, antagonism with father and brother, mental agony."
    - condition: "Ketu rules or occupies House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Physical distress."
  remedy: "Mrityunjaya Japa, performed properly."

- id: dasha_jupiter_venus
  mahadasha_lord: Jupiter
  antardasha_lord: Venus
  summary: >
    Favourable for comfort, family and status when Venus is dignified;
    close association with Saturn and/or Rahu is singled out as
    particularly troublesome for marriage and family relations.
  severity: mixed
  benefit_effects:
    - condition: "Venus in a Kendra, a Trikona, or House 11 (Labha), or in its own sign aspected by benefic(s)"
      effect: "Acquisition of vehicles (e.g. a palanquin or elephants), wealth through royal favour, enjoyment, gain of blue and red articles, extraordinary income from eastward travel, family wellbeing, parental happiness, devotion to deities, construction of reservoirs, charitable giving."
    - condition: "Venus in a Kendra, a Trikona, or House 2 from the Antardasha lord"
      effect: "Gain of wealth, spousal happiness, meeting with authority figures, growth in children/vehicles/cattle, enjoyment of music, company of the learned, fine food, help extended to relatives."
  malefic_effects:
    - condition: "Venus in House 6, 8, or 12 from the Antardasha lord or from Lagna, or in its debilitation sign"
      effect: "Quarrels, antagonism with relatives, distress to spouse and children."
    - condition: "Venus associated with Saturn, Rahu, or both"
      effect: "Quarrels, danger from authority, antagonism with one's spouse, disputes with father-in-law and brothers, loss of wealth."
    - condition: "Venus rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Loss of wealth, fear of premature death, antagonism with one's spouse."
  remedy: "Charity of a tawny-coloured cow or a female buffalo."

- id: dasha_jupiter_sun
  mahadasha_lord: Jupiter
  antardasha_lord: Sun
  summary: >
    Favourable for wealth, reputation and family happiness when the Sun is
    dignified; affliction brings low energy/motivation and moral drift
    rather than acute danger.
  severity: mixed
  benefit_effects:
    - condition: "Sun in its exaltation sign, own sign, a Kendra, a Trikona, House 3 (Sahaja), House 11 (Labha), or House 2 (Dhan), with strength"
      effect: "Gain of wealth, reverence, happiness, acquisition of vehicles/clothes/ornaments, birth of children, cordial relations with authority, success in undertakings."
  malefic_effects:
    - condition: "Sun in House 6, 8, or 12 from Lagna or from the Antardasha lord"
      effect: "Nervous disorder, fever, lethargy or reluctance toward good deeds, indulgence in wrongdoing, an antagonistic attitude, separation from relatives, distress without clear cause."
    - condition: "Sun rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Physical distress."
  remedy: "Recitation of the Aditya Hridaya."

- id: dasha_jupiter_moon
  mahadasha_lord: Jupiter
  antardasha_lord: Moon
  summary: >
    Favourable for status, family happiness and religious life when the
    Moon is strong and well-placed; affliction brings loss and displacement
    rather than acute danger.
  severity: mixed
  benefit_effects:
    - condition: "Moon in a Kendra, a Trikona, House 11 (Labha), its exaltation sign, or own sign, full and strong, in an auspicious house from the Antardasha lord"
      effect: "Reverence from authority, opulence and glory, spousal/children happiness, good food, reputation through good deeds, growth in children and grandchildren, comforts through royal favour, religious and charitable inclination."
  malefic_effects:
    - condition: "Moon weak, associated with malefics, or in House 6, 8, or 12 from Lagna or from the Antardasha lord"
      effect: "Loss of wealth and relatives, wandering in foreign lands, danger from authority and thieves, quarrels with coparceners, separation from a maternal uncle, distress to the mother."
    - condition: "Moon rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Physical distress."
  remedy: "Recitation of the Durga Saptashati."

- id: dasha_jupiter_mars
  mahadasha_lord: Jupiter
  antardasha_lord: Mars
  summary: >
    Favourable for celebrations, land and vigour when Mars is dignified;
    affliction is described as front-loaded (worse at the Antardasha's
    start, easing later).
  severity: mixed
  benefit_effects:
    - condition: "Mars in its exaltation sign, own sign, or exalted/own Navamsa"
      effect: "Celebration of functions such as marriage, gain of land or a village, growth in strength and valour, success in undertakings."
    - condition: "Mars in a Kendra, a Trikona, House 11 (Labha), or House 2 (Dhan), aspected by or associated with benefics"
      effect: "Gain of wealth and grain, fine food, royal favour, spousal/children happiness."
  malefic_effects:
    - condition: "Mars in House 8 or House 12 from the Antardasha lord, in its debilitation sign, or aspected by/associated with malefics"
      effect: "Loss of wealth and property, eye trouble — most pronounced at the start of the Antardasha, easing somewhat later."
    - condition: "Mars rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Physical distress and mental agony."
  remedy: "Charity of a bull."

- id: dasha_jupiter_rahu
  mahadasha_lord: Jupiter
  antardasha_lord: Rahu
  summary: >
    Favourable for status and travel/pilgrimage when Rahu is dignified,
    with an emphasis on early gains within the first months of the
    Antardasha; affliction brings domestic and interpersonal conflict.
  severity: mixed
  benefit_effects:
    - condition: "Rahu in its exaltation sign, own sign, its Mulatrikona, a Kendra, a Trikona, aspected by a Kendra lord, or aspected by/associated with a benefic"
      effect: "An inclination toward spiritual practice, gain of wealth and grain especially during the first five months of the Antardasha, standing comparable to authority over a village or region, meeting with a foreign dignitary, family wellbeing, distant travel, pilgrimage bathing."
  malefic_effects:
    - condition: "Rahu associated with a malefic, or in House 8 or House 12 from the Antardasha lord"
      effect: "Danger from thieves/snakes/authority, wounds, domestic troubles, antagonism with siblings and coparceners, unsettling dreams, unprovoked quarrels, danger of disease."
    - condition: "Rahu placed in House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Physical distress."
  remedy: "Mrityunjaya Japa, charity of a goat."

- id: dasha_saturn_saturn
  mahadasha_lord: Saturn
  antardasha_lord: Saturn
  summary: >
    Saturn's own sub-period within its own main period — favourable for
    status and comfort when dignified, but the source describes a
    difficult start and middle even under mixed placement, easing only
    toward the end.
  severity: mixed
  benefit_effects:
    - condition: "Saturn in its own sign, exaltation sign, deep exaltation, a Kendra, a Trikona, or acting as a Yogakaraka"
      effect: "Acquisition of a position of authority, spousal/children happiness, acquisition of vehicles (e.g. elephants), gain of clothes, rise to a military command position through royal favour, acquisition of cattle/villages/land."
  malefic_effects:
    - condition: "Saturn in House 8 or House 12, or associated with malefics in its debilitation sign (early in the Antardasha)"
      effect: "Fear or danger from authority, injury by weapon, bleeding gums, dysentery — followed by danger from thieves, forced travel away from home and mental agony in the middle portion, with the last part of the Antardasha turning favourable."
    - condition: "Saturn rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Danger of premature death."
  remedy: "Mrityunjaya Japa, performed properly, said to bring Lord Shiva's protection."

- id: dasha_saturn_mercury
  mahadasha_lord: Saturn
  antardasha_lord: Mercury
  summary: >
    Favourable for reputation and religious life when Mercury is in a
    Kendra/Trikona; a mixed placement is described as good only at the
    very start, with difficulty in the middle and end.
  severity: mixed
  benefit_effects:
    - condition: "Mercury in a Kendra or a Trikona"
      effect: "Reverence from people, good reputation, gain of wealth, comfort of vehicles, inclination toward religious sacrifice, a Raj Yoga-like rise, bodily wellbeing, enthusiasm, family wellbeing, pilgrimage, religious rites, listening to scripture, charity, fine food."
    - condition: "Mercury in House 6, 8, or 12 from Lagna or the Antardasha lord, or associated with the Sun, Mars, and Rahu (mixed placement)"
      effect: "Acquisition of a position of authority, gain of wealth, and village leadership — but only at the very start of the Antardasha; disease, failure in undertakings, and a sense of anxiety/danger follow in the middle and later parts."
  malefic_effects:
    - condition: "Mercury rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Physical distress."
  remedy: "Recitation of the Vishnu Sahasranama, charity of grain."

- id: dasha_saturn_ketu
  mahadasha_lord: Saturn
  antardasha_lord: Ketu
  summary: >
    Notably, the source describes this Antardasha as difficult by default
    REGARDLESS of Ketu's dignity — good house placement from the
    Antardasha lord specifically (not general strength) is what turns it
    favourable.
  severity: caution
  benefit_effects:
    - condition: "Ketu related to the Lagna lord"
      effect: "Gain of wealth and enjoyment, pilgrimage bathing and a shrine visit — at the start of the Antardasha."
    - condition: "Ketu in a Kendra, a Trikona, House 3, or House 11 from the Antardasha lord"
      effect: "Gain of physical strength and courage, religious inclination, audience with high dignitaries, enjoyments of various kinds."
  malefic_effects:
    - condition: "Default — even with Ketu exalted, in its own sign, a benefic sign, a Kendra, or a Trikona, or aspected by/associated with benefics"
      effect: "Loss of position, various dangers, poverty, general distress, forced travel abroad."
    - condition: "Ketu in House 8 or House 12 from Lagna or the Antardasha lord"
      effect: "Fear of premature death, coarse food, cold-type fever, dysentery, wounds, danger from thieves, separation from spouse and children."
    - condition: "Ketu placed in House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Physical distress."
  remedy: "Charity of a goat, through Ketu's grace."

- id: dasha_saturn_venus
  mahadasha_lord: Saturn
  antardasha_lord: Venus
  summary: >
    Favourable for marriage, family and status when Venus is dignified —
    with a notable transit-based rule layered on top (favourable Jupiter
    or Saturn transits during this Antardasha amplify the good results).
  severity: mixed
  benefit_effects:
    - condition: "Venus in a Kendra, a Trikona, or House 11 (Labha), aspected by or associated with benefics"
      effect: "Marriage, birth of a son, gain of wealth, sound health, family wellbeing, acquisition of a position of authority, enjoyments through royal favour, honours, gain of clothes/ornaments/vehicles and other desired objects. If Jupiter is favourably transiting during this Antardasha, fortune dawns and property grows further; if Saturn is favourably transiting, Raj Yoga-like or yogic-attainment effects follow."
    - condition: "Venus in House 9 (Dharma), House 11 (Labha), or a Kendra from the Antardasha lord"
      effect: "Fulfilled ambitions through royal favour, charitable giving, religious rites, interest in scriptural study, composing poetry, interest in Vedanta, listening to scripture, spousal/children happiness."
  malefic_effects:
    - condition: "Venus in its debilitation sign, combust, or in House 6, 8, or 12"
      effect: "Distress to one's spouse, loss of position, mental agony, quarrels with close relations."
    - condition: "Venus in House 6, 8, or 12 from the Antardasha lord"
      effect: "Eye trouble, fevers, decline in good conduct, dental problems, heart disease, arm pain, danger of drowning or falling from a height, conflict with officials and brothers."
    - condition: "Venus rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Physical distress."
  remedy: "Favour of Goddess Durga through recitation of the Durga Saptashati, charity of a cow or a female buffalo."

- id: dasha_saturn_sun
  mahadasha_lord: Saturn
  antardasha_lord: Sun
  summary: >
    Favourable for career/employer relations and family when the Sun is
    dignified; affliction brings health and reputational strain.
  severity: mixed
  benefit_effects:
    - condition: "Sun in its exaltation sign, own sign, associated with the lord of House 9 (Dharma), or in a Kendra/Trikona aspected by/associated with benefics"
      effect: "Good relations with one's employer, family wellbeing, happiness through children, gain of vehicles and cattle."
  malefic_effects:
    - condition: "Sun in House 8 or House 12 from the Antardasha lord"
      effect: "Heart-related disease, defamation, mental agony, separation from close relatives, obstacles in business ventures, fevers, fears, loss of relatives, loss of cherished possessions."
    - condition: "Sun rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Physical distress."
  remedy: "Worship of the Sun."

- id: dasha_saturn_moon
  mahadasha_lord: Saturn
  antardasha_lord: Moon
  summary: >
    Favourable for family and material comfort when the Moon is strong;
    a waning or afflicted Moon brings a notably domestic, health-tinged
    kind of distress, though the very start of the Antardasha is described
    as good regardless.
  severity: mixed
  benefit_effects:
    - condition: "Moon full, in its exaltation sign, own sign, a Kendra, a Trikona, or House 11 from the Antardasha lord, or aspected by benefics"
      effect: "Gains of vehicles/garments/ornaments, improvement of fortune, enjoyments, care for one's siblings, happiness in both the maternal and paternal family, growth in cattle wealth."
    - condition: "Moon in a Kendra, a Trikona, or House 11 from the Antardasha lord"
      effect: "Enjoyment of vehicles and garments, happiness through relatives, parents, spouse and employer."
  malefic_effects:
    - condition: "Moon waning, associated with/aspected by malefics, in its debilitation sign, a malefic Navamsa, or the sign of a malefic planet (good effects and some wealth gain are still noted at the very start of the Antardasha)"
      effect: "Great distress, anger, separation from parents, children's poor health, business losses, irregular meals, need for medication."
    - condition: "Moon weak and placed in House 6, 8, or 12 from the Antardasha lord"
      effect: "Sleepiness, lethargy, loss of position, loss of enjoyment, growth in the number of rivals, antagonism with relatives."
    - condition: "Moon rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Lethargy and physical distress."
  remedy: "Havan (fire ritual), charity of jaggery, ghee, rice mixed with curd, a cow, or a female buffalo."

- id: dasha_saturn_mars
  mahadasha_lord: Saturn
  antardasha_lord: Mars
  summary: >
    Favourable for status, property and family from the very start when
    Mars is dignified; affliction brings a fairly severe list of physical
    and financial dangers.
  severity: mixed
  benefit_effects:
    - condition: "Mars in its exaltation sign, own sign, or associated with the Lagna lord or the Antardasha lord"
      effect: "Enjoyments, gain of wealth, reverence from authority, gain of vehicles/clothes/ornaments, rise to a military command position, growth in agricultural and cattle wealth, construction of a new house, relative happiness — evident from the very start of the Antardasha."
  malefic_effects:
    - condition: "Mars in its debilitation sign, combust, or in House 8 or House 12, aspected by/associated with malefics"
      effect: "Loss of wealth, danger of wounds, danger from thieves/snakes/weapons, gout-like disease, distress to father and brothers, disputes with coparceners, loss of relatives, coarse food, forced travel abroad, unnecessary expenditure."
    - condition: "Mars placed in House 2 (Dhan), or rules House 7 (Yuvati)/House 8 (Randhr)"
      effect: "Great distress, dependence on others, fear of premature death."
  remedy: "Havan (fire ritual), charity of a bull."

- id: dasha_saturn_rahu
  mahadasha_lord: Saturn
  antardasha_lord: Rahu
  summary: >
    Difficult by default unless Rahu is exalted or otherwise auspiciously
    placed — a rare Antardasha where the source frames the negative
    outcome as the baseline expectation.
  severity: caution
  benefit_effects:
    - condition: "Rahu associated with the Lagna lord or a Yogakaraka planet, in its exaltation sign, own sign, a Kendra, or House 11 from Lagna or the Antardasha lord"
      effect: "Enjoyment, gains of wealth, growth in agricultural output, devotion to deities and Brahmins, pilgrimage, growth in cattle wealth, family wellbeing at the start of the Antardasha, with cordial relations with authority and happiness through friends in the middle portion."
    - condition: "Rahu in Aries, Virgo, Cancer, Taurus, Pisces, or Sagittarius"
      effect: "Acquisition of elephants, opulence and glory, cordial relations with authority, gains of valuable clothes."
  malefic_effects:
    - condition: "Rahu NOT in its exaltation sign or another auspicious position"
      effect: "Quarrels, mental agony, physical distress, agony, antagonism with one's sons, danger of disease, unnecessary expenditure, discord with close relatives, danger from authority, forced foreign travel, loss of house and agricultural land."
    - condition: "Rahu associated with the lord of House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Physical distress."
  remedy: "Mrityunjaya Japa, charity of a goat."

- id: dasha_saturn_jupiter
  mahadasha_lord: Saturn
  antardasha_lord: Jupiter
  summary: >
    Favourable for status, family and religious life when Jupiter is
    dignified; affliction brings loss of close relatives among its more
    severe listed effects.
  severity: mixed
  benefit_effects:
    - condition: "Jupiter in a Kendra, a Trikona, associated with the Lagna lord, in its own sign, or exaltation sign"
      effect: "All-round success, family wellbeing, gain of vehicles/ornaments/clothes through royal favour, reverence, devotion to deities and one's teacher, company of the learned, spousal/children happiness."
    - condition: "Jupiter in House 5, 9, 11, or 2, or a Kendra from the Antardasha lord"
      effect: "Opulence and glory, spousal happiness, gains through authority, comfort of good food and clothes, religious inclination, national reputation, interest in scripture, performance of religious rites, charitable giving of grain."
  malefic_effects:
    - condition: "Jupiter in its debilitation sign, associated with malefics, or in House 6, 3, or 12"
      effect: "Death of close relatives, loss of wealth, conflict with officials, failed projects, forced foreign travel, affliction with serious disease."
    - condition: "Jupiter weak and placed in House 6, 8, or 12 from the Antardasha lord"
      effect: "Antagonism with relatives, mental agony, quarrels, loss of position, losses in undertakings, loss of wealth through fines/penalties, imprisonment-like restriction, distress to spouse and son."
    - condition: "Jupiter rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Physical distress, agony, and — in the most severe reading — death of the native or a family member."
  remedy: "Recitation of the Shiva Sahasranama, charity of gold."

- id: dasha_mercury_mercury
  mahadasha_lord: Mercury
  antardasha_lord: Mercury
  summary: >
    Mercury's own sub-period within its own main period — favours learning,
    reputation and family happiness when well-placed, with digestive/health
    complaints as the main risk under affliction.
  severity: mixed
  benefit_effects:
    - condition: "Mercury in its exaltation sign, or otherwise well placed"
      effect: "Gain of jewels such as pearls, growth in learning, increased happiness, performance of virtuous deeds, success in education, name and fame, meetings with new rulers, gain of wealth and happiness through spouse, children and parents."
  malefic_effects:
    - condition: "Mercury in its debilitation sign, House 6, 8, or 12, or associated with malefics"
      effect: "Loss of wealth and cattle, antagonism with relatives, stomach-related disease, and — for those in government service — an austere, dutiful posture rather than personal gain."
    - condition: "Mercury rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Distress to one's spouse, death within the family, rheumatism and stomach ailments."
  remedy: "Recitation of the Vishnu Sahasranama."

- id: dasha_mercury_ketu
  mahadasha_lord: Mercury
  antardasha_lord: Ketu
  summary: >
    Favourable for education, reputation and cattle wealth when Ketu is
    supported by benefics or well-placed; malefic association brings
    accident/legal-type dangers.
  severity: mixed
  benefit_effects:
    - condition: "Ketu associated with benefics in a Kendra or Trikona, conjunct the Lagna lord or a Yogakaraka, or in a Kendra/House 11 from the Antardasha lord"
      effect: "Physical fitness, modest wealth gain, affectionate relations with relatives, growth in cattle wealth, income from business/industry, success in education, name and fame, honours, royal audience, comfort of clothes."
  malefic_effects:
    - condition: "Ketu conjunct malefics in House 8 or House 12 from the Antardasha lord"
      effect: "Falling from a vehicle, distress concerning a son, danger from authority, involvement in wrongdoing, danger from scorpions, quarrels with subordinates, sorrow, disease, association with lowly company."
    - condition: "Ketu rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Physical distress."
  remedy: "Charity of a goat."

- id: dasha_mercury_venus
  mahadasha_lord: Mercury
  antardasha_lord: Venus
  summary: >
    Favourable for wealth, property and religious life when Venus is well
    placed; affliction brings health complaints tied to the heart and
    digestion.
  severity: mixed
  benefit_effects:
    - condition: "Venus in a Kendra, House 11 (Labha), House 5 (Putra), or House 9 (Dharma)"
      effect: "Inclination toward religious rites, ambitions fulfilled with the help of authority and friends, gain of agricultural land, general happiness."
    - condition: "Venus in a Kendra, House 5, House 9, or House 11 from the Antardasha lord"
      effect: "Acquisition of a position of authority, gain of wealth and property, construction of a reservoir, readiness for charity and religious rites, extraordinary wealth and business gains."
  malefic_effects:
    - condition: "Venus weak and placed in House 6, 8, or 12 from the Antardasha lord"
      effect: "Heart-related disease, defamation, fevers, dysentery, separation from relatives, physical distress and agony."
    - condition: "Venus rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Fear of premature death."
  remedy: "Recitation of mantras of Goddess Durga."

- id: dasha_mercury_sun
  mahadasha_lord: Mercury
  antardasha_lord: Sun
  summary: >
    Favourable for fortune and friendship when the Sun is dignified, with
    additional benefit noted from supportive aspects; affliction brings
    danger and separation from friends.
  severity: mixed
  benefit_effects:
    - condition: "Sun in its own sign, exaltation sign, a Kendra, a Trikona, House 2 (Dhan), House 11 (Labha), exalted Navamsa, or own Navamsa"
      effect: "Dawn of fortune through royal favour, happiness through friends."
    - condition: "Sun additionally aspected by Mars"
      effect: "Acquisition of land."
    - condition: "Sun additionally aspected by the Lagna lord"
      effect: "Comforts of good food and clothes."
  malefic_effects:
    - condition: "Sun in House 6, 8, or 12 from Lagna or the Antardasha lord, weak, and associated with Saturn, Mars and Rahu"
      effect: "Fear or danger from thieves/fire/weapons, bilious trouble, headaches, mental agony, separation from friends."
    - condition: "Sun rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Fear of premature death."
  remedy: "Worship of the Sun."

- id: dasha_mercury_moon
  mahadasha_lord: Mercury
  antardasha_lord: Moon
  summary: >
    Described as forming a particularly strong favourable Yoga under
    certain placements, bringing marriage, family and material gains
    together; affliction is comparatively narrow (mainly financial/marital
    strain) by contrast.
  severity: mixed
  benefit_effects:
    - condition: "Moon in a Kendra or a Trikona from Lagna, in its exaltation sign, own sign, aspected by/associated with Jupiter, or itself acting as a Yogakaraka"
      effect: "A particularly strong combination: marriage, birth of a son, gain of clothes and ornaments, construction of a new house, fine food, enjoyment of music, study of scripture, southward travel, gain of clothes from overseas, gain of gems such as pearls."
    - condition: "Moon in a Kendra, a Trikona, House 3, or House 11 from the Antardasha lord"
      effect: "At the start of the Antardasha: visits to sacred shrines, patience, enthusiasm, gains of wealth from foreign countries."
  malefic_effects:
    - condition: "Moon in its debilitation sign or an enemy sign"
