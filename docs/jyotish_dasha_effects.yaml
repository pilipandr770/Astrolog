    - condition: "Saturn rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Physical distress."
  remedy: "Havan with sesame seeds, Mrityunjaya Japa, recitation of the Durga Saptashati (by oneself or through a Brahmin)."

- id: dasha_venus_mercury
  mahadasha_lord: Venus
  antardasha_lord: Mercury
  summary: >
    Favourable for fortune, family and scholarly life when Mercury is
    dignified; the source describes a clear three-phase arc under
    affliction (fair start, moderate middle, feverish end).
  severity: mixed
  benefit_effects:
    - condition: "Mercury in a Kendra, a Trikona, or House 11 (Labha) from Lagna or the Antardasha lord, in its exaltation sign, or own sign"
      effect: "Dawn of fortune, birth of a son, gain of wealth through legal/judicial matters, listening to Puranic stories, company of accomplished poets, visits from close friends, happiness through one's employer, fine food."
  malefic_effects:
    - condition: "Mercury in House 6, 8, or 12 from the Antardasha lord, weak, or associated with a malefic"
      effect: "Agony, loss of cattle, having to live in others' houses, business losses — some good effects at the start of the Antardasha, moderate in the middle, and feverish distress toward the end."
    - condition: "Mercury rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Physical distress."
  remedy: "Recitation of the Vishnu Sahasranama."

- id: dasha_venus_ketu
  mahadasha_lord: Venus
  antardasha_lord: Ketu
  summary: >
    Favourable from the very start when Ketu is dignified, including a
    notable "victory" theme toward the end; affliction brings a fairly
    broad mix of physical and financial troubles. This is the final
    Antardasha of the 120-year Vimshottari cycle before it repeats.
  severity: mixed
  benefit_effects:
    - condition: "Ketu in its exaltation sign, own sign, related to a Yogakaraka planet, or possessed of positional strength (the source itself notes there is no universally agreed rule for which house gives Ketu positional strength)"
      effect: "Fine food, unusually large professional gains, growth in cattle wealth from the very start of the Antardasha, with a distinct victory (e.g. in a dispute or competitive undertaking) toward its end. Moderate results are typical in the middle portion, sometimes with a sense of distress mixed in."
  malefic_effects:
    - condition: "Ketu in House 8 or House 12 from the Antardasha lord, or associated with a malefic"
      effect: "Danger from snakes/thieves/wounds, loss of clarity of thought, headache, agony, quarrels without cause, diabetes-like ailment, excessive expenditure, antagonism with spouse and children, forced foreign travel, losses in undertakings."
    - condition: "Ketu rules House 2 (Dhan) or House 7 (Yuvati)"
      effect: "Physical distress."
  remedy: "Mrityunjaya Japa, charity of a goat. Remedies for appeasing Venus (the Mahadasha lord) are also said to help here."
