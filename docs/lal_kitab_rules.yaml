# Правила Лал Китаб — структурированные данные для app/services/lal_kitab.py
#
# Источник: Pt. Beni Madhav Goswami / Pt. Laxmi Kant Vashisth, "Lal Kitab
# (Red Book of Astrology) with remedies" (по изданию 1952 г.), archive.org.
# Полный текст: docs/lal_kitab_source/primary_source/gosvami_1952.txt
#
# Формат и дизайн-решения по condition/effect — см. docs/LAL_KITAB_NOTES.md.
#
# СТАТУС: заполнены все 9 планет/узлов (Jupiter, Sun, Moon, Mars, Venus,
# Mercury, Saturn, Rahu, Ketu) — 12/12 домов каждая (108 правил). Осталась
# отдельная глава про Rin (кармические долги, Chapter 6 первоисточника) и
# логика спящих/пробуждённых домов (не YAML-правило, а код) — см.
# docs/LAL_KITAB_NOTES.md.

- id: jupiter_house_1
  planet: Jupiter
  house: 1
  summary: >
    Jupiter in House 1 makes one a King or a Hermit — high learning, long
    life and fortune flow. Father's Debt (Rin) can bring illiteracy to the
    family line; malefic Sun/Saturn or a weak House 8/11 destroy the benefit.
  severity: mixed
  benefit_effects:
    - condition: "House 7 has any planet (friend or enemy) and no enemy of Jupiter in House 1"
      effect: "Good education, high degree. Saturn decides financial status."
    - condition: "In addition to above, Mercury is also exalted"
      effect: "Native gifted with many types of learning. Will be king-like."
    - condition: "Ketu exalted"
      effect: "Benefit to parents at ages 4, 8, 16. Happy life till 75; reaches peak of fortune."
    - condition: "Moon exalted"
      effect: "Comforts increase with age. Pious, respected King or Minister; becomes a Sanyasi in old age; public welfare measures."
    - condition: "No enemy planets of Jupiter in Houses 1,2,5,9,11,12, and House 7 has benefic planets or their aspect"
      effect: "Bountiful inheritance."
    - condition: "House 11 has benefic planets or aspect on it"
      effect: "Benefit from yellow things. Service to women/wife/cow brings wealth. Venusian pleasures in plenty."
    - condition: "House 7 blank"
      effect: "Prosperity/growth after marriage or Venus-related business damages father if married before 28, or in 24th/27th year, or builds with earnings, or begets a child."
    - condition: "Sun, Moon or Mars in Houses 1, 2, 4"
      effect: "Earnings from royal court extremely high."
    - condition: "Mars in House 7"
      effect: "Bountiful property. Father may be well off. Royal connections."
    - condition: "Houses 2, 3, 4, 8 have benefic planets"
      effect: "Long life of 75+ (maternal uncle's life may be shortened)."
    - condition: "Sun in House 9"
      effect: "Lives as long as he desires; longevity common in the family."
  malefic_effects:
    - condition: "Poor Mercury / enemy or mutually inimical planets in Houses 2,5,9,12, and Moon in House 4"
      effect: "Native would be poor, illiterate but magnanimous."
    - condition: "Father's Debt (Rin) — enemy planets of Jupiter (Mercury, Venus, Saturn, Rahu) in Houses 2, 5, 9, 12"
      effect: "Evil effects on Jupiter-related items; Jupiter makes up for it in the second life-round (after age 49) if not in the first 35-year cycle."
    - condition: "Rahu with Jupiter, or Rahu in Houses 2,5,9,12"
      effect: "Hardship all around; mischief of others; Rahu-related items spoil Jupiter around age 8 or 12."
    - condition: "Venus with Jupiter, or Venus in Houses 2,5,9,12"
      effect: "Destroys wife or Venus-related items around age 13-15."
    - condition: "Mercury with Jupiter, or Mercury in Houses 2,5,9,12"
      effect: "Damage/loss of wealth around age 16, 19 or 21."
    - condition: "Saturn with Jupiter, or Saturn as an evil planet in Houses 2,5,9,12"
      effect: "After age 36 (esp. after 42), Saturn-related items cause damage; urinary/anal tract health issues; frightful events."
    - condition: "Saturn in House 5"
      effect: "Buildings made by self after 42 become a source of unhappiness and damage health."
    - condition: "Saturn in House 9"
      effect: "Damage to health."
    - condition: "Saturn malefic, or in company of its enemies Sun/Mars"
      effect: "Offspring unhappy and a source of unhappiness to self."
    - condition: "Natal/malefic Saturn comes to House 7 during ages 18-27, or in annual chart"
      effect: "Separation from father, starts own business, family burden falls on native."
    - condition: "Sun dormant/poor in Houses 9 & 11, or Sun-Mercury in malefic houses"
      effect: "Loss of money in litigation/conflicts even when decision favors the native."
    - condition: "Jupiter dormant (House 7 blank), or enemy/evil planets (Mercury, Venus, Rahu, Saturn / Rahu, Ketu, Saturn) in Houses 8, 11"
      effect: "Ridiculed by all; cursing others spoils own fortune; early marriage (before 22) beneficial; Mars-related work helps."
    - condition: "Rahu in Houses 8 or 11"
      effect: "Father's death from heart failure/asthma around native's age 42, or eyes filled with sorrow, madness, or disease."
  remedy: null
  source: "Goswami 1952, 'Jupiter in House No. 1', pp. 327-332"

- id: jupiter_house_2
  planet: Jupiter
  house: 2
  summary: >
    House 2 is Jupiter's best position ("real position, wherein Moon gets
    exalted") — never polluted by evil planets; a person with Jupiter here
    does not have to make an effort to earn.
  severity: positive
  benefit_effects:
    - condition: "Houses 2,6,8 benefic and House 12 not malefic, or evil effect of Houses 8,10 does not reach House 2 (or Venus in Houses 2,6,8 under the same condition)"
      effect: "Hidden wealth, lottery, or inheritance from the issueless."
    - condition: "Any planet (enemy or friend of Jupiter) in Houses 8, 9, 10, 12"
      effect: "Jupiter removes all obstacles. Happiness and money from children; independent, forward-looking, optimistic."
    - condition: "Sun, Mercury or Saturn in House 8"
      effect: "Firm determination, independent, forward-looking."
    - condition: "Saturn with Jupiter or in adjoining/aspecting house"
      effect: "Learned; decisions rest on Saturn; lack of education won't hurt his fortune."
    - condition: "Saturn in House 12"
      effect: "Brave like Napoleon. Happy. Position of leadership."
    - condition: "House 8 blank and one of Sun/Moon/Saturn/Rahu/Mercury in House 6"
      effect: "Large family, strong, self-willed, highly respected."
    - condition: "Rahu benefic but not dormant"
      effect: "Honoured like a King, generous. Helpful, honoured everywhere; worldly comforts in plenty even without landholding."
    - condition: "Jupiter in House 2 unpolluted and alone, and House 9 is neither malefic nor occupied by Mercury/Venus/Rahu"
      effect: "Royal connection for 27 years. Wealth from in-laws. Lottery, hidden wealth, help from father."
    - condition: "Mars in House 8"
      effect: "Lover of truth."
    - condition: "Mars in House 9"
      effect: "Man of power and authority."
    - condition: "Mercury in House 8"
      effect: "Intelligent and a good planner."
    - condition: "Saturn in House 8"
      effect: "Renunciate, melancholy, gloomy."
    - condition: "Rahu in House 8"
      effect: "Bold and powerful."
    - condition: "Rahu in House 9"
      effect: "Intelligent and learned."
    - condition: "Ketu in House 8"
      effect: "Honest, sharp intelligence."
    - condition: "Ketu in House 9"
      effect: "Man of power and authority, successful and comfortable."
    - condition: "Ketu in House 6"
      effect: "Will know of his own death in advance."
    - condition: "Sun in House 10 or 12"
      effect: "Famous and respected."
    - condition: "Sun, Mercury, Saturn in House 8"
      effect: "Firm determination, bold."
  malefic_effects:
    - condition: "Houses 2 & 8 polluted, e.g. Moon-Mars in House 8 or Mars-negative in House 2"
      effect: "Destroys own tribe/family; Ketu gives first indication of the pollution."
    - condition: "Saturn in House 2 (natal or transit)"
      effect: "Damage to health. Financial loss to in-laws."
    - condition: "House 8 blank"
      effect: "Jupiter's malefic effect w.r.t. Rahu; unlucky to those he visits (not to himself); Ketu indicates it."
    - condition: "A malefic planet in Houses 2 & 8, or spoiling Jupiter's effect through aspect"
      effect: "Unhappy nights, poor health, adulterous wife."
    - condition: "Venus in House 8 and Saturn in House 10"
      effect: "Loss of wealth, poor elders' health, self in jail."
    - condition: "Mercury in House 8, Saturn in House 10"
      effect: "Loss of prestige, hardship, disease, false allegations."
    - condition: "Mercury, Venus, Rahu, or Saturn (as evil) in Houses 8 & 10"
      effect: "Jealous of others (Mercury in House 9)."
  remedy: >
    Treat the planet occupying House 8 as per its own remedy (Mercury,
    Venus, Rahu, Saturn). Treat Jupiter itself when Jupiter is malefic.
    Treat Sun when Mercury+Rahu in House 1; treat Moon when Venus in
    House 1; treat Jupiter when Saturn in House 1. Treat Saturn when
    Mercury/Rahu malefic in House 10; treat Moon when Venus in House 10.
    Whenever Saturn transits into House 2, give milk to serpents.
  source: "Goswami 1952, 'Jupiter in House No. 2', pp. 332-337"

- id: jupiter_house_3
  planet: Jupiter
  house: 3
  summary: >
    Jupiter in House 3 gives learning, intelligence, comforts and
    conveyance, provided Mercury stays benefic; worship of Durga or a
    minor girl removes Mercury's "poison" and unlocks the benefit.
  severity: mixed
  benefit_effects:
    - condition: "Jupiter unpolluted and alive, with Mars benefic/exalted in House 2, or Sun/Moon/Mars in House 2 and Jupiter in the annual chart is in House 3"
      effect: "Like a guardian of the three worlds — long life, learned, fine health, wealthy, prosperous; luck from siblings; prosperity age 26-46."
    - condition: "Jupiter unpolluted; some planet in House 11"
      effect: "Respect, good living."
    - condition: "Some planet in House 9"
      effect: "Good results from start to end of earning career; benefits from joint family living."
    - condition: "Friendly planets (Sun, Moon, Mars) in House 5"
      effect: "Gains after birth of a child."
    - condition: "Saturn in House 9"
      effect: "Long life and life-long prosperity; salvages self and others."
    - condition: "Mars in House 2, or Saturn in House 9"
      effect: "Rich, comforts of all types."
    - condition: "Saturn exalted"
      effect: "Courageous. Government position. Foreign-affairs connections."
    - condition: "Mercury in House 7"
      effect: "Clever. Good judge of others."
  malefic_effects:
    - condition: "Jupiter dormant or in company of enemy planets (Mercury, Sun, Rahu, Ketu, Saturn)"
      effect: "One-track mind; extremes of generosity or animosity; given to self-praise which destroys him; coward, unhappy, poor luck, prone to blood problems and unhappy children (Ketu's malefic effect)."
    - condition: "Saturn in House 4 and malefic Mercury"
      effect: "Will become rich by robbing others; treacherous, especially toward maternal uncle and children; irreligious, unscrupulous; relatives unhappy till age 31; may be a warrior but unlucky."
  remedy: "Seek blessings of maidens. Undertake Durga worship (Durgapaath)."
  source: "Goswami 1952, 'Jupiter in House No. 3', pp. 337-339"

- id: jupiter_house_4
  planet: Jupiter
  house: 4
  summary: >
    Jupiter gets exalted in House 4 — fame, spiritual strength, abundance
    of servants/property/wealth, provided no enemy planet of Jupiter
    (Mercury, Venus, Saturn, Rahu) sits in Houses 2,5,9,11,12.
  severity: mixed
  benefit_effects:
    - condition: "Mercury, Venus, Rahu, Saturn (as evil) not in Houses 2,5,9,11,12"
      effect: "Would keep learning till 24; fatherly, brave, beneficiary of govt favours, hidden wealth, property not owned by anyone."
    - condition: "Benefic male planets (Sun & Mars) present"
      effect: "Father would hold or attain a high official position of power and authority."
    - condition: "Moon in House 1, and Saturn in House 10"
      effect: "All comforts of travel."
    - condition: "Moon in House 2"
      effect: "Fortune decided by Saturn/Rahu condition; if benefic, widely known, excellent results."
    - condition: "Moon in a house other than House 2"
      effect: "Even a poor Moon gives excellent results, though medical expenses stay uncertain."
    - condition: "Ketu benefic, or in company/aspect of benefic planets"
      effect: "Education expenses rewarded; long life if character stays high."
    - condition: "Mercury exalted, or Sun in House 10"
      effect: "Learned but of uncertain wealth; talented; brings honour and monetary government benefit."
    - condition: "Saturn in Houses 2, 9, 10"
      effect: "Famous, pious, saviour of all, excellent house, comforts of all kinds."
    - condition: "Rahu exalted"
      effect: "Mother (Moon alive) gives benefit."
  malefic_effects:
    - condition: "Mercury in House 10 (transits to House 4 in years 11,23,34,48,55,71,75,85,97,119)"
      effect: "From age 34, involvement in illicit liaisons destroys him and his lineage — reckless, self-destructive, though elders' advice can save him."
    - condition: "Saturn weak (e.g. by killing snakes, demolishing buildings, drinking, illicit relations)"
      effect: "Draws happiness from alcohol/meat/debauchery; craves cheap publicity; eyesight affected; Ketu turns unfavorable."
    - condition: "Venus, Mercury, Saturn or Rahu in House 10"
      effect: "Money and respect in jeopardy."
    - condition: "Rahu poor"
      effect: "Items of silver (animate or inanimate) become a source of loss."
    - condition: "House 10 blank"
      effect: "Jupiter dormant; avoiding public nudity/exposure keeps him from poverty."
    - condition: "Ketu poor"
      effect: "Reduces a King to a pauper; flees to the jungle in panic."
    - condition: "Moon (mother) alive/established"
      effect: "Obstruction to education so long as mother is alive."
  remedy: null
  source: "Goswami 1952, 'Jupiter in House No. 4', pp. 339-342"

- id: jupiter_house_5
  planet: Jupiter
  house: 5
  summary: >
    Jupiter in House 5 prospers with each addition to the family; a son
    born on Thursday, or Saturn in House 9, brings especially strong
    results; Parent's Debt (Rin) or malefic Ketu spoil progeny.
  severity: mixed
  benefit_effects:
    - condition: "Sun, Moon, Rahu-Ketu, Saturn, Mercury benefic"
      effect: "Will have progeny; cheerful and fortunate."
    - condition: "Rahu benefic"
      effect: "Senior Army/Ruler position with many loyal subordinates."
    - condition: "Sun, Moon, Mars (friendly planets) in House 9"
      effect: "No dearth of money or children; progeny achieves higher status. A son born on Thursday accelerates prosperity, but a subsequent child brings downfall."
    - condition: "Houses 2,5,9,11,12 not occupied by Mercury, Venus, Rahu or Saturn (as evil)"
      effect: "Elders and progeny happy; benefits like Jupiter in House 9."
    - condition: "Saturn in House 9 (natal or transit)"
      effect: "A son born on Saturday brings 60 years of prosperity, though no benefit from Jupiter-related items/relatives."
    - condition: "Saturn exalted"
      effect: "Increase in honour and respect; Jupiter even more benefic."
  malefic_effects:
    - condition: "Ketu in House 11"
      effect: "Taking money in the name of religion/charity leaves him issueless and penniless at death."
    - condition: "Ketu poor"
      effect: "Poor progeny."
    - condition: "Mercury, Venus, Rahu, Saturn (as evil, enemy planets of Jupiter) in Houses 2,5,9,11,12"
      effect: "Even with decent children he destroys himself; bad periods around ages 25 (Venus), 34 (Mercury), 42 (Rahu), 8 (Ketu), and 36-39 (Saturn), improving after. Effect falls on maternal uncle/his children rather than himself; treating Ketu helps."
    - condition: "Rahu in House 9"
      effect: "Jupiter becomes silent/ineffective but does not disappear."
    - condition: "Rahu malefic"
      effect: "Like a Sadhu begging for alms; bad period and hardship all around."
  remedy: null
  source: "Goswami 1952, 'Jupiter in House No. 5', pp. 342-344"

- id: jupiter_house_6
  planet: Jupiter
  house: 6
  summary: >
    Jupiter in House 6 gives things unsolicited via elders/relatives, but
    Saturn's condition decides whether the native ends up a King or a
    pauper; hard work is still required for real prosperity.
  severity: mixed
  benefit_effects:
    - condition: "Mercury, Venus, Saturn, Rahu not in Houses 2,5,9,12, but friendly planets (Sun, Moon, Mars) may be there"
      effect: "Results like Moon in House 6; Mercury and Ketu give honour; children well-placed and honoured; self fully provided for without needing to earn, though wealth stays modest."
    - condition: "Mercury excellent"
      effect: "Selfish, self-contented, fond of the good life."
    - condition: "Ketu excellent"
      effect: "Good conduct leads to a good/happy life."
  malefic_effects:
    - condition: "Mercury malefic"
      effect: "Hardship till age 34."
    - condition: "Ketu malefic"
      effect: "Lives like a beggar; treating Ketu helps."
  remedy: "Treat Ketu when Ketu is malefic."
  source: "Goswami 1952, 'Jupiter in House No. 6', pp. 344-346"

- id: jupiter_house_7
  planet: Jupiter
  house: 7
  summary: >
    Jupiter in House 7 does not naturally give family comfort or wealth
    (outward show, hollow within) in a male chart, though it is favourable
    for wealth/progeny in a female chart; death is destined to happen at home.
  severity: mixed
  benefit_effects:
    - condition: "Saturn in House 7 or 9 (Fish Line)"
      effect: "Rich and in the forefront of religious work; assets increase through female support; travel brings good luck, death never occurs while travelling."
    - condition: "Ketu exalted"
      effect: "Deeply involved in spiritualism; money not guaranteed."
    - condition: "Mercury exalted"
      effect: "Benefic results of both Jupiter and Mercury; comfortable youth."
    - condition: "Rahu exalted"
      effect: "Astrologer; knows secrets of the world."
    - condition: "Sun in House 1"
      effect: "Used to comfortable life, though not very wealthy."
    - condition: "Sun, Moon, Mars (friendly planets) in Houses 5, 9, 12"
      effect: "Maintains high standards for parents; well-known in religious affairs, though not very wealthy."
  malefic_effects:
    - condition: "Mars positive conjoined with Mercury"
      effect: "Love for widows, filthy lifestyle, poverty; possibly a thief/cheat; craving for learning in youth; no comfort in old age if he neglects his children."
    - condition: "House 1 or House 2 blank (Jupiter dormant)"
      effect: "Struggles for survival even if rich."
    - condition: "Jupiter in House 7 itself getting polluted"
      effect: "No help from brothers; no good government position."
    - condition: "Mercury, Venus, Rahu, Saturn (as evil) in Houses 5, 7, 9, 12"
      effect: "If Venus malefic — loss of son; asthma for father-in-law/grandfather; dust instead of gold."
    - condition: "Saturn or Mercury in Houses 2, 6, 12"
      effect: "Yearns for a son till age 45; self destroyed thereafter."
    - condition: "Saturn or Mercury malefic in Houses 9, 11"
      effect: "Stammers; age, fortune and religion all suffer."
    - condition: "Mars negative"
      effect: "Excess intellectual pursuits make old age uncomfortable."
  remedy: "Treat Moon during the malefic condition."
  source: "Goswami 1952, 'Jupiter in House No. 7', pp. 346-348"

- id: jupiter_house_8
  planet: Jupiter
  house: 8
  summary: >
    Jupiter in House 8 grants divine help at times of adversity — as long
    as elders are alive, age and prosperity increase, and keeping gold on
    the body wards off harm.
  severity: mixed
  benefit_effects:
    - condition: "Houses 2 and 4 excellent"
      effect: "Good fortune; becomes rich from rags; no anxiety on health, money or family."
    - condition: "Moon benefic and House 12 excellent"
      effect: "All-round prosperity; long life; capacity to read hidden secrets."
    - condition: "Mars benefic or beneficially linked with House 2"
      effect: "Gains strength to help those in distress."
    - condition: "Venus in Houses 2, 6, 8"
      effect: "Abundant prosperity; six sons with long life; will not remain issueless."
    - condition: "Mercury not in House 9"
      effect: "Long life for self and father; becomes a contractor."
  malefic_effects:
    - condition: "Saturn or Mars in Houses 4, 7"
      effect: "Adversity and sadness; deathly storms in life."
    - condition: "Jupiter malefic/conjoined with enemy planets"
      effect: "Disrepute from illegal liaisons."
    - condition: "Mars poor or negative"
      effect: "Long life but debts, poor health, misfortune."
    - condition: "Mercury, Venus, Rahu, Saturn as evil planets in Houses 2,5,9,12"
      effect: "Short life."
    - condition: "Mercury poor"
      effect: "Small-heartedness, poverty, sickness, unforeseen adversity."
    - condition: "House 12 blank"
      effect: "Blood loss; poverty and physical discomfort; cowardly, diseased."
    - condition: "Sun poor"
      effect: "No luck."
    - condition: "Rahu malefic"
      effect: "Lustreless life."
    - condition: "Ketu malefic"
      effect: "Poor, narrow-minded, coward."
    - condition: "Saturn stronger than Jupiter (Saturn in House 2)"
      effect: "Everything goes haywire; lack of determination, independent thought, ambition."
  remedy: "Give Mercurial and Venusian things in a temple."
  source: "Goswami 1952, 'Jupiter in House No. 8', pp. 348-350"

- id: jupiter_house_9
  planet: Jupiter
  house: 9
  summary: >
    Jupiter in House 9 brings golden prosperity through religiosity and
    elders' help, though the native himself has little love for wealth
    (a Yogi at heart); Rahu/Ketu/Saturn as enemies in House 5 harm progeny.
  severity: mixed
  benefit_effects:
    - condition: "Mercury, Venus, Saturn, Rahu (enemy planets) not in Houses 2,5,9,11"
      effect: "Man of word and determination; Yogic condition decided by House 2's planets."
    - condition: "Mercury in House 4 or 5"
      effect: "Yogic King."
    - condition: "Sun alive/benefic"
      effect: "Never irreligious; success in life, good health."
    - condition: "Saturn in House 5"
      effect: "Saturn's period (age 36-39) determines prosperity; a lot of wealth but not good for children."
    - condition: "Venus & Moon in Houses 3, 5 aspecting Jupiter in House 9"
      effect: "Fluctuating wealth/poverty."
    - condition: "Male planets in Houses 3, 5 aspecting House 9"
      effect: "Jupiter becomes three times more powerful; bountiful wealth."
  malefic_effects:
    - condition: "Jupiter weakened by aspect of enemy planets"
      effect: "Poor, atheist; may denounce the world."
    - condition: "Mercury, Venus, Saturn, Rahu (enemy planets) in House 5"
      effect: "Self-centred, selfish, poor progeny; unhappiness from children."
    - condition: "House 1 blank"
      effect: "Poor health, heart problem."
    - condition: "Houses 3 & 5 both blank"
      effect: "Life full of struggle."
    - condition: "Mercury malefic"
      effect: "Short life, like the malefic effect of Mars-negative."
  remedy: "Bathe in the Ganges river. Keep your promises."
  source: "Goswami 1952, 'Jupiter in House No. 9', pp. 350-352"

- id: jupiter_house_10
  planet: Jupiter
  house: 10
  summary: >
    Jupiter is debilitated in House 10 — an ascetic ruing deprivation
    unless destiny/conduct or Saturn's help intervenes; Sun or Mars/Venus
    in House 4 can turn this "dust to gold".
  severity: mixed
  benefit_effects:
    - condition: "Saturn benefic and Sun or Moon in Houses 2 and 6"
      effect: "Living in a Jupiterean house or near a temple enlists Saturn's support; cleverness is the key to success; ordinary iron becomes like a gold bar."
    - condition: "Mars or Venus in House 4"
      effect: "Dust turns to gold, provided no secret liaisons (legal multiple wives permitted)."
    - condition: "Sun in House 4"
      effect: "Jupiter no longer debilitated — becomes exalted, turns burnt stone to gold."
    - condition: "Mars in House 4"
      effect: "Mars-related items become excellent till age 28, with brothers' help."
    - condition: "Saturn in House 2"
      effect: "All-round prosperity."
    - condition: "Sun in Houses 3, 5, and Saturn in House 9"
      effect: "Benefit from gold/silver work, but Saturnian things harmful (risk of arson)."
    - condition: "Sun or Moon in House 2"
      effect: "Travels connected with royal matters; pearls all around."
    - condition: "Sun in Houses 1, 4, 5"
      effect: "Adverse effects transfer to grandfather, not father."
    - condition: "Mercury benefic and not destroying Jupiter"
      effect: "All male children; copper becomes gold; prosperity."
  malefic_effects:
    - condition: "Saturn poor/malefic"
      effect: "Unnecessary expenses; communal and cruel; decisions go against him; loss of wealth."
    - condition: "Moon in House 4, or Saturn in Houses 1,4,10"
      effect: "Punished for helping the poor; blamed by others."
    - condition: "Ketu destroyed"
      effect: "Gold turns into dust (treat Ketu or Jupiter)."
    - condition: "Saturn in Houses 1,4,10 and House 2 blank"
      effect: "Poor all around; no respect, no prosperity; struggles for a morsel of bread though health stays good."
    - condition: "House 2 blank"
      effect: "Scarcity of wealth but God-fearing with good health."
    - condition: "Houses 2,4,5,6 all blank"
      effect: "Unfortunate loner in family; no help from others; repeated deaths of wives."
    - condition: "Sun in House 5, Mercury in Houses 4,9,10"
      effect: "An alarm of poverty for father; father may die of blood poisoning while native is young."
    - condition: "Sun in Houses 3,5 and Saturn in House 9"
      effect: "Poor results with Saturnian items — fire, poison, conflict."
    - condition: "Sun, Saturn, Mercury in Houses 4,5,9"
      effect: "Wife, wealth, children, travel all adversely affected."
    - condition: "Saturn supporting Jupiter (still malefic combination)"
      effect: "Anybody in contact suffers; ill repute; extreme poverty."
  remedy: >
    Perforate the nose. Keep nostrils clean. Apply saffron on the
    forehead. Throw a copper coin in water for 40/43 days.
  source: "Goswami 1952, 'Jupiter in House No. 10', pp. 352-355"

- id: jupiter_house_11
  planet: Jupiter
  house: 11
  summary: >
    Jupiter in House 11 is fixed and benefits from religiosity (up to 11x
    the benefit) as long as family ties hold; separating "like a tree of
    dates" turns it malefic, and Jupiter's fate here leans on Saturn.
  severity: mixed
  benefit_effects:
    - condition: "House 3 blank"
      effect: "Jupiter dormant; decision rests on Saturn, but this is good for the native."
    - condition: "Sun, Moon, Mars (friendly planets) in House 3"
      effect: "Good life for 23 years, then darker times again."
    - condition: "Sun, Moon, Mars in House 5"
      effect: "Support of relatives brings luck; 12 very auspicious years, less so afterward."
    - condition: "Sun in Houses 1,4,5"
      effect: "Results of royal throne and copper-related work excellent; malefic effects of Jupiter transfer to grandfather."
    - condition: "Rahu in House 9"
      effect: "Jupiter dormant but does not disappear."
    - condition: "Mercury benefic, or Mercury in House 9"
      effect: "Free gains of Jupiter unavailable, but self-earning prospers."
    - condition: "Saturn benefic"
      effect: "Mars also helpful and useful; even without help from father, native is happy."
    - condition: "Saturn in House 10 and Mercury in House 2, or Saturn in House 11"
      effect: "Both Saturn & Jupiter give benefic results."
  malefic_effects:
    - condition: "Moon in House 1, or Jupiter dormant/polluted through aspect"
      effect: "Excess of sex/romance proves destructive since romance destroys Jupiter here."
    - condition: "Mercury in House 6 and Moon in House 2"
      effect: "Painful old age; 90th year of life bad; poor eyesight."
    - condition: "House 3 polluted"
      effect: "Death in his own family, though in-laws stay happy."
    - condition: "Mars in House 3"
      effect: "Unhappy wife; debts even while earning well, due to lack of father's support."
  remedy: "Keep a yellow handkerchief. Provide coffins for the dead (charitable act)."
  source: "Goswami 1952, 'Jupiter in House No. 11', pp. 355-357"

- id: jupiter_house_12
  planet: Jupiter
  house: 12
  summary: >
    Jupiter in House 12 is helpful, benevolent, learned and detached —
    "praying for others does not reduce one's own stock"; Rahu decides
    finances, Ketu decides religiosity.
  severity: positive
  benefit_effects:
    - condition: "Saturn alone/adjoining or in House 9"
      effect: "Benefit from Saturnian things (motor cars, machinery); comfortable nights; royal position, though anxiety about life's exit."
    - condition: "Saturn alone/adjoining or in Houses 2, 11"
      effect: "'Fish line' in Saturnian things; still a philanthropist."
    - condition: "Rahu exalted in House 6"
      effect: "Jupiter becomes master of both worlds; fond of children, spendthrift, protected from enemies; good condition at death."
    - condition: "Rahu's effect on Jupiter, or Rahu linked with House 9"
      effect: "If Rahu benefic, copper becomes gold — otherwise vice versa."
    - condition: "Ketu exalted"
      effect: "Ketu decides religiosity; extremely wealthy and comfortable."
  malefic_effects:
    - condition: "Mercury malefic"
      effect: "Unlucky for others, but his own life will be long."
    - condition: "Jupiter dormant or polluted by enemy planets"
      effect: "Evil works cause death to the native; gets only ash if he begs."
  remedy: null
  source: "Goswami 1952, 'Jupiter in House No. 12', pp. 357-359"

- id: sun_house_1
  planet: Sun
  house: 1
  summary: >
    Sun in House 1 (with 5, 11) makes one a pious King — matured outlook,
    self-made wealth, long life, though a built-in influence of Saturn
    always causes some disharmony.
  severity: mixed
  benefit_effects:
    - condition: "Sun in House 1 with friendly planets, or aspected by them"
      effect: "Self-earning, not a slave of money."
    - condition: "Moon in House 2, Saturn in House 11, and Mercury-Venus aspecting each other"
      effect: "Man of power, rank and authority; excellent luck and wealth; no hurdle in job/business."
    - condition: "Mercury in House 7"
      effect: "No vices; religious and pious; Venus and Ketu favourable."
    - condition: "Venus and Mercury aspect each other"
      effect: "Earnings excellent even if Sun is eclipsed."
  malefic_effects:
    - condition: "Sun in Houses 1, 5, 11 (Saturn's influence always at ~25%)"
      effect: "Trapped in vice habits despite power/authority/religiosity. Giving meat to a crow occasionally reduces Saturn's effect."
    - condition: "Venus in House 7"
      effect: "Father dies at an early age; wife sickly, especially with daytime intimacy."
    - condition: "Mars in House 5"
      effect: "Loss of several sons."
    - condition: "Saturn in House 8"
      effect: "Loss of several wives."
    - condition: "House 7 blank (dormant Sun)"
      effect: "Should marry before age 24; a Sun awakened later (after job/business) stays malefic for 24 years."
    - condition: "Jupiter, Mars, Moon (friendly planets) all malefic"
      effect: "All planets deceive; dark life, even suicidal tendency; miserable fortune."
  remedy: "Boring a hand pump in the ancestral house wards off evil effects after 10 years."
  source: "Goswami 1952, 'Sun in House No. 1', pp. 370-371"

- id: sun_house_2
  planet: Sun
  house: 2
  summary: >
    Sun in House 2 is a generous friend and powerful person as long as
    wealth is self-earned; accepting free milk/donations dilutes the Sun,
    while generosity destroys enemies.
  severity: mixed
  benefit_effects:
    - condition: "Sun linked with Jupiter, or Jupiter in Houses 2,5,6,8,9,10,12 but not linked with Saturn"
      effect: "Comfort of conveyance; mother's brother prospers; enemies perish within 11 days/months/years of age; rank, power, authority for a charitable native."
    - condition: "Moon in House 6"
      effect: "Sun and Moon become even more favourable."
    - condition: "Sun unpolluted"
      effect: "Skilled worker, does his own work; bold nature drives prosperity via agriculture/medicine."
    - condition: "Mercury in House 8"
      effect: "Skillful and practical."
    - condition: "Rahu in House 8"
      effect: "Painter."
    - condition: "Rahu in House 9"
      effect: "Colourful person."
    - condition: "Mars in House 9"
      effect: "A skilled technician; man of taste."
    - condition: "Ketu in House 9 with Mars, or Mercury in House 9"
      effect: "Fond of publicity; multi-faceted personality."
    - condition: "Ketu in House 8"
      effect: "Honest and truthful."
    - condition: "House 8 blank"
      effect: "Sun favourable for self and House 2 items."
    - condition: "Saturn in House 10"
      effect: "Well-respected, intelligent, wealthy."
    - condition: "Saturn in House 11"
      effect: "Changeable nature — happy, then depressed; grows through good company."
    - condition: "House 3 benefic"
      effect: "Enemies subordinate; parents, uncles, in-laws, sister/daughter's family, wife and sons all benefit; hard-working, efficient, self-reliant."
  malefic_effects:
    - condition: "Sun alone in House 2 (unfavourable for Venus-ruled items — wife, potato, ghee, aluminum, camphor, hornless cow, music, taste, aunts)"
      effect: "Conflict with relatives over wife; litigation is a source of ruin; short-lived wives/sisters/mother unless Saturn is propitiated."
    - condition: "Moon in House 8"
      effect: "Should not accept donations or deal in corrupt practices/bribes — only self-earning blesses him."
    - condition: "Mars in House 8"
      effect: "Greedy."
    - condition: "Sun and Mars in House 1, Moon in House 12"
      effect: "Greedy and miserable; life full of difficulties and turmoil."
  remedy: >
    Donate oil, almond, coconut in a temple to mitigate Saturn's evil
    effects. Avoid accepting donations of wheat or barley.
  source: "Goswami 1952, 'Sun in House No. 2', pp. 372-374"

- id: sun_house_3
  planet: Sun
  house: 3
  summary: >
    Sun in House 3 gives a wealthy, self-made person as long as character
    stays good — fate and nature help him even if his parents are penniless.
  severity: mixed
  benefit_effects:
    - condition: "Good character overall"
      effect: "Handsome, earns well by his own efforts; Mars/Moon/Venus/Mercury results also favourable; long life for his children too; strength to scare death; rich, magnanimous, harsh on falsehood."
    - condition: "Mercury with or adjoining Sun"
      effect: "Proficient in mathematics, astrology and allied subjects (avoid material from theft, which causes deprivation)."
    - condition: "Moon strong"
      effect: "Blessed with wealth till old age; descendants rise and please him in old age."
  malefic_effects:
    - condition: "Moon weak"
      effect: "Not immune to theft/burglary even in daytime."
    - condition: "House 9 weak"
      effect: "Father and grandfather poor."
    - condition: "House 11 weak"
      effect: "Neighbours unlucky; maternal uncle a source of trouble."
    - condition: "Mercury or Rahu-Ketu-Saturn afflicted/weak/malefic"
      effect: "Sun gives malefic results though his own luck holds; unlucky for others though."
  remedy: null
  warning: >
    If the man's character is questionable, he cannot prosper regardless
    of how favourable Mars is — nature helps, but life stays miserable
    unless he also helps and looks after others.
  source: "Goswami 1952, 'Sun in House No. 3', pp. 374-375"

- id: sun_house_4
  planet: Sun
  house: 4
  summary: >
    Sun in House 4 makes one toil to save wealth for children (secret
    wealth); Mars decides the condition of the family; greed/theft destroy
    one's own bank balance.
  severity: mixed
  benefit_effects:
    - condition: "Moon in Houses 4, 5"
      effect: "Benefit through new inventions."
    - condition: "Mercury in House 10 and Moon benefic"
      effect: "Gain through journeys connected with state/business affairs."
    - condition: "Jupiter in House 10"
      effect: "Blessed with wealth; sober nature; Jupiter benefic."
    - condition: "Jupiter in House 4 and Moon benefic"
      effect: "New ventures (not tried by elders) prove beneficial; gains through voyages, gold/silver dealing; Mars not negative."
    - condition: "Moon, Venus conjoin/adjoin Sun"
      effect: "Favour from parents; lucky, good-natured like his father."
    - condition: "Mercury conjoins/adjoins Sun"
      effect: "Gain through voyages; good business."
    - condition: "Venus, Moon with Jupiter"
      effect: "Support of parents; good luck."
    - condition: "Mars alive"
      effect: "Soft temperament, patient."
  malefic_effects:
    - condition: "Sun afflicted by malefic planets and weak"
      effect: "Greed, deception, theft, bad habits cause havoc; thievish nature; troubled life; accused of cheating; own house 'on fire'."
    - condition: "Saturn in House 7, or Rahu-Ketu-Saturn malefic"
      effect: "Children unlucky and vice-prone; possible night blindness."
    - condition: "Rahu weak in House 1, Saturn in House 1, Jupiter in House 10"
      effect: "Evil effects of Sun; remedy of Moon, then Saturn, helps; coral/red things helpful."
    - condition: "Rahu malefic and Saturn in House 1, Jupiter in House 10"
      effect: "Sun malefic; in-law items connected to malefic planets are harmful; Moon remedy plus treating Sun for Saturn's malefic effect helps."
    - condition: "Jupiter in House 10 (alternate combination)"
      effect: "Loss of jewellery through theft; loss in iron/wooden dealings; possible fire damage, though gain via cloth/silver/parental business."
    - condition: "Mars in House 10"
      effect: "May become one-eyed but lucky; becomes unscrupulous; possibly a eunuch."
    - condition: "Moon in Houses 1 or 2, Venus in House 5, Saturn in House 7"
      effect: "All planets except Mars give malefic results; distributing free food to blind persons helps offset 5th/10th house issues."
    - condition: "Favourable Moon/Jupiter in House 4 but Mars negative"
      effect: "Unhappy, unpleasant married life and unworthy children; keeping another's wife risks becoming issueless."
  remedy: "Give alms/food to ten blind persons to clear the poison of Houses 5 and 10."
  source: "Goswami 1952, 'Sun in House No. 4', pp. 375-378"

- id: sun_house_5
  planet: Sun
  house: 5
  summary: >
    Sun in House 5 makes one the master of family welfare — prosperity
    grows financially after a son's birth, provided jealousy does not
    break the native's heart.
  severity: mixed
  benefit_effects:
    - condition: "Jupiter in Houses 9, 10; Moon in House 4; Venus in Houses 2, 7"
      effect: "Man of authority, power and wealth — a royal combination."
    - condition: "Saturn in House 11"
      effect: "Dutiful and lucky children, lucky life, gain from parents and comforts."
    - condition: "Saturn and Venus (enemies of Sun) still present"
      effect: "Respected everywhere; Sun helps even its enemies here."
    - condition: "Mars in Houses 1, 8; Mercury in Houses 3, 6; Rahu-Ketu-Saturn in Houses 9, 11"
      effect: "All five come under Sun's control and give benefic results."
    - condition: "Moon in House 4"
      effect: "Renowned, King-like life."
    - condition: "Jupiter benefic"
      effect: "All wishes fulfilled before death; feeding a red-faced monkey enhances Sun's benefic effects."
  malefic_effects:
    - condition: "Jupiter in House 10"
      effect: "Death or separation/divorce of spouse; more than one marriage."
    - condition: "Saturn in House 3"
      effect: "Death of sons; troubled life; financial difficulties for surviving children."
  remedy: null
  source: "Goswami 1952, 'Sun in House No. 5', pp. 378-380"

- id: sun_house_6
  planet: Sun
  house: 6
  summary: >
    Sun in House 6 ("burnt by fire") brings no real anxiety over wealth —
    the native is satisfied with his luck as long as he doesn't break with
    tradition (e.g. the ancestral house's rear wall).
  severity: mixed
  benefit_effects:
    - condition: "Moon, Mars, Jupiter in House 2 and Sun alive"
      effect: "Should follow old customs; son-in-law prospers."
    - condition: "Ketu in Houses 1, 7 (natal or transit)"
      effect: "Indicates birth of a son, career uplift and gain; after age 48, financial comforts without needing remedy."
  malefic_effects:
    - condition: "House 2 blank"
      effect: "At age 22, father or native gains through government service but the two cannot stay in the same place; donating food for a dog at a religious place helps."
    - condition: "Moon weak/afflicted, Rahu-Ketu in House 5"
      effect: "Donations at religious places support father's health/finances/longevity."
    - condition: "Mars in House 10"
      effect: "Adverse circumstances at ages 11, 21, 22."
    - condition: "Mercury in House 12"
      effect: "Native's sons will die; keeping Moon-items by the bedside at night and distributing them in the morning mitigates this."
    - condition: "Rahu or Saturn in House 1"
      effect: "Misery, troubles, blood pressure, career/finance downfall."
    - condition: "Rahu in House 2 and Saturn in House 8 / Moon in House 12"
      effect: "Fortune eclipsed; parents may start well but suffer downfall after age 6-12; crisis ends around age 45-48 when Ketu transits Houses 1,7."
    - condition: "Rahu in House 1 and Ketu in House 7 / Saturn in House 12"
      effect: "Adverse effect on position/finance; taking donations from others at religious places helps; loss of an eye for native or wife; opening the rear wall of the ancestral house causes misery; damage to wife."
  remedy: >
    Give jaggery to a monkey during malefic effects on progeny, or
    propitiate Mercury. Extinguish the evening cooking fire with milk
    when troubled by superiors/authorities.
  source: "Goswami 1952, 'Sun in House No. 6', pp. 381-383"

- id: sun_house_7
  planet: Sun
  house: 7
  summary: >
    Sun in House 7 gives a small family and a slow/apprehensive death — "a
    King without a crown" who must toil for prosperity; a blank House 1
    makes House 7 dormant.
  severity: mixed
  benefit_effects:
    - condition: "Mercury, Jupiter or Saturn benefic in Houses 2, 3 or 5"
      effect: "Earns outside the ancestral place but dies back home."
    - condition: "Saturn, Mercury or Ketu in House 2"
      effect: "Wife not so lucky; troubles from others."
    - condition: "Jupiter, Moon or Mars in House 2"
      effect: "A man of kingly rank and position."
    - condition: "Mercury exalted, or Mars/Mercury in House 7"
      effect: "Good income and wealth, though the native's intelligence is uncertain."
  malefic_effects:
    - condition: "Venus or Rahu-Ketu present"
      effect: "Some woman remains his liability; in-laws troubled; he himself becomes wealthy and powerful."
    - condition: "Jupiter, Venus or Rahu-Ketu in House 1 and Mercury weak/afflicted, or Mercury in House 9"
      effect: "Multiple family deaths, career reversals, bronchitis/TB, afflicted health till 34; suicide risk, fire loss; rash/ill temperament, possibly mentally deranged."
    - condition: "Sun in House 7 with Mercury weak or ill-aspected (not supporting Sun)"
      effect: "Destruction of royal wealth."
    - condition: "Mars or Saturn in Houses 2, 12 and Moon in House 1"
      effect: "Everything ruined after his birth."
    - condition: "Ketu in House 1, or Mercury in House 11"
      effect: "Afflicted with white spots on skin."
    - condition: "House 1 blank"
      effect: "Below-average condition generally; gains in profession/wealth when an 8th-house planet transits House 2; favourable ages: 13,29,41,54,64,72,78,86,98,119."
  remedy: >
    Keep a clean, sober outlook; be a strong administrator and a
    soft-spoken businessman. If Saturn afflicts Sun from House 1, remedy
    of Moon helps (extinguish the cooking firepan with milk for 43 days,
    then discard it in running water). Embed square copper pieces
    underground, or start work after drinking sweet water, when finances
    and family circumstances are poor. Serve a black or hornless cow.
  source: "Goswami 1952, 'Sun in House No. 7', pp. 384-387"

- id: sun_house_8
  planet: Sun
  house: 8
  summary: >
    Sun in House 8 is "a King with a Saint's heart" — scares away death,
    gives long life and rising prosperity from the age ruled by Sun (22),
    though becomes evil in company of Mercury.
  severity: mixed
  benefit_effects:
    - condition: "Friendly planets in House 1, or along/adjoining Sun, or Mars positive"
      effect: "Mars and Saturn give benefic results instead of malefic; benefic results of Sun and friendly planets."
  malefic_effects:
    - condition: "Saturn in House 3, Jupiter poor in Houses 1-5, or Mars negative"
      effect: "Short life; risk of fire/misfortune if living in a south-facing house, or if not the eldest, or separated from his brother."
    - condition: "Venus in Houses 1, 5, 10"
      effect: "'Crow Line' effect (misery)."
    - condition: "Jupiter polluted"
      effect: "Saves others from death while his own destiny goes haywire."
    - condition: "Mercury in House 2"
      effect: "Poor financial condition."
  remedy: "Take some sweet water before starting out from home. Do not serve a white cow."
  source: "Goswami 1952, 'Sun in House No. 8', pp. 387-389"

- id: sun_house_9
  planet: Sun
  house: 9
  summary: >
    Sun in House 9 gives long life and a full family — like the Sun after
    an eclipse, becoming a source of strength for the family, provided he
    does not accept donations, silver, or bribes.
  severity: mixed
  benefit_effects:
    - condition: "Linked with friendly planets"
      effect: "All male family members enjoy long life."
    - condition: "Mercury in House 5"
      effect: "Life prospers after age 34."
  malefic_effects:
    - condition: "Mercury conjoined with Sun, or Mercury in Houses 3, 5"
      effect: "Unfavourable effects of Sun; keeping brass utensils at home reduces Mercury's poison."
    - condition: "Rahu in Houses 3, 5"
      effect: "Should keep a moderate temperament; otherwise no faith in religion and hankers after pleasure."
  remedy: "Donation of silver enhances Sun's benefic effects. Avoid accepting silver donations or bribes."
  source: "Goswami 1952, 'Sun in House No. 9', pp. 389-390"

- id: sun_house_10
  planet: Sun
  house: 10
  summary: >
    Sun in House 10 gives health, respect and wealth but a suspicious
    nature (apparently truthful, inwardly cunning); Sun alone here is
    generally malefic.
  severity: mixed
  benefit_effects:
    - condition: "General placement, headgear observed correctly"
      effect: "Gain from government, comfort of servants and conveyance, good health — but should wear white/light-pink headgear, never black/blue."
  malefic_effects:
    - condition: "Moon weak/poor in Houses 5 or 6 and Jupiter/Mars not supporting"
      effect: "Medium lifespan, diseased body, loss of wealth and respect."
    - condition: "Moon in House 5 unsupported by male planets"
      effect: "Only 12 days of age."
    - condition: "Moon in House 4"
      effect: "Loss of mother, loss of conveyance, though a man of power and authority."
    - condition: "Venus weak/malefic in House 4"
      effect: "Loss of father at an early age."
    - condition: "Moon exalted in House 2"
      effect: "Mother dies or becomes seriously ill around age 24, though native becomes wealthy and powerful."
    - condition: "A malefic planet in Houses 6 and 7"
      effect: "Unlucky till age 34; parents also unlucky, no children, no status — respected by all eventually."
    - condition: "Saturn malefic"
      effect: "A man of power and authority still; Saturn's 19-year major period troubles father, causes separation and wealth loss; well/hand-pump water, or 10 days bathing on a riverbed, helps."
    - condition: "House 4 blank"
      effect: "Education and intelligence go to waste; throwing a copper piece in running water for 40/43 days helps."
  remedy: "Wear white or light-pink headgear, never black/blue."
  source: "Goswami 1952, 'Sun in House No. 10', pp. 390-392"

- id: sun_house_11
  planet: Sun
  house: 11
  summary: >
    Sun in House 11 is religious but self-centred/greedy, though
    forgiving — giving up meat and liquor brings three sons; eating meat
    (Saturn items) risks becoming issueless.
  severity: mixed
  benefit_effects:
    - condition: "Native is vegetarian and religious"
      effect: "Blessed with a son early; comfortable long life; man of power and authority; not afflicted by Saturn-linked vices → three good, lucky sons; gains from government."
  malefic_effects:
    - condition: "Sun alone in House 11"
      effect: "Loss of self-made house, loss of finances, sickly/short-lived children."
    - condition: "Native is non-vegetarian"
      effect: "Deprived of a son till age 45, especially if the house sits on a street corner with a tree in the courtyard."
    - condition: "Mercury and Saturn malefic"
      effect: "Ruined; liar, loose habits, cheat, enemy of his own father; deprived of a son (till 45) if non-vegetarian/drinking; donating a live male goat helps."
    - condition: "Moon in House 8, Mercury in House 3, and a malefic Saturn"
      effect: "Long life but given to vice habits."
    - condition: "Moon in House 5"
      effect: "Short age of only 12 years for a son, or a stillborn son; keeping carrots/radish/turnips/almonds by the bedside at night and donating them at a religious place in the morning helps."
  remedy: "Donate white vegetables (radish); keep Saturn-items like almonds at the bedside and give them away in the morning. Avoid accepting Saturn-linked gifts."
  source: "Goswami 1952, 'Sun in House No. 11', pp. 392-394"

- id: sun_house_12
  planet: Sun
  house: 12
  summary: >
    Sun in House 12 is a carefree King with comfortable sleep, though
    "burnt by fire lit by others" — getting involved in others' problems,
    bail, or legal evidence is unfavourable.
  severity: mixed
  benefit_effects:
    - condition: "Saturn in House 6"
      effect: "Domestic bliss."
    - condition: "Ketu in House 2"
      effect: "Starts earning from age 24; pleasurable and comfortable life."
    - condition: "General religiosity observed"
      effect: "Happy domestic life; more religious → more comforts/wealth; a small flour mill business (Venus-Mercury) sustains wealth; may be highly propertied, knowledgeable, and brave."
  malefic_effects:
    - condition: "Sun alone in House 12"
      effect: "Sad, afflicted eyes, mental problems, tortured by others; jealousy, dark housing, false evidence, bail issues bring Sun's evil effects."
    - condition: "Rahu-Ketu and Saturn in House 1"
      effect: "No benefic effect from Rahu items; head injury; afflicted marital relations; ill repute and enemies; loss in Saturn-linked business/machinery, though Mercury's exalted effect can still bring business gains as the courtyard grows."
    - condition: "Moon in House 6"
      effect: "Native or his wife (or both) loses one eye."
  remedy: >
    Service to Sadhus and Venus-related care (rearing) helps. Observe
    religiosity; do not give false evidence.
  source: "Goswami 1952, 'Sun in House No. 12', pp. 394-395"

- id: moon_house_1
  planet: Moon
  house: 1
  summary: >
    Moon in House 1 is like pure milk and wealth — long life and abundance
    while the native obeys/honours his mother; selling milk or dairy
    business is inauspicious, and the spouse tends to stay unhappy.
  severity: mixed
  benefit_effects:
    - condition: "Sun, Mars or Jupiter in Houses 4, 10"
      effect: "Gains through sea voyages; should seek mother's blessing before/after the journey."
    - condition: "Houses 7, 8 have benefic planets"
      effect: "Very wealthy."
    - condition: "Moon alive (a planet in House 7) or aspected by benefics/friends"
      effect: "Blessed with ancestral or self-made property."
    - condition: "Jupiter in House 4 and Saturn in House 10"
      effect: "Comforts of conveyance and wealth."
    - condition: "Venus in House 7"
      effect: "Good domestic environment; keeping a dog in the house after marriage protects children."
    - condition: "Venus-Mercury or Mars-Mercury in House 7"
      effect: "Highly comfortable life, provided House 8 is not malefic."
    - condition: "Mercury in House 7, unaspected by malefics"
      effect: "Flow of wealth through voyages."
  malefic_effects:
    - condition: "Saturn or Sun in House 6"
      effect: "Miserably poor status."
    - condition: "Jupiter in House 11"
      effect: "Harmful philandering even after marriage; if he marries before 28, mother/mother-in-law/grandmother/brothers become diseased and unlucky."
    - condition: "Mercury weak and afflicted, or House 8 weak, or Mars negative"
      effect: "Troubled and unhappy life."
  remedy: >
    Drink milk from a silver glass (plain glass is malefic for progeny).
    Water peepal trees. Sleep in a bed with copper nails in its four legs.
    Establish Venus (e.g. via a cow) in House 7 to awaken a dormant Moon.
    Throw a copper coin in running water before long trips (100+ days).
    Do not deal in milk/dairy as a business.
  source: "Goswami 1952, 'Moon in House No. 1', pp. 405-408"

- id: moon_house_2
  planet: Moon
  house: 2
  summary: >
    Moon in House 2 brings self-earned wealth — temple bells ringing in
    the house cause childlessness; keeping items associated with Moon at
    home preserves inheritance and blessings.
  severity: mixed
  benefit_effects:
    - condition: "Rahu-Ketu & Saturn not in Houses 4,6,9,10,12"
      effect: "Mother's longevity assured till age 48; if they are present, Jupiter's position determines her condition instead."
    - condition: "Moon alive"
      effect: "Good position with in-laws."
    - condition: "Venus strong and benefic"
      effect: "Favourable Moon; a successful lover."
  malefic_effects:
    - condition: "Ketu in House 12"
      effect: "Loss of either education or children."
    - condition: "Sun in House 1"
      effect: "Troublesome period age 25, or 25-75 if extended."
    - condition: "Saturn in House 10"
      effect: "Uncomfortable old age, particularly the 75th year."
    - condition: "Jupiter in House 11"
      effect: "Painful old age, particularly the 90th year."
    - condition: "Mercury in House 6"
      effect: "Defective eyesight and a malefic Saturn."
    - condition: "Rahu-Ketu & Saturn in Houses 9, 10, 12"
      effect: "Afflicted health or mother's longevity doubtful around ages 9, 18 or 36."
    - condition: "Mercury in House 3 and Jupiter in House 9"
      effect: "Troubled career/profession/business; donating green cloth to maidens for 40/43 days remedies this."
    - condition: "Mercury, Venus in House 1 (enemies), or Rahu-Ketu in Houses 1,2,7,11"
      effect: "Malefic effect of all these planets, though all are remediable."
    - condition: "Houses 1, 2, 7, 10, 11 malefic"
      effect: "Malefic effects of Moon in House 2; Jupiter and Venus also give poor results."
  remedy: "Embed silver foils in the bed's foundation; give a green cloth to maidens for 43 days."
  source: "Goswami 1952, 'Moon in House No. 2', pp. 408-410"

- id: moon_house_3
  planet: Moon
  house: 3
  summary: >
    Moon in House 3 protects against theft and death ("scares away
    death") — unbounded wealth if the native cares for siblings; elevates
    the native to great heights regardless of birth circumstances.
  severity: positive
  benefit_effects:
    - condition: "Mercury strong and Moon alive"
      effect: "Pious, brave, wealthy life; no theft of property; few family deaths; treat Mercury if Rahu/Ketu malefic; either parent (especially mother) stays supportive."
    - condition: "Houses 9 & 11 blank"
      effect: "Every third day/month/year favourable; Venus and Mars favourable; fewer sons but plentiful daughters."
    - condition: "Mercury weak and Moon in House 1, or Mercury in House 11"
      effect: "Both Moon and Mercury favourable; favourable years 2,15,27,39,51,63,75,87,99,111; respect of ladies is a precondition for prosperity."
    - condition: "Sun in House 1, Saturn in House 11, Mercury in House 5, Jupiter in House 9 (benefic)"
      effect: "Royal Combination — ancestral property, gains and comforts through parents."
    - condition: "Mars in House 4"
      effect: "Gain through milk/cattle business; cattle breeding is a source of gain."
    - condition: "Mercury in House 11"
      effect: "Intelligent, wealthy, clear-hearted, brave, though not overly generous; 50 years of life."
  malefic_effects:
    - condition: "8th house lord unfavourable, or the native's 8th year (Mars not negative but polluted by/destroyed via Saturn)"
      effect: "Loss of wealth and downfall/ruin; serving guests with at least milk or water wards this off."
    - condition: "Weak Moon at the birth of a daughter"
      effect: "Heavy losses unless Moon-items are donated and Mercury propitiated."
    - condition: "Mars or Mercury-Mars in House 10"
      effect: "Mars-items unfavourable for mother/brother, leading to separation or jealousy (not unfavourable for self); House 3 acts like Moon in House 11 (zero effect)."
    - condition: "Mars malefic or in House 10, and Ketu in House 11"
      effect: "Combined Mars-Moon malefic for mother/brother — separation or hostility, but not malefic for self."
  remedy: >
    Donate Moon-items at the birth of a sister/daughter; donate Sun-items
    at the birth of a son; marry off a daughter or donate Sun-items
    (non-glittering) at times of loss/scandal/theft; rear a horse or
    partridge for wealth.
  source: "Goswami 1952, 'Moon in House No. 3', pp. 411-414"

- id: moon_house_4
  planet: Moon
  house: 4
  summary: >
    Moon in House 4 grows wealth as one spends it ("as one spends, so
    grows his wealth") — donation multiplies wealth, while selling milk
    destroys it.
  severity: mixed
  benefit_effects:
    - condition: "Jupiter in House 6"
      effect: "Ancestral property and business gains, though borrowers won't repay loans."
    - condition: "Four planets including Moon in House 4"
      effect: "Fourfold increase in wealth; Mercury and Venus help the Moon."
    - condition: "Saturn in Houses 9 or 11"
      effect: "Favourable, gentle — a jewel of the family."
    - condition: "Jupiter/Sun in House 5"
      effect: "Wealthy from the date of a son's birth."
    - condition: "Jupiter in Houses 2, 9, Sun in House 5, or Venus-Mars in House 10"
      effect: "Voyages/import-export bring immense wealth; very comfortable, pleasurable life."
    - condition: "Moon alone in House 4"
      effect: "Venus and Mars very favourable, confer wealth/respect through rulers and voyages; wealth grows with spending; mother's support helps."
    - condition: "Venus alone in House 7"
      effect: "Stays away from the opposite sex."
  malefic_effects:
    - condition: "Rahu in House 10"
      effect: "Head injury; Rahu unfavourable for all Mercury-related items/relations."
    - condition: "Moon conjoined with any two other planets"
      effect: "Malefic effect of all planets — Mars/Saturn can be malefic, but Rahu-Ketu in Houses 2,6,8,12 turn benefic."
    - condition: "Venus or Saturn in House 1, Rahu-Ketu malefic"
      effect: "Comfortable life, unless he forgets his deity — then extremely unfortunate."
    - condition: "Jupiter in House 10"
      effect: "Imprisonment from false accusation by someone he is supporting/breeding."
    - condition: "Jupiter & Ketu in House 2"
      effect: "Evils warded off if grandfather and grandson visit a religious place together, or perform a Havan."
  remedy: "Sell no milk (donate it instead). Keep a jug full of milk beside oneself when starting work."
  source: "Goswami 1952, 'Moon in House No. 4', pp. 414-416"

- id: moon_house_5
  planet: Moon
  house: 5
  summary: >
    Moon in House 5 (mother's milk, spiritual river) makes the native
    wealthy, charitable, religious and long-lived (~100 years), though
    ill-tempered; hardly succeeds in business but commands respect.
  severity: mixed
  benefit_effects:
    - condition: "Mercury, Sun in Houses 2 and 3; Mercury/Venus/Rahu-Ketu/Saturn in Houses 9,11 (enemies present but controlled)"
      effect: "All give favourable effects."
    - condition: "Mercury in House 7 or 11"
      effect: "Favourable results for Moon even if Houses 3 or 8 are weak."
    - condition: "Ketu favourable in House 6"
      effect: "At least 5 sons; children unaffected even if malefics conjoin; just and kind-hearted."
    - condition: "House 9 blank"
      effect: "Moon dormant; eating sweet food and carrying some when travelling for work brings profit."
  malefic_effects:
    - condition: "Some planet (even benefic) in Houses 10, 12"
      effect: "Unfavourable results; rash temperament, ruinous life, cannot keep secrets; consulting others before acting against someone helps; House 10 damages House 5, House 12 self-destroys."
    - condition: "Moon polluted"
      effect: "Unfavourable results of Houses 3,8,10,12; chicken-hearted, loose-tongued; greed/selfishness cause ruin."
    - condition: "Rahu-Ketu or Saturn in Houses 2 & 3, or Sun & Mercury in Houses 9, 11"
      effect: "Extremely unfavourable."
    - condition: "Sun in House 10 or 11 without supportive friendly planets"
      effect: "Short life of 12 days or 12 years."
    - condition: "Mercury malefic (Mercury-related occupation)"
      effect: "Destroyed by his own loose tongue."
  remedy: "Flow rice and sugar cubes wrapped in white cloth into water on Mondays."
  source: "Goswami 1952, 'Moon in House No. 5', pp. 417-419"

- id: moon_house_6
  planet: Moon
  house: 6
  summary: >
    Moon in House 6 is a deceptive position ("sour water") — one gets
    from the world only what one gives; digging a well at certain Moon
    ages harms wealth/health.
  severity: mixed
  benefit_effects:
    - condition: "Jupiter in House 2"
      effect: "Favourable; if mother's health/wealth suffers, serve father with milk or donate milk/silver in a temple."
    - condition: "Houses 2,4,8,12 benefic"
      effect: "Can revive a dying person by giving him water for 6 days."
    - condition: "Moon alone in House 6 (general note)"
      effect: "Confers a long life (~80 years); enemies turn friends."
  malefic_effects:
    - condition: "Ketu aspects Moon"
      effect: "Extremely malefic — loss of wealth/health/honour around ages 6,12,24 if a well is dug for travellers; do not drink milk at night."
    - condition: "Houses 2,4,8,12 malefic"
      effect: "Venus and Ketu malefic affect father and mother till age 34."
    - condition: "Mercury in Houses 2, 12"
      effect: "Unfavourable environment though not poverty; possible suicidal thoughts; loss of an eye (native, wife, or both)."
    - condition: "Sun in House 12, Mars in Houses 4 or 8 with Mercury in House 8"
      effect: "Death of mother in early age, or if she survives, no gain from her."
    - condition: "Venus malefic"
      effect: "In-laws suffer."
    - condition: "Ketu malefic"
      effect: "Unfavourable for father and family line."
    - condition: "Mercury malefic"
      effect: "Very unfavourable for mother's relations."
  remedy: >
    Donate Sun/Mars/Jupiter items in a temple, or worship there. Take
    milk during the day, cheese at night. Give milk to father; never
    donate milk itself.
  source: "Goswami 1952, 'Moon in House No. 6', pp. 419-420"

- id: moon_house_7
  planet: Moon
  house: 7
  summary: >
    Moon in House 7 is "mother of children, reincarnation of the Goddess
    of Wealth" — family and bank balance grow together; falling out with
    or disrespecting one's mother is ruinous.
  severity: mixed
  benefit_effects:
    - condition: "Saturn in House 3, Jupiter in House 7"
      effect: "Immense wealth (if Rahu/Ketu not malefic) even from a poor family; respected, favoured by government; scholarly in astrology/poetry, intelligent, religious; good wife, though stays distant from romance."
    - condition: "Venus benefic"
      effect: "Comforts of the world and domestic bliss."
    - condition: "Mercury benefic and House 8 blank"
      effect: "Full of wealth and family even with Saturn in House 3 and Jupiter-Mars in House 7."
  malefic_effects:
    - condition: "Marriage at age 6, 12 or 24"
      effect: "Venus, Mercury, Rahu-Ketu-Saturn (malefic) all yield unfavourable results; keeping Moon-items (silver, milk, river water equal to his weight) at home helps."
    - condition: "Jupiter in House 7, or Moon conjoined with a malefic and Mercury in House 2 or 8"
      effect: "Troublesome childhood; Mercury-related business not beneficial."
    - condition: "Moon polluted"
      effect: "Venus-ruled house also gives unfavourable results though wealth stays with the native; Venus conjoined with a malefic in an enemy house indicates early death of children."
    - condition: "Venus or Mercury in House 1 with Saturn conjoining/adjoining/aspecting"
      effect: "Loss of property; death by weapon after a long life; conflict between wife and mother."
    - condition: "Venus conjoined with Rahu-Ketu-Saturn"
      effect: "Children die young."
  remedy: null
  source: "Goswami 1952, 'Moon in House No. 7', pp. 421-423"

- id: moon_house_8
  planet: Moon
  house: 8
  summary: >
    Moon in House 8 ("dead mother, burnt milk") destroys wealth but not
    the native's life; donations in the name of elders bestow long life,
    and lucky ties form with in-laws/son-in-law/maternal uncles.
  severity: mixed
  benefit_effects:
    - condition: "Jupiter, Saturn in House 2"
      effect: "Rahu and Mars become beneficial; excellent results for inanimate Moon-objects; Moon fully alive."
    - condition: "Mercury benefic"
      effect: "Long life of 80 years; won't die while mother is alive."
    - condition: "Sun or Venus benefic"
      effect: "Very favourable."
    - condition: "Mercury in House 2 and Jupiter in Houses 9 or 12"
      effect: "Long life for parents; Moon favourable."
  malefic_effects:
    - condition: "Mars, Mercury or Rahu-Ketu-Saturn malefic"
      effect: "Troublesome period after ages 12, 24 or 48; unhappy domestic life; shady character causing trouble to in-laws/children; numerous daughters."
    - condition: "Rahu-Ketu-Saturn in Houses 3, 4"
      effect: "Disturbed parental relations; loss of ancestral property; undutiful children."
    - condition: "Venus, Mercury, Saturn afflicted/malefic, or relations with other women"
      effect: "Unlucky for health and children."
    - condition: "Mercury in Houses 4, 12, or Saturn/Rahu in House 12, or Jupiter/Sun polluted"
      effect: "Afflicted eyesight; unlucky children; hard luck till 34 (a nose piercing helps)."
    - condition: "Rahu-Ketu-Saturn, Venus, Mercury in House 11 and House 2 blank"
      effect: "Mother's life uncertain till age 24; animate Moon-objects inauspicious."
    - condition: "Mercury, Sun malefic"
      effect: "Poor life till age 34."
    - condition: "House 2 malefic, or Rahu/Jupiter/Mercury combinations in House 2"
      effect: "Own actions/foolishness destroy Venus and Moon."
    - condition: "Rahu-Ketu-Saturn in House 1 or conjoined with Moon"
      effect: "Suffering till age 34."
  remedy: >
    Keep well-water from a funeral site nearby for children's protection.
    Donate milk in the name of elders (guards against bronchitis,
    epilepsy, childlessness). Wash the feet of children/elders for
    monetary gain. Avoid a jewellery profession. Keep Moon-items at home.
    A nose piercing helps.
  source: "Goswami 1952, 'Moon in House No. 8', pp. 423-425"

- id: moon_house_9
  planet: Moon
  house: 9
  summary: >
    Moon in House 9 ("a potful of pearls") protects those in adversity —
    nine times benefic for progeny and wealth when Moon is alive;
    religiosity dilutes eclipses and enemy effects.
  severity: positive
  benefit_effects:
    - condition: "Moon alive"
      effect: "Favours the poor, good public deeds bring wealth."
    - condition: "Sun, Jupiter in House 5 (Moon's friends)"
      effect: "Blessings and increase in wealth/children; religious; benefits reach House 3 too."
    - condition: "Any good planets in House 4"
      effect: "Lucky, favourable, wealthy life; comforts from children, religious pursuits."
    - condition: "Jupiter in House 9, or aspecting/adjoining Moon"
      effect: "Very wealthy despite poor birth; power, rank, authority; immense property and conveyance."
  malefic_effects:
    - condition: "Rahu malefic and linked to Moon"
      effect: "Gives the results of companion planets; judgement clouded."
    - condition: "Ketu in House 2 and Mercury in House 5"
      effect: "Only financial success after age 34 or 48; Moon-items unhelpful before that."
    - condition: "Venus in House 3"
      effect: "Mother's eyesight afflicted around age 24-25 or multiples thereof."
  remedy: null
  source: "Goswami 1952, 'Moon in House No. 9', pp. 426-428"

- id: moon_house_10
  planet: Moon
  house: 10
  summary: >
    Moon in House 10 ("poisonous water, useless milk") risks death near
    water/drowning and eye trouble; becomes destructive the moment the
    native turns irreligious.
  severity: caution
  benefit_effects:
    - condition: "House 2 blank, a male planet in House 4"
      effect: "Becoming a surgeon at age 24 brings immense wealth, even with a malefic Moon."
    - condition: "Saturn in House 4, or Venus in House 1"
      effect: "Comforts from parents, though influence of the opposite sex should be avoided as it risks ruin."
    - condition: "Sun, Jupiter or Mars in House 4"
      effect: "Very wealthy, all comforts of life; dry wells start giving water; ruined houses rehabilitated."
  malefic_effects:
    - condition: "Moon malefic"
      effect: "Ill fame; may work as a doctor/surgeon, but night treatments or adulterating medicines with water cause ruin; property and in-laws both afflicted."
    - condition: "A planet in House 5 or 6"
      effect: "Moon-items bring losses."
    - condition: "Saturn in House 1 or 4"
      effect: "Gains through Saturn-items via forgery/cheating/nefarious means; gains from parents lost if under influence of the opposite sex."
    - condition: "Saturn in House 3"
      effect: "A troubled life, like a thief or dacoit."
    - condition: "Sun in House 7"
      effect: "Death through water in daytime."
    - condition: "Rahu-Ketu-Saturn in House 4 and Venus in House 7"
      effect: "Death of children; mother's longevity doubtful."
    - condition: "Rahu-Ketu-Saturn in House 2 or 3"
      effect: "Unfavourable effects of Moon."
    - condition: "Rahu-Ketu-Saturn with Mercury or Venus in House 3"
      effect: "Death of patients through adulterated medicines (relevant if in a medical profession)."
    - condition: "Rahu-Ketu-Saturn or Mercury/Venus in Houses 5, 6"
      effect: "Becoming irreligious brings bad luck."
    - condition: "Moon, Mercury and Saturn linked with each other"
      effect: "All three malefic — extremely unlucky."
    - condition: "Mars in House 7, Saturn in the house next to Sun"
      effect: "May lose some part of the body."
    - condition: "Mars negative"
      effect: "May become a liar, thief or dacoit."
    - condition: "House 2 blank (alternate combination)"
      effect: "Lung/chest disease."
  remedy: >
    Use well/river/waterfall/canal/drain water for 10 years to ward off
    evil effects after 15 years. Do not drink milk at night. Seek
    Jupiter's remedy.
  source: "Goswami 1952, 'Moon in House No. 10', pp. 428-430"

- id: moon_house_11
  planet: Moon
  house: 11
  summary: >
    Moon in House 11 gives very ordinary results ("as good as zero") —
    donating milk helps a son survive; wherever Ketu sits, it denotes
    malefic effects tied to the grandmother's condition.
  severity: caution
  benefit_effects:
    - condition: "Saturn benefic"
      effect: "Donating milk brings wealth and children; comforts, property, long life."
    - condition: "Mercury in House 5"
      effect: "Comforts from relatives, long life."
    - condition: "Sun, Mercury in House 4"
      effect: "Peaceful earning, good income."
    - condition: "Moon transits Houses 1, 2"
      effect: "Lucky, favoured by superiors/government for ~12 years."
    - condition: "Jupiter benefic, aspecting/conjoining Moon"
      effect: "Excellent wealth, favourable results, victory over enemies."
  malefic_effects:
    - condition: "Ketu present (wherever posited)"
      effect: "No male child while the grandmother is alive; if a male child is born and the grandmother sees him it is inauspicious (she may be widowed/ruined, or the child may die) — unless she is already widowed/blind, in which case the child or the grandmother survives only past age 12 or Saturn's period."
    - condition: "Saturn in House 3"
      effect: "Mother's health afflicted, worry, or death."
    - condition: "House 3 malefic"
      effect: "Troublesome childhood, worsened by specific inauspicious day/action combinations (daughter born on Wednesday with Mercury-business; marriage on Friday; house construction/demolition on Saturday; morning donations tied to Ketu; evening sermons tied to Rahu/Jupiter)."
    - condition: "Ketu in House 3"
      effect: "Death of child or mother; loss through voyages or others' misguidance."
  remedy: >
    Wash a stone slab under a hand pump daily with milk, or donate milk
    at a Bhairon temple, to reduce Ketu's malefic effects. For long life
    of children, heat a gold bar and quench it in milk before intercourse
    (repeat 11 times). If House 3 is malefic, the mother should relocate
    and avoid contact with the newborn for 43 days.
  source: "Goswami 1952, 'Moon in House No. 11', pp. 431-433"

- id: moon_house_12
  planet: Moon
  house: 12
  summary: >
    Moon in House 12 is "a river in spate which destroys inhabited areas
    at night" — a denounced King who cries over spilt milk; when Moon
    transits back to House 1 it salvages fortune, but returning to House
    12 destroys it again.
  severity: caution
  benefit_effects:
    - condition: "Water/House 4 combinations favourable (Sun-Mercury in House 3)"
      effect: "Salvages the whole clan."
    - condition: "Jupiter or Sun benefic"
      effect: "Moon gives milk instead of water."
  malefic_effects:
    - condition: "General placement (Mars in House 1 and Sun in House 2; or Sun in House 6; or Rahu-Ketu-Saturn/Venus/Mercury in Houses 2, 6, 12)"
      effect: >
        Spoils nights, destroys inhabited places; inherited property
        destroyed though self-earned wealth stays safe; property from
        parents becomes inauspicious; anxiety/discomfort at night; loss
        of property, in-laws troubled when Moon transits House 1 (source
        text's table linking each combination to a specific nuance was
        OCR-garbled — treat this as the general malefic pattern for House 12).
  remedy: "Only drink water that is clear and certified potable."
  source: "Goswami 1952, 'Moon in House No. 12', pp. 434-436"

- id: mars_house_1
  planet: Mars
  house: 1
  summary: >
    Mars in House 1 is "a sword of battlefield and justice" — a strong,
    sharp sword strikes hard (excellent when positive), but turns into a
    destructive tailed star when Mars is negative.
  severity: mixed
  benefit_effects:
    - condition: "Mars in House 1 generally"
      effect: "More brothers; blessed with wealth from age 28; brave, kind-hearted, selfless."
    - condition: "General strength"
      effect: "Power and authority, robust health, gains through Saturn-professions (iron, machinery, house-building) and same-age relatives; comforts/luck from age 28."
    - condition: "After the Rahu-Ketu-Saturn period (48)"
      effect: "Victory over enemies, high position/repute."
    - condition: "Native of dark complexion"
      effect: "Lucky for brothers and in-laws."
    - condition: "General strength (long life)"
      effect: "Truthful, kind-hearted, good-natured; his words come true."
    - condition: "Mercury in House 3 and House 2 blank"
      effect: "May be deprived of a sister; if present she leads a royal life; brother's fortune fluctuates between prosperity and poverty."
  malefic_effects:
    - condition: "Mars afflicted/unfavourable, native given to vice or bribery"
      effect: "Very unlucky; ruin follows accepting bribes/gifts."
    - condition: "General bad fortune for the family"
      effect: "Calamity within 40-43 days of birth; unlucky for parents through Saturn's period (36-39); vice habits risk childlessness for in-laws/brothers/self."
    - condition: "Mercury in House 12 and House 11 blank"
      effect: "Association with Sadhus/Sanyasis unfavourable for domestic bliss till age 39."
    - condition: "Sun in House 7, or Moon/Jupiter conjoined with Rahu-Ketu-Saturn, or Mercury in House 7"
      effect: "Parents may die or suffer afflicted health till age 13, 15 or 28; invites others' troubles onto himself."
    - condition: "Sun in House 12, Moon in House 2 (or vice versa)"
      effect: "Troubles, disease, worries; early death of parents; unlucky when accepting donations/bribes."
    - condition: "Mercury in House 3 and Houses 7, 11 blank"
      effect: "Living with in-laws damages brother; company of Fakir/Sadhu also harmful, until age 36."
  remedy: >
    Establish/remedy Jupiter for Houses 9, 11 and Venus for House 7. Take
    help of Sun and Moon items generally.
  source: "Goswami 1952, 'Mars in House No. 1', pp. 479-481"

- id: mars_house_2
  planet: Mars
  house: 2
  summary: >
    Mars in House 2 makes a religious person, protector of brothers, full
    of worldly assets — discord with brothers brings insurmountable
    misfortune, while supporting them brings prosperity.
  severity: mixed
  benefit_effects:
    - condition: "Mars alive"
      effect: "Wealth enough to help others, though not for himself."
    - condition: "Mars devoid of any effect of Mercury or Ketu"
      effect: "Gains from in-laws; determined, fond of power and authority; in-laws prosperous as long as Moon is established in their house."
    - condition: "Houses 8,9,10,12 connected with Jupiter/Sun/Saturn/Mercury effects but Mercury not in House 2"
      effect: "Self-made wealthy person; comfortable life, good food/clothes/health."
    - condition: "Houses 8,9,10,12 have Jupiter, Sun, Saturn linked with Ketu"
      effect: "Lucky, comfortable, man of power and authority."
  malefic_effects:
    - condition: "Mars negative (general)"
      effect: "Victory over enemies still, but death by quarrel or in a war field."
    - condition: "Houses 8,9,10,12 linked with Jupiter/Sun/Saturn/Mercury and Mercury also in House 2"
      effect: "Mercury-connected work adversely affected; feeble resolve."
  remedy: >
    Keep solid silver with oneself; wear a jointless silver ring on the
    left hand; flow sugar cakes and sugar-sesame balls in running water.
    (See Mars House 4 remedies for more.)
  source: "Goswami 1952, 'Mars in House No. 2', pp. 481-483"

- id: mars_house_3
  planet: Mars
  house: 3
  summary: >
    Mars in House 3 is useful to others but not to oneself — Mars negative
    here is like a "caged lion"; trust is often betrayed by someone the
    native relies on.
  severity: mixed
  benefit_effects:
    - condition: "Jupiter, Sun or Moon in Houses 7, 9 or 11"
      effect: "Rahu favourable; happy domestic life."
    - condition: "Jupiter in House 9"
      effect: "Gains through wealthy in-laws."
    - condition: "Saturn in House 9"
      effect: "Good, robust health; blessed with wealth and prosperity; comfortable, prosperous life."
    - condition: "Mars benefic generally"
      effect: "Intelligent, learned, kind-hearted, long life (~90 years); a house broader at front than back is lucky; good eyesight till 90; helpful to others though own condition stays uncertain; in-laws become wealthy through his assistance."
  malefic_effects:
    - condition: "Mars negative"
      effect: "90 years of life but unlucky, licentious, diseased; pride leads to misery; scarcely a male child, or one unfavourable to the native."
    - condition: "Jupiter in House 11"
      effect: "Death of relatives, though the native himself lives comfortably."
    - condition: "Jupiter, Sun or Moon in Houses 7, 9 or 11 (malefic variant)"
      effect: "Evil results of Mars; misery all around; help from in-laws still available."
    - condition: "Mercury or Saturn in Houses 3, 9 or 11, or Mercury-Saturn in Houses 4 or 7"
      effect: "Troubles, financial stringency, though the native supports his family under adversity; Saturn in House 11 averts family deaths."
  remedy: "Establish an ivory item; wear a jointless silver ring or bangle."
  source: "Goswami 1952, 'Mars in House No. 3', pp. 483-484"

- id: mars_house_4
  planet: Mars
  house: 4
  summary: >
    Mars in House 4 is "burning fire, chief of evil" — highly destructive
    when negative, destroying family and mother/wife by age 28; courage
    alone cannot overcome an adverse destiny here.
  severity: mixed
  benefit_effects:
    - condition: "Two malefics (Saturn-Rahu, Saturn-Ketu, or Mercury-Ketu) conjoined"
      effect: "Mars turns benefic and positive."
    - condition: "Moon or Venus alone/conjoined with Mars in Houses 3, 4 or 8"
      effect: "Mars always positive."
    - condition: "Moon malefic outside Houses 1,4,7,10, or Sun/Moon/Jupiter in Houses 3,4,8,9"
      effect: "These lend a helping hand — Mars becomes positive; bold, kind, clear-hearted, helpful to relations."
    - condition: "Mars benefic overall"
      effect: "Blessed with buried/hidden wealth; brother's wife noble and chaste; elder brothers and their children lucky."
  malefic_effects:
    - condition: "Mars unfavourable/negative (general)"
      effect: "Troublesome domestic life; rash temperament, questionable character; ruinous for the family; unfavourable till age 28 for mother/grandmother/mother-in-law/brother's wife; elder brothers unlucky; quarrelsome, vagabond, childless, inauspicious."
    - condition: "Living in house numbered 3, 8, 13 or 18, or specific inauspicious house layouts (underground place near a well/fireplace to the south, south-facing exit, Kikker/Berry tree in the courtyard, adjoining sweet shop or cemetery, built over a well, etc.)"
      effect: "Amplifies Mars-negative effects — loss of wealth/health, worried life, widowhood, hard luck for the family."
    - condition: "Mars negative in House 1 or 8 (with Ketu also in House 8)"
      effect: "Unlucky for self and blood relations; financial loss."
    - condition: "Mars negative in House 2"
      effect: "Malefic for self and Saturn-related items."
    - condition: "Mars negative in House 7 with Saturn also malefic"
      effect: "Malefic for the ladies of the family."
    - condition: "Mars negative in House 4 with Saturn malefic"
      effect: "Unfavourable for mother/wife/mother-in-law/grandmother; loss of domestic happiness and wealth; may cause death of wife or the native."
    - condition: "Mars negative in any house except 8 and 12"
      effect: "Very unlucky for elder brothers (may die by native's age 28); if they survive, deprived of progeny/health/wealth."
    - condition: "Mars negative in House 12"
      effect: "Detrimental for elder brothers; unlucky for family/ancestors; troublesome old age; possible blindness or disease."
    - condition: "Rahu-Ketu-Saturn in House 9, or Mercury in House 12, or Jupiter in House 8, or Saturn in House 1"
      effect: "Adverse for the family; poor, miserable, coward, thief, cheat."
  remedy: >
    Clean teeth with water each morning. Apply a Tilak of earth mixed
    with sweetened milk and banyan-tree root (for belly diseases). Keep
    sugar bags on the roof, or sugar on boil tips (fire-accident
    prevention). Donate a pot of honey at a funeral ground, or feed sugar
    to a horse, for children's welfare. Use deer skin, an iron nail on
    the south door, or a rectangular silver piece for long illness. Feed
    sparrows sweets. Keep ivory (if Rahu is not in House 3). Flow 400g
    sugar-sesame balls in running water; wear a three-metal ring.
  source: "Goswami 1952, 'Mars in House No. 4', pp. 485-489"

- id: mars_house_5
  planet: Mars
  house: 5
  summary: >
    Mars in House 5 makes an extremely wealthy person — Mars negative
    here is merely mischievous rather than destructive; living outside
    the ancestral home risks childlessness.
  severity: mixed
  benefit_effects:
    - condition: "Planets posited in Houses 3, 5 and 9"
      effect: "All favourable; Venus and Moon beneficial everywhere; Mars 5x favourable; wealth grows with age."
    - condition: "Planets in House 3 (under Mars control)"
      effect: "Mars benefic to House 9 planets regardless of friend/enemy status."
    - condition: "House 3 determines respect"
      effect: "May be a doctor/Hakim or interested in medicine; just and fair; malefic Moon in House 8 affecting House 9 (parents) calls for donations in the name of the dead."
    - condition: "General benefic placement"
      effect: "Blessed with children and education; comforts from wife/progeny; leaves property for children; very wealthy."
    - condition: "House 10 blank and House 9 has a planet, or elder brother alive"
      effect: "Mars always benefic — wealthy native, progeny and ancestors; wealth after a son's birth."
  malefic_effects:
    - condition: "Nighttime malefic influence on Ketu-related articles"
      effect: "Mars malefic only at night."
    - condition: "General negative combination"
      effect: "Loss through fire, less comfort from children/journeys; children may die at 8 days, 8 years, or up to 18 years; residing outside the ancestral house brings childlessness."
    - condition: "Beloved becomes a cause of destitution"
      effect: "Financial ruin through a loved one."
    - condition: "Mercury, Ketu in Houses 9, 10"
      effect: "Poor sleep; keeping water at the bedside under the head remedies this and Rahu's malefic effects too."
  remedy: "Keep water at the bedside under the head to counter poor sleep and Rahu's malefic effects."
  source: "Goswami 1952, 'Mars in House No. 5', pp. 490-491"

- id: mars_house_6
  planet: Mars
  house: 6
  summary: >
    Mars in House 6 gives an offspring after much waiting and prayer —
    the native is a hermit-like, brave, self-controlled, religious
    protector of the family when Mars is alive and unafflicted.
  severity: mixed
  benefit_effects:
    - condition: "Venus benefic, or House 7 strong, or Saturn/Mercury/Ketu in House 7"
      effect: "Long life, wealth, worldly comforts."
    - condition: "Sun, Mercury or Jupiter benefic"
      effect: "Children for 24 continuous years; well-versed, talented children."
    - condition: "Jupiter, Sun and Mercury all benefic"
      effect: "Favourable for children."
    - condition: "Mars alive, unafflicted"
      effect: "Brothers grow in wealth as he does; worship maidens for mother's benefit/protection against enemies."
  malefic_effects:
    - condition: "Jupiter, Sun or Mercury weak/malefic"
      effect: "Only one son."
    - condition: "Ketu in House 8, Saturn in House 5"
      effect: "Unfavourable for progeny, unless Jupiter/Sun/Mercury are good."
    - condition: "Ketu malefic"
      effect: "A son born only by age 34; celebrating children's birthdays unfavourable; distribute salty rather than sweet items; children should not wear gold."
    - condition: "Mercury in House 12"
      effect: "Brothers and sisters troubled, or a source of trouble."
    - condition: "Mercury in House 8, unaided by Sun/Moon"
      effect: "Death of mother at an early age."
    - condition: "Mercury in House 4"
      effect: "Indicates death of the native at an early age, then his mother's."
  remedy: >
    Treat Saturn for self-protection. Seek blessings of girls/daughters
    for brothers' help. Propitiate Moon and Mercury for progeny. Donate
    Moon-items. Do not let children wear gold.
  source: "Goswami 1952, 'Mars in House No. 6', pp. 492-494"

- id: mars_house_7
  planet: Mars
  house: 7
  summary: >
    Mars in House 7 ("sweet pudding, Vishnu") gives everything one asks
    for, but conjunction with Mercury damages it all; problems belonging
    to others tend to fall on the native.
  severity: mixed
  benefit_effects:
    - condition: "Jupiter or Venus in House 1"
      effect: "Gains whatever one wishes, though repeated gains aren't guaranteed."
    - condition: "Jupiter, Venus in Houses 1 to 6"
      effect: "Royal position."
    - condition: "General placement"
      effect: "Kind-hearted, strong will-power, helpful to others, religious, well-respected, domestic happiness; helping brothers' children is auspicious."
  malefic_effects:
    - condition: "Mars negative, or Mercury in House 1, 7 or 8 (weak)"
      effect: "Unfavourable circumstances; native's sister may become a widow and living with him risks childlessness; Mercury-linked items/relations become inauspicious."
    - condition: "Mercury and Saturn in Houses 6, 7"
      effect: "Native entangles himself in others' affairs; brother's children bring good luck; conjunction of Mercury with Mars is very inauspicious."
  remedy: >
    Offer sweets to the native's sister whenever she visits (especially a
    widowed sister living jointly). Keep solid silver in the house. Treat
    blood/health issues with curds/milk (Venus) and oven-fired brick
    (Saturn) per a doctor's direction. Give red clothes to sister/aunt.
  source: "Goswami 1952, 'Mars in House No. 7', pp. 494-496"

- id: mars_house_8
  planet: Mars
  house: 8
  summary: >
    Mars in House 8 ("death trap, place of hanging") is not malefic for
    the self but destroys others' fortunes — long life and wealth for the
    native, honourable and hardworking despite the ominous title.
  severity: mixed
  benefit_effects:
    - condition: "Moon, Jupiter in House 2, or House 2 blank (dormant Mars)"
      effect: "Mars benefic."
    - condition: "Moon in Houses 3, 4, 8, or 9"
      effect: "Mars positive."
    - condition: "Mercury in House 8, with a small dark room at the end of the ancestral home"
      effect: "Always favourable."
  malefic_effects:
    - condition: "General placement (brother count)"
      effect: "Remains an only brother, or a sibling dies; if one survives there's a 4-8 year age gap; no younger sibling for 13-15 years, and such siblings bring ill luck."
    - condition: "Mars unfavourably helped by Moon/Sun/Jupiter (negative)"
      effect: "Mars-related relations become unfavourable to the native, though not adverse for the mother; still wealthy and long-lived."
    - condition: "Mercury, Ketu in House 2"
      effect: "Younger brother won't survive, or if he does, stays diseased/troubled."
    - condition: "A planet in House 2 (Mars negative)"
      effect: "Miserable life, loss of wealth till age 28; silver around the neck helps; south-facing door or underground furnace destructive for the family."
    - condition: "Mercury in House 6"
      effect: "Death of mother in childhood."
    - condition: "Moon, Sun or Jupiter absent from Houses 3, 4 or 8 (Mars negative)"
      effect: "Mars malefic, makes the native poor and troubled."
    - condition: "Mercury in Houses 2,3,4,5,7,9,10,11,12 (except 6,8)"
      effect: "The more benefic Mercury, the more malefic Mars becomes."
  remedy: >
    Same as Mars in House 4. Also: feed eight sweet cakes to dogs; wear a
    three-metal ring; wear a silver necklace; use deer skin; flow 800g-8kg
    of sugar cakes and sugar-sesame balls in running water. Blessings
    from a widow help (her ill wishes ruin); prepare a sweet loaf in an
    oven without touching iron and give it to a dog for 40/43 days.
  source: "Goswami 1952, 'Mars in House No. 8', pp. 496-498"

- id: mars_house_9
  planet: Mars
  house: 9
  summary: >
    Mars in House 9 continues a royal family line — prosperity starts
    from age 13, kingship by 28; Mars negative instead brings fame but
    ill repute and atheism.
  severity: mixed
  benefit_effects:
    - condition: "Venus/Moon in House 9, or aspecting Mars"
      effect: "'Fish Line' — highly favourable."
    - condition: "Association with brothers maintained"
      effect: "Prosperity for parents till age 13; native becomes king-like after 28."
    - condition: "Sun gives powerful results wherever placed; elder brother's protection kept"
      effect: "Like a lion not needing favours, though poor Mercury still adversely affects parents."
    - condition: "Moon's position depends on Jupiter; Houses 3 and 5 favourable for Mercury"
      effect: "All planets give benefic results."
    - condition: "Unity maintained with elder brother"
      effect: "Both become invincible; brother's wife brings good luck; Venus and Moon excellent; Sun as good as Sun in House 2; prosperity through military-hardware-related work."
  malefic_effects:
    - condition: "Mercury malefic, or Mars negative generally"
      effect: "Slighted, diseased, troubled, seeking help from lowly people; parents' fortunes rust if Mercury also malefic."
  remedy: "Keep a red handkerchief. Apply red vermillion to a Hanuman idol on Tuesdays and feed the idol."
  source: "Goswami 1952, 'Mars in House No. 9', pp. 498-499"

- id: mars_house_10
  planet: Mars
  house: 10
  summary: >
    Mars in House 10 ("lord in the house of the ant") behaves like Saturn
    dictates — selling gold brings misery, and a poor Moon affects the
    whole family.
  severity: mixed
  benefit_effects:
    - condition: "Moon in House 4"
      effect: "Comfortable, lucky native; increase in the family."
    - condition: "Saturn in Houses 9, 10, 11"
      effect: "A mischievous leopard rather than a lion; average financial condition."
    - condition: "House 5 blank"
      effect: "Very auspicious; lucky and prosperous."
    - condition: "Mars in House 10 alone and unaspected"
      effect: "King-like, good comfortable life."
    - condition: "Saturn in House 3"
      effect: "Landed property/farmhouses, though not much liquid cash."
  malefic_effects:
    - condition: "Selling golden ornaments"
      effect: "Very inauspicious — indicates death of children and loss of wealth."
    - condition: "Mars with enemy planets"
      effect: "A ruinous position in life."
    - condition: "Venus, Moon or Rahu-Ketu-Saturn in House 2"
      effect: "Delayed birth of children; keeping a deer, or serving a one-eyed/childless person, remedies this."
    - condition: "Moon, Jupiter or Sun in Houses 3, 6 with malefic Mercury"
      effect: "Loss of money and children; parents lead a troubled life."
    - condition: "Sun in House 4, or Moon in House 6, or daughter's son living with him"
      effect: "May cause loss of one eye."
    - condition: "Saturn in House 4"
      effect: "Brings disrespect; may be imprisoned without fault."
    - condition: "Sun in House 6"
      effect: "May cause the death of a son."
    - condition: "Some planet in House 5"
      effect: "Malefic for others, but good for self."
  remedy: "Serve Hanuman. Eat sweets. Rear a deer."
  source: "Goswami 1952, 'Mars in House No. 10', pp. 499-501"

- id: mars_house_11
  planet: Mars
  house: 11
  summary: >
    Mars in House 11 is "a caged lion" — sits under Jupiter's court and
    takes on Jupiter's condition; after age 13, behaves like Mars in
    House 9 regardless of Jupiter's actual placement.
  severity: mixed
  benefit_effects:
    - condition: "General placement"
      effect: "Bold, wealthy, power and authority; ages 13 and 28 very lucky; may live like a King with a saintly heart and spiritual power; Ketu highly benefic."
    - condition: "Jupiter in Houses 1-10 / 11 / 12 (determines brother count)"
      effect: "Up to 9 brothers (Houses 1-10), 2 brothers (House 11), 1 brother (House 12)."
    - condition: "After age 13 (regardless of Jupiter's position)"
      effect: "Favourable time, per the effects of Mars in House 9; Ketu-linked relations (father-in-law, maternal uncle) become favourable."
    - condition: "Mercury and Saturn benefic"
      effect: "Wealth accumulation from age 24 to 28."
  malefic_effects:
    - condition: "House 3 blank, weak or ill-aspected"
      effect: "Miserable life of debt, loss of ancestral property despite a good income."
    - condition: "Mars negative"
      effect: "Loss of children around ages 42, 45 or 48; Mars-linked items/relations harmful and unlucky; Ketu also unfavourable."
  remedy: "Birth of a son, or keeping a pet dog, is auspicious; serve three worldly dogs."
  source: "Goswami 1952, 'Mars in House No. 11', pp. 501-502"

- id: mars_house_12
  planet: Mars
  house: 12
  summary: >
    Mars in House 12 (Jupiter's house) can make a native King-like even
    if born in poverty or living as a hermit — giving sweets to others
    ensures no shortage of wealth.
  severity: mixed
  benefit_effects:
    - condition: "Mercury in House 1, or Ketu in House 1 (Jupiter/Ketu in Mars-houses)"
      effect: "No malefic results; Ketu here gives benefic results; short-tempered, independent mind; Rahu's effect dormant rather than evil."
    - condition: "General strength"
      effect: "Like a roaring lion, glowing family, frightens enemies, reverent to gurus, comfortable nights even without much wealth."
    - condition: "Even born in poverty/desolation"
      effect: "All comforts, power to control an elephant; compatible with the powerful; Mercury/Rahu-Ketu/Saturn lose their say except when in Houses 3,8,9,12 (Mercury stays poor/unpredictable there)."
    - condition: "Ages 24/28, or birth of first son/second brother"
      effect: "Excellent results."
    - condition: "Ketu in House 3 or with Jupiter, Jupiter in House 2, or Jupiter/Venus-Ketu in Houses 1,3,8,11"
      effect: "'Fish Line' — money, royal power, family status, long life; saved from death/hanging; enemies retreat in disgrace."
    - condition: "Sun in Houses 3-11"
      effect: "Protection from disease/death, as long as House 11's planet isn't inimical to House 8's."
  malefic_effects:
    - condition: "Mercury in Houses 3,8,9,12"
      effect: "Mercury keeps its malefic influence; Mars cannot control it."
    - condition: "Sun poor"
      effect: "Malefic effect of Mars; Sun's malefic impact spreads from House 3 to House 1 and then House 11."
    - condition: "Mercury in Houses 4-8 with no link between Moon and Sun"
      effect: "Mars (whether in House 6 or 12) shortens the native's life, then his mother's."
  remedy: null
  source: "Goswami 1952, 'Mars in House No. 12', pp. 502-504"

- id: venus_house_1
  planet: Venus
  house: 1
  summary: >
    Venus in House 1 gives twin possible effects — "Fish Line" (benefic)
    or "Crow Line" (malefic) — depending mainly on Saturn's condition;
    romance-driven vice is the main risk.
  severity: mixed
  benefit_effects:
    - condition: "Venus benefic (forms a Fish Line)"
      effect: "Extreme benefits, reflecting Saturn's aspect; plentiful comforts of conveyance and animals."
    - condition: "Jupiter and House 8 planets favourable"
      effect: "Determines whether Venus stays religious."
    - condition: "Saturn in Houses 10, 11 (or benefic)"
      effect: "Marriage precedes employment/earning; spouse rules the family."
    - condition: "Mars in Houses 6, 7, 12"
      effect: "Long life of 100 years; large progeny."
    - condition: "Saturn exalted, or Houses 7 & 10 blank, or Rahu-Ketu-Saturn/Mercury in Houses 7 & 10 (treated as blank)"
      effect: "Excellent Fish Line results — unbounded wealth (needs a maid servant or cow for full benefit)."
    - condition: "Mercury in Houses 3, 6, or Mercury-Saturn in House 7 with Mars in Houses 6, 7"
      effect: "Excellent intellectual power; favourable court decisions; Moon generally not malefic."
  malefic_effects:
    - condition: "Saturn and Venus both in House 1 (Crow Line)"
      effect: "Destructive."
    - condition: "Philandering in youth"
      effect: "Destructive for self and relatives."
    - condition: "Venus malefic"
      effect: "Mother may die or suffer death-like pains; if mother and wife stay together one may go blind (Sun's effect stays unaffected)."
    - condition: "Mars not in Houses 6-12, Houses 7 and 10 blank"
      effect: "Crow Line."
    - condition: "Rahu-Ketu in Houses 4-10, Mercury or Saturn in House 7, Mars in Houses 6-12"
      effect: "Crow Line."
    - condition: "Some planet (other than Rahu-Ketu-Saturn/Mercury) in Houses 7, 10"
      effect: "Crow Line; destruction follows marriage at age 25."
    - condition: "Rahu in House 7"
      effect: "Sickly spouse, ruined family life, possible divorce (for a female chart); wife receiving silver from in-laws at marriage may negate this."
    - condition: "Mercury malefic"
      effect: "Bad for progeny."
    - condition: "Sun malefic"
      effect: "Bad for family life; can lead to separation/divorce."
    - condition: "Saturn malefic"
      effect: "Malefic results like Venus in House 10; relations in trouble; self licentious."
    - condition: "Jupiter, Sun, Saturn all malefic"
      effect: "Deaths all around; self licentious and destructive to others."
    - condition: "Moon, Rahu, Sun in Houses 1, 7 (enemies) with malefic Mercury, or Sun in/near House 7"
      effect: "A 'Casanova'; others' troubles land on him; extremely poor health; related items in poor shape."
  remedy: >
    Donate barley, or eat barley food in cow urine. Donate mixed grains
    of 7 types (satnaja) including mustard. A man should marry off a girl
    (donate); a woman should donate a cow. Control sexual indulgence and
    follow others' advice.
  source: "Goswami 1952, 'Venus in House No. 1', pp. 445-447"

- id: venus_house_2
  planet: Venus
  house: 2
  summary: >
    Venus in House 2 gives excellent family life — "the earth turns into
    gold" — no planet is debilitated here, and Venus (Goddess of Wealth)
    brings reconciliation and peace.
  severity: positive
  benefit_effects:
    - condition: "General placement"
      effect: "Relies on God rather than seeking favours; wealth grows every 8th year; good in-laws."
    - condition: "Jointly with Jupiter"
      effect: "Desire to marry (even an older partner); excessive sex without much procreation; overall prosperous, children well-protected; money for 60 years — check libido for best results."
    - condition: "Family life generally good"
      effect: "Venus in House 2 carries benefic results of Venus in House 9, wherever Saturn is."
    - condition: "Jupiter, Ketu and Mercury favourable, Saturn also benefic"
      effect: "Excellent luck; the house becomes like a palace."
    - condition: "House numbered 5 (narrow front, broad rear — 'cow house')"
      effect: "Benefits accrue from this."
    - condition: "Jupiter in Houses 6, 12"
      effect: "Prosperity to relatives and their help."
    - condition: "Jupiter in House 2 with Mars destroyed"
      effect: "Makes him a 'Casanova'."
    - condition: "Saturn in Houses 2-9"
      effect: "Twice-beneficial results of Venus; prosperity and success; 60 years of earning; gains from animal dealing and soft soil."
  malefic_effects:
    - condition: "Living in house numbered 3 ('Lion's house' — broad front, narrow rear), or dealing in gold, or an eclipse combination (Sun-Rahu, Moon-Ketu) in the chart"
      effect: "Brings misery."
    - condition: "Venus in House 2 of a woman's chart"
      effect: "Husband becomes impotent; for a man, his wife becomes barren."
    - condition: "Rahu-Ketu in House 2"
      effect: "Procreates through women other than his spouse."
    - condition: "Houses 9 and 12 malefic"
      effect: "Discomfort from wife."
    - condition: "Rahu-Ketu in Houses 2,5,9,12 (Jupiter's houses)"
      effect: "Immoral wife; wealth destroyed."
    - condition: "House 8 blank"
      effect: "No procreation possible; destruction caused by serving a widow/girlfriend/prostitute."
    - condition: "Jupiter in Houses 8, 9, 10"
      effect: "Obstruction in marriage/childbearing; spouse earns; upright morals keep life comfortable."
  remedy: "Take Mars-item blood-formation medicines."
  source: "Goswami 1952, 'Venus in House No. 2', pp. 447-449"

- id: venus_house_3
  planet: Venus
  house: 3
  summary: >
    Venus in House 3 gives a wife who is highly supportive, almost a
    partner-in-arms — disrespecting her is ungentlemanly, and her
    nobility brings the native's own salvation.
  severity: mixed
  benefit_effects:
    - condition: "Mars conjoins Venus or aspects/links to it"
      effect: "Parental affection till age 15; favourite of ladies; gains through the opposite sex, though stays under the spouse's control."
    - condition: "Ketu benefic"
      effect: "Ladies respected and lucky; no thefts because of them."
    - condition: "Saturn in House 9"
      effect: "Gains/support of parents."
    - condition: "Mercury, Saturn, Ketu, Mars (friendly planets) in Houses 2 or 7"
      effect: "Lucky, comfortable life; pilgrimage gain around age 20 if Mercury benefic, plus parental property support."
    - condition: "Moon strong and benefic, House 8 blank"
      effect: "Lucky life, victory over enemies, happy and comfortable; Venus makes House 8 benefic too."
    - condition: "Jupiter in House 2 again"
      effect: "Venus doesn't adversely affect its enemies in Houses 9, 11; all-round happiness for a dutiful native."
    - condition: "Mercury strong"
      effect: "Pilgrimage benefit for 20 years; benefic parental support."
  malefic_effects:
    - condition: "Jupiter in House 9"
      effect: "Afflicted health; family troubled through disease."
    - condition: "Mercury in House 11"
      effect: "Wealthy but unhappy till age 34; Venus destroyed, wealth decreases; progress resumes after 34."
    - condition: "Mars or Mercury malefic"
      effect: "Affects wealth from ages 16-24 or up to 34; spouse and daughters lead unhappy lives; no gain from father or self-acquired house."
    - condition: "Venus conjoined by Mars negative"
      effect: "Struggle even if rich."
    - condition: "Enemy planets in Houses 9, 11"
      effect: "They aren't destroyed themselves, but destroy Venus."
  remedy: null
  source: "Goswami 1952, 'Venus in House No. 3', pp. 450-451"

- id: venus_house_4
  planet: Venus
  house: 4
  summary: >
    Venus in House 4 risks illicit liaisons and love affairs — even
    ogling brings disrepute; marital bliss suffers even as romance
    flourishes.
  severity: caution
  benefit_effects:
    - condition: "Houses 2-7 blank and Venus unlinked to any planet"
      effect: "Two spouses — one elderly, one comfort-giving — though children may not be born."
    - condition: "Mars, Mercury, Rahu-Ketu in House 1 or conjoined/adjoining Venus"
      effect: "Shortage of children gets made up."
    - condition: "Surface travel generally"
      effect: "Frequent, enjoyable, beneficial travel; bountiful comforts after 4 years of marriage (Jupiter/Mercury decides fate)."
  malefic_effects:
    - condition: "General placement"
      effect: "Covering wells or building over one brings childlessness; liaisons cause misery; marriage at ages 22,24,25,32,34,47,51,60 inauspicious."
    - condition: "Venus alone with Houses 2 and 7 blank"
      effect: "Any romance brings disrepute."
    - condition: "Saturn and Jupiter not linked with Venus"
      effect: "Jupiter alone determines the wife's condition."
    - condition: "Saturn in House 4"
      effect: "Intoxication causes destruction, often via Mercury or Mercury-items."
    - condition: "Moon in House 4"
      effect: "Poverty, though divine help arrives."
    - condition: "Jupiter in House 1"
      effect: "Conflict between wife and mother; maternal uncle destroyed; Moon causes poor children."
    - condition: "Mercury in House 6, or Moon malefic"
      effect: "Daughters become a cause of destruction; wife inauspicious."
    - condition: "Saturn malefic"
      effect: "Romance causes havoc and shortage of children; marital disharmony."
    - condition: "Venus and Moon both malefic"
      effect: "Poor married life if marrying at 22,24,29,32,45,47,51 or 60."
    - condition: "Mars, Mercury or Rahu-Ketu-Saturn come to House 1 in the second round, or conjoin/adjoin Venus"
      effect: "Shortage of progeny and distress over it."
  remedy: >
    Establish Moon, or throw Jupiter-items into a well. Keep a small pond
    on the rooftop. If both Venus and Moon are malefic, bury black
    antimony in a peach stone outside.
  source: "Goswami 1952, 'Venus in House No. 4', pp. 452-453"

- id: venus_house_5
  planet: Venus
  house: 5
  summary: >
    Venus in House 5 gives a family full of children — living, friendly
    planets of Venus bring unbounded wealth, while philandering outside
    destroys both wealth and family.
  severity: mixed
  benefit_effects:
    - condition: "Mercury, Saturn and Ketu alive"
      effect: "Religious guide or preacher; chaste, lucky wife."
    - condition: "Male planets alive, conjoined/adjoined"
      effect: "Increase in wealth; love for family and country."
    - condition: "Mercury or Rahu-Ketu-Saturn in Houses 1, 7 or 9"
      effect: "Gains through Venus-related professions/articles."
    - condition: "Sun in House 1 and Mars in House 3"
      effect: "Very lucky and wealthy."
    - condition: "Enemy planets present with Venus"
      effect: "No adverse effect from them on Venus."
    - condition: "General placement"
      effect: "Wife and children never remain unhappy, regardless of the native's wealth."
  malefic_effects:
    - condition: "Venus polluted"
      effect: "Saturn brings immorality; luck follows character; elder brothers/maternal uncles/in-laws become a source of loss."
    - condition: "Sun, Moon and Rahu in Houses 1, 7 (enemies)"
      effect: "House 12 destroyed; losses through friends and opposite-sex fondness; success in love if Houses 3, 8 are benefic (otherwise others affected)."
    - condition: "Venus aspects no planet"
      effect: "Loss through theft; licentious wife; love marriage brings unfaithful children."
    - condition: "Moon malefic"
      effect: "Increases Venus's malefic effects; remedy of Moon helps."
  remedy: >
    Serve a cow and keep one's character clean. Wash private parts with
    curds or milk to increase money inflow.
  source: "Goswami 1952, 'Venus in House No. 5', pp. 454-455"

- id: venus_house_6
  planet: Venus
  house: 6
  summary: >
    Venus in House 6 rewards those who respect wealth and punishes those
    who don't — old age stays comfortable if children aren't neglected.
  severity: mixed
  benefit_effects:
    - condition: "Sun, Moon and Rahu in Houses 2 or 8 (or those houses malefic)"
      effect: "No gain from government, but Venus stays benefic like Venus in House 12."
    - condition: "Moon alive"
      effect: "Venus won't be malefic."
    - condition: "Mars conjoins/adjoins"
      effect: "Comfortable life; results depend on Rahu/Ketu's condition."
    - condition: "Sun or Jupiter (or both) in Houses 2 or 6, with a healthy planet in House 12"
      effect: "Very wealthy, though children may be spoilt; help/gain through brothers, relations, father."
  malefic_effects:
    - condition: "A planet other than Mars/Jupiter in Houses 6, 7"
      effect: "Venus and other planets turn malefic; keeping a solid silver bar/silver articles in the house helps."
    - condition: "House 2 blank, or Sun in House 6 with House 2 blank"
      effect: "Undesirable effect on children; father's death in childhood; benefic period resumes after age 28."
    - condition: "Mercury malefic in House 5"
      effect: "Planets in Houses 3,4,7,9 malefic, though a House 10 planet helps; things resolve when Mercury reaches House 1."
    - condition: "Rahu in House 2"
      effect: "Death of first wife; troubles through enemies till age 42."
    - condition: "Ketu in House 6, Jupiter in House 12"
      effect: "Malefic effect of all planets."
    - condition: "Mercury in House 8"
      effect: "Shortage of sons; malefic effect across Houses 2,3,4,5,7,10,11,12."
    - condition: "Saturn malefic"
      effect: "Loss of wealth."
    - condition: "Ketu malefic, or conjoining Venus in House 6"
      effect: "A barren woman or eunuch male; troubled by spouse, more daughters; loss through other women."
    - condition: "Sun, Moon, Rahu in House 7, or mutually inimical planets there"
      effect: "Losses and ill luck; no gain from Jupiter/Sun/Moon items."
    - condition: "Malefic Mercury (except Mercury in House 5)"
      effect: "Elders, brothers, mother's side, wife, father's age, income, night comfort all adversely affected; a House 1 planet, or Mercury reaching House 1, clears this."
    - condition: "Venus malefic/debilitated/without aspect"
      effect: "Second male child only 12 years after the first."
    - condition: "Jupiter in Houses 7-12, or Sun later than House 7"
      effect: "Malefic Venus; loss of wealth and other troubles depending on Mars's position."
  remedy: >
    Clean private parts with Potassium Paramagnet or Mars-items (per a
    doctor's advice) to ward off denial of a male child. Wife should wear
    gold ornaments on her head and wash private parts with curd, or
    donate two gold ornaments at marriage, for lifelong progeny benefit.
  source: "Goswami 1952, 'Venus in House No. 6', pp. 456-459"

- id: venus_house_7
  planet: Venus
  house: 7
  summary: >
    Venus in House 7 takes on the effect of its companion planet, and is
    benefic when alone — long life and earnings, though philandering
    outside is harmful.
  severity: mixed
  benefit_effects:
    - condition: "Sun, Moon and Rahu in Houses 1, 7, 9 and 11"
      effect: "Wealth and a benefic Venus."
    - condition: "Saturn in House 9 or 11"
      effect: "Benefic; business dealing in comfort-items is beneficial."
    - condition: "Mercury benefic in Houses 2, 4, 6"
      effect: "Gains for 37 years from the date of marriage."
    - condition: "Venus benefic"
      effect: "Good marital life and gains through Venus-professions always."
    - condition: "Venus alone in House 7 and Moon in House 4"
      effect: "Stays away from sex."
    - condition: "Jupiter dormant"
      effect: "Returns home safely; dies at home, not away."
    - condition: "Saturn, Mercury, Ketu (friends) in Houses 1,7,9,11"
      effect: "Venus takes on these planets' results — family via Saturn, children via Ketu, wealth via Rahu, family life via Mercury."
  malefic_effects:
    - condition: "General placement"
      effect: "Loss of money through the opposite sex; licentious nature leads to ruin; age ~85-94; partnerships with the wife's relatives cause loss."
    - condition: "Venus and Jupiter conjoin, or Jupiter malefic"
      effect: "Business losses; difficulties with childbirth."
    - condition: "Moon in House 1"
      effect: "Unlucky native, malefic Venus."
    - condition: "Sun in House 4, Moon in House 1, Rahu in House 7"
      effect: "Barren woman or eunuch male; may renounce the world."
    - condition: "Moon or Rahu transit House 1 with House 3 weak/ill-aspected"
      effect: "Unlucky; loss through theft in years 4,16,28,40,52,64,76,88,100,114."
    - condition: "Sun or Mercury in House 8"
      effect: "Death of wives, especially with a skylight in the house."
    - condition: "Rahu in House 8"
      effect: "Unlucky, troubled wife; she should avoid blue colour."
    - condition: "Rahu conjoins or is malefic"
      effect: "Troubled life; loss through the opposite sex."
    - condition: "House 1 blank"
      effect: "Benefic Venus, though anger/opposite-sex influence brings loss and bad luck."
    - condition: "Sun, Moon or Rahu in (or House 4 itself malefic, as enemies)"
      effect: "Malefic Venus; selfishness a source of ruin."
    - condition: "Jupiter in House 2 and a malefic Mars"
      effect: "Denies progeny or brings extreme unhappiness."
    - condition: "House 8 blank"
      effect: "Highly sexy native, over-indulgence risking TB/STDs."
    - condition: "Saturn (and Moon) in House 6"
      effect: "Spouse suffers diseases of private parts/heart; Saturn-liquid items (liquor) may help."
  remedy: null
  source: "Goswami 1952, 'Venus in House No. 7', pp. 460-462"

- id: venus_house_8
  planet: Venus
  house: 8
  summary: >
    Venus in House 8 ("a woman made of burnt soil") makes the spouse
    harsh-tempered — her words carry real effect, so she must not be
    ignored.
  severity: caution
  benefit_effects:
    - condition: "Some planet in House 2"
      effect: "Venus gives results like Venus in House 2."
    - condition: "Moon, Mars, Mercury not alive"
      effect: "Venus turns benefic."
  malefic_effects:
    - condition: "General placement"
      effect: "Venus unfavourable till age 11; benefic from age 12 (when Venus transits House 12); years 27, 34, 39-45 unlucky; should not marry before 25."
    - condition: "Sun, Moon or Rahu in House 2, 8"
      effect: "Should not stand surety for anyone; licentious character prone to syphilis-like diseases; donating a cow is the best remedy."
    - condition: "House 2 blank"
      effect: "Helpful on the battlefield but damaging at home; elders' condition doubtful; losses/misery to in-laws, poor progeny."
  remedy: >
    Donate barley or bury it under earth (for wife's health). Do not
    accept donations; be religious and pray in a temple for victory over
    enemies. Throw a copper coin or flower into a sewer; serve/donate a
    cow; pray in temples.
  source: "Goswami 1952, 'Venus in House No. 8', pp. 462-463"

- id: venus_house_9
  planet: Venus
  house: 9
  summary: >
    Venus in House 9 ("a dark storm, Mars negative") means self-earned
    wealth is the best path — forefathers may have been well off, but the
    native rarely is without hard toil.
  severity: caution
  benefit_effects:
    - condition: "General placement"
      effect: "Pilgrimages to holy places; intelligent, industrious, wealthy but always toiling; burying silver pieces under a Neem tree aids financial uplift."
    - condition: "Moon or Mars conjoins Venus"
      effect: "Keeping a mare, well, silver or honey in the house makes Venus nine times beneficial."
  malefic_effects:
    - condition: "General placement (highly inauspicious)"
      effect: "Loss around age 25 through marriage/cow/agriculture/Venus-relations; malefic Mars turns negative bringing poverty; Mercury/Rahu/Ketu malefic for children and opponent troubles."
    - condition: "Rahu-Ketu & Saturn or Mercury conjoins/adjoins/transits"
      effect: "From age 17, addiction to drinking etc. and undue expenditure; wife diseased from the wedding day; red thread/bangles help; building a house when Saturn transits House 1 is beneficial."
    - condition: "Sun, Moon, Rahu in House 4, or RKS in House 4"
      effect: "Loss of wealth in years 4,16,28,42,52,64,76,88,100,114."
    - condition: "Moon in House 7, or malefic"
      effect: "Poverty and unfavourable children."
    - condition: "Jupiter and Venus conjoin, or Jupiter malefic"
      effect: "Obstruction in childbirth; poor transactions/business."
    - condition: "House 1 blank"
      effect: "Blood disease."
  remedy: "Put a hole in a Neem tree and place a silver piece inside, sealed with Neem wood."
  source: "Goswami 1952, 'Venus in House No. 9', pp. 464-465"

- id: venus_house_10
  planet: Venus
  house: 10
  summary: >
    Venus in House 10 acts like an "imaginary Saturn" — religious if
    Saturn is benefic, but generally hankering after women and lacking
    progeny/wisdom.
  severity: mixed
  benefit_effects:
    - condition: "Saturn conjoins/adjoins or is in House 1"
      effect: "Saturn benefic if the native avoids Saturn's bad deeds (like excessive cleverness)."
    - condition: "House 4 blank"
      effect: "Venus acts like benefic Saturn, though the native becomes very sexy and of questionable character."
    - condition: "Saturn alone in Houses 9, 11 (exalted)"
      effect: "Benefic Mercury; no accidents while wife is alive; blessed with gardens, orchards, wife's good health, happy domestic life while the western wall stays Kuchcha (unfinished)."
    - condition: "A planet in Houses 1, 5"
      effect: "Comfortable life, especially enjoyed in youth; success in love; comfortable old age."
    - condition: "Moon alone in Houses 2, 4 or 7"
      effect: "Blessed with conveyance, wealth, comforts."
  malefic_effects:
    - condition: "Children denied or dying after birth, or a licentious wife"
      effect: "Washing the wife's private parts with curds helps, turning Venus into 'Saturn in House 10'."
    - condition: "Afflicted health"
      effect: "Donating a cow (especially a Kapila cow) wards off Saturn's malefic effects; relations with other women cause trouble via children in old age (12 years of suffering through Ketu/Mars/Moon)."
    - condition: "Sun, Moon or Rahu conjoins Venus (enemies)"
      effect: "12 years of troublesome life span."
    - condition: "Saturn malefic"
      effect: "Malefic Venus; wife unhappy and diseased."
    - condition: "Saturn in House 5"
      effect: "May cause eye troubles for the wife; keeping a goat helps."
  remedy: "Donate a Kapila cow. Time house-building/decisions with favourable Venus/Saturn transits noted in the source."
  source: "Goswami 1952, 'Venus in House No. 10', pp. 466-467"

- id: venus_house_11
  planet: Venus
  house: 11
  summary: >
    Venus in House 11 gives a handsome person hankering after wealth —
    excessive indulgence risks impotence; mother's support is lacking but
    daughters are plentiful.
  severity: mixed
  benefit_effects:
    - condition: "Mercury or Moon strong, without malefic aspect, unconjoined/unafflicted by enemies"
      effect: "Secretive but changeable nature, blessed with money; earns well for 12 years; wealthy regardless of how marriage was contracted (otherwise risk of becoming eunuch)."
    - condition: "Rahu in House 12"
      effect: "Wealthy due to the birth of daughters."
  malefic_effects:
    - condition: "General placement"
      effect: "Troubled, neglected, unhappy wife of questionable character from the wedding day; secretive, deceptive, changeable nature; death by severing of the head; wife should not control household finances."
    - condition: "Mercury in House 3 or conjoins/adjoins"
      effect: "No denial of wealth, but loss of wealth through daughters; Mercury and Rahu-Ketu-Saturn give malefic results."
    - condition: "House 3 blank"
      effect: "Benefits from Venus through Mars's remedy or the wife's brothers' help — wealth and comfortable family follow."
    - condition: "Three years after marriage"
      effect: "Everything gets ruined."
    - condition: "Excessive masturbation/night discharge/urinary disease habits"
      effect: "Loss of virility (not full eunuch-hood); Saturn (fish oil, iron) or Moon (silver, milk products) medicines for 40-43 days help, per a doctor's advice."
  remedy: >
    Saturn/Moon medicines as above. Donate mustard oil. Remedy of
    Mercury helps when Venus's 20-year major period turns malefic.
  source: "Goswami 1952, 'Venus in House No. 11', pp. 468-469"

- id: venus_house_12
  planet: Venus
  house: 12
  summary: >
    Venus in House 12 is a helpful deity in times of adversity — born
    poor but becomes very wealthy after marriage; the wife rescues the
    native when no one else helps.
  severity: mixed
  benefit_effects:
    - condition: "Moon and male planets thrice-effective, if linked, especially in House 2"
      effect: "Excellent results; royal favours, wife's comforts for 37 years; enemy destroyed, comfortable nights; Venus as benefic as Venus in House 2."
    - condition: "Saturn and Jupiter in House 7, conjoining/adjoining"
      effect: "Fish Line — spouse leads a troubled life, but other family/children happy and comfortable."
    - condition: "Mercury in House 2 or 6, or alive"
      effect: "Fond of music; couple enjoys 96 years combined lifespan; lover of poetry."
    - condition: "Strong Venus generally"
      effect: "Conjugal bliss; attraction to the opposite sex in early life, especially if Mars and Saturn afflict Venus."
  malefic_effects:
    - condition: "Houses 2 and 7 blank/ill-aspected"
      effect: "Venus gives malefic results."
    - condition: "Mercury malefic"
      effect: "Spouse becomes a source of trouble, unlucky and unhappy."
    - condition: "Rahu in Houses 2,6,7,12"
      effect: "Troubled life till age 25; keeping a blue cow or Rahu-items is malefic (breeding a non-blue cow is beneficial instead)."
  remedy: >
    Donate a cow for spouse's health. Worship one's deity during
    adversity. The wife burying a blue flower in a jungle in the evening
    wards off malefic effects.
  source: "Goswami 1952, 'Venus in House No. 12', pp. 470-471"

- id: mercury_house_1
  planet: Mercury
  house: 1
  summary: >
    Mercury in House 1 gives a King-like temperament but selfish,
    mischievous and ill-reputed — Mercury may not be good for itself but
    shines for others.
  severity: mixed
  benefit_effects:
    - condition: "Mercury in House 1 linked with Sun"
      effect: "Wife comes from a wealthy family, chaste, loving, sober."
    - condition: "Mars in House 12"
      effect: "Mercury in House 1 will never be malefic."
    - condition: "Mercury in House 1 with a planet (especially Saturn/Venus) in House 7"
      effect: "Extremely benefic, especially for a dark-complexioned person."
    - condition: "General placement"
      effect: "Mercurial temper, self-willed, independent views; sisters/daughters gain wealth; gains from government/superiors; not very religious but earnings never fail; Rahu-Ketu also follow Mercury's dictates."
  malefic_effects:
    - condition: "Mercury alone in House 1 and House 7 blank"
      effect: "Malefic, but still a Royal Combination — wins over others, helpful to them."
    - condition: "Moon in House 7"
      effect: "Excels at drinking and eating, leading to a troubled life."
    - condition: "Mercury weak/afflicted"
      effect: "Mischief and ill repute."
    - condition: "Female chart with this placement"
      effect: "Still a Royal Combination, but remains suspect to blame and ill fame."
    - condition: "In-laws (Rahu) and children (Ketu) generally"
      effect: "Both suffer, especially if the native drinks and eats meat."
    - condition: "Youth phase"
      effect: "Lucky but greedy; roams from place to place unproductively — staying put is more beneficial."
    - condition: "30 or more than 32 teeth"
      effect: "Unfavourable — acts like Mercury posited in House 12; unfavourable words spoken come true."
  remedy: "Keep away from the colour green. Keep away from one's sister-in-law."
  source: "Goswami 1952, 'Mercury in House No. 1', pp. 515-516"

- id: mercury_house_2
  planet: Mercury
  house: 2
  summary: >
    Mercury in House 2 gives a "Yogi King" — selfish but knowledgeable;
    alone it is highly auspicious and forms a Royal Combination.
  severity: mixed
  benefit_effects:
    - condition: "General strength"
      effect: "Broad, intelligent, King-like but self-centred forehead-type; lucky, though Venus turns malefic; Jupiter highly benefic for himself."
    - condition: "General strength (family)"
      effect: "Destroys enemies, increases children, wealthy, lucky, very helpful to in-laws."
    - condition: "General strength (parents)"
      effect: "Lucky for himself, unlucky for father; mother lives long; supports a large family through hard work."
    - condition: "Rahu in House 8"
      effect: "Quick-witted."
    - condition: "Rahu in House 9"
      effect: "Sweet, impressive speech."
    - condition: "Mars in House 8"
      effect: "Profit through writing and speech."
    - condition: "Mars in House 9"
      effect: "Self-willed, strong-headed; forceful speech covers his defects."
    - condition: "Mercury in House 2 alone"
      effect: "Like a dominating King."
    - condition: "House 6 or 8 blank"
      effect: "Intelligent, no mental troubles."
    - condition: "Moon in Houses 8-12, not weak/afflicted"
      effect: "Father blessed with long life."
    - condition: "Ketu in House 8"
      effect: "Gives sermons/guides others; quick-witted."
    - condition: "Ketu in House 9"
      effect: "Good power of speech."
    - condition: "Jupiter in House 9 or 12"
      effect: "Respect and a long-lived mother."
    - condition: "Sun in House 8"
      effect: "Skilled and greedy for money."
    - condition: "Saturn in House 6"
      effect: "Very favourable; self-made wealthy, lucky, comfortable, though no comfort from father."
    - condition: "Mars or Mars-Jupiter in House 6"
      effect: "Jupiter doesn't harm father though may affect Mars (brother); blessed with long life and long-lived mother."
  malefic_effects:
    - condition: "General weakness"
      effect: "Mercury becomes 'a bundle of ash'."
    - condition: "Ketu also malefic"
      effect: "Delayed progeny; troubles through children, though never fully denied children."
    - condition: "General affliction (wealth/father)"
      effect: "Wealth disappears; destroys father's earnings; losses through gambling/speculation/lottery; father's death around ages 16-21 or 34-46, and a source of loss while alive."
    - condition: "Mercury-related relations generally (sister, daughter, father's sister)"
      effect: "Become unlucky; a nose hole before age 16-21 for 4-5 days (96 hours), then permanently, helps."
    - condition: "Sun in House 8"
      effect: "Self-willed, proud, healthy and intelligent, but financially weak."
    - condition: "Venus in Houses 3,8,9,12 (Mercury malefic), or rearing sheep/parrot"
      effect: "Living with sister-in-law harmful; first wife and self destroyed (as Mercury in House 12)."
    - condition: "Saturn or Sun powerful"
      effect: "Mercury's effects become wavering."
    - condition: "Jupiter in House 8"
      effect: "Malefic for relations and grandfather; Jupiter-items also adversely affected."
    - condition: "Moon and Saturn in House 12"
      effect: "Ancestral property/wealth wasted from age 17 to 32-35; donating rice/silver/milk (Moon) helps."
    - condition: "Moon in Houses 8-12 but afflicted"
      effect: "May even become a murderer."
  remedy: "Pierce the nose and keep silver in it for 90 days. Serve maidens. Remedy of Moon/Jupiter helps."
  source: "Goswami 1952, 'Mercury in House No. 2', pp. 517-519"

- id: mercury_house_3
  planet: Mercury
  house: 3
  summary: >
    Mercury in House 3 is extremely malefic in general (destructive after
    birth/visit, though not to the self) — Mars placed before Mercury
    turns this excellent instead, giving a large family.
  severity: mixed
  benefit_effects:
    - condition: "Mars in House 1"
      effect: "Mercury benefic; wealth and family increase; favourable results supported by Jupiter in Houses 9/11 and Venus in House 7."
    - condition: "Sun in House 11"
      effect: "Gains through maternal uncle and children (Ketu); may become a doctor of bronchitis/asthma; long life."
    - condition: "Houses 9, 11 blank and Mercury dormant"
      effect: "Mercury all-round benefic."
    - condition: "Venus alive"
      effect: "Beneficial, along with Ketu; benefic Moon effect and good writing power."
  malefic_effects:
    - condition: "Mercury weak/afflicted"
      effect: "Crosses with relatives/brothers unless Mars is benefic; medium loss, though a stammer paradoxically signals luck; otherwise extremely damaging for the family; 32 teeth bring trouble."
    - condition: "Ancestral-property/4th-house effects generally"
      effect: "Ancestral property, income sources, peace of mind suffer; forces a change of residence away from the ancestral place."
    - condition: "Mercury malefic (general remedy note)"
      effect: "Ketu's articles/relations suffer; keeping a dog (or three worldly dogs) helps; up to age 34, House 9/10 items destroyed while House 11 (income flow, superiors' goodwill) merely stays under adversity."
    - condition: "House door facing South"
      effect: "Mercury takes on House 8's malefic results — ruinous for wife, wealth, in-laws."
    - condition: "Venus in House 4"
      effect: "Delayed progeny."
    - condition: "Moon in House 8, and House 6 lacking friends of Mercury"
      effect: "Venus, Saturn and Rahu also damaged."
    - condition: "Rahu-Ketu-Saturn in Houses 6 or 7"
      effect: "Loss of father's wealth; troubled life for maternal uncle and mother's sister's husband."
  remedy: >
    Clean teeth daily with alum. Feed soaked moong pulse to birds in the
    morning for 43 days, or bury milk-washed Butia Frondosa (Dhak) leaves
    under stone/earth in an obscure spot (utensils used must not return
    home). Fix and wash a stone (Shivling) with milk. Burn small yellow
    sea shells and put the ashes in running water (for leprosy/eczema).
    Serve green lentils to birds; donate a goat and Mercury-items; nose
    piercing; bury Dhak leaves (per age) washed in milk.
  source: "Goswami 1952, 'Mercury in House No. 3', pp. 520-522"

- id: mercury_house_4
  planet: Mercury
  house: 4
  summary: >
    Mercury in House 4 is a Royal Combination — endless flow of wealth
    for sisters/daughters, though hard on the father (and on the mother
    if Mercury is in House 2 instead).
  severity: mixed
  benefit_effects:
    - condition: "Mercury alone"
      effect: "Excellent, turns associated planets into gold."
    - condition: "Either female or male planets benefic"
      effect: "Respects other women; tolerant; takes on others' problems."
    - condition: "Moon in House 2"
      effect: "Royal Combination — bountiful wealth; helps the whole family (especially with 32 teeth and Mars not negative)."
    - condition: "Sun-Moon in Houses 3, 5, 11 and Jupiter in House 9"
      effect: "No malefic effect from evil planets; family prosperity, age and wealth all excellent."
    - condition: "Moon in House 3, 6, or House 2 blank"
      effect: "Long parental bliss."
    - condition: "Jupiter benefic"
      effect: "Royal Combination — all-round prosperity, government help."
  malefic_effects:
    - condition: "General placement (mother's fate)"
      effect: "Mother, joyful at birth, later grows remorseful realising her own life is limited; bringing live Mercury-things (parrot, sheep, goat) home makes her (Moon) 'disappear'; family wealth and her own state become pitiable."
    - condition: "Rahu malefic or in malefic houses"
      effect: "Condition of male family members poor."
    - condition: "Ketu poor or in malefic houses"
      effect: "One would be 'like a dead body'."
    - condition: "Venus, Rahu or Saturn in Houses 2,5,9,12 (Father's Debt / Rin)"
      effect: "Travel and advisers turn poor."
    - condition: "Moon in House 6 or malefic"
      effect: "Destruction of female wealth and family life; may attempt suicide."
  remedy: >
    Silver chain for peace of mind. Gold chain for wealth. Tilak of
    saffron, or eating saffron, for 43 days. For a malefic Mercury,
    remedy via Sun-items; for wealth, remedy via Jupiter.
  source: "Goswami 1952, 'Mercury in House No. 4', pp. 523-524"

- id: mercury_house_5
  planet: Mercury
  house: 5
  summary: >
    Mercury in House 5 gives a happy native whose sudden words become
    prophetic — controlling the tongue is beneficial, and Mercury here
    acts favourably like Moon or Venus.
  severity: positive
  benefit_effects:
    - condition: "Male planets or Moon in Houses 3, 9, 11"
      effect: "Mercury salvages the family."
    - condition: "General placement"
      effect: "Sudden words become divine truth; Sun and Jupiter benefic; Moon-items gainful; Saturn favourable for property."
    - condition: "General placement (progeny)"
      effect: "Very lucky for progeny, domestic bliss, wealth, comfort; Sun favourable for service/profession; Mercury helps sons."
    - condition: "Sun, Moon, Jupiter in Houses 3, 9"
      effect: "Wealth and comforts after age 34."
    - condition: "Moon in House 12 or 4, or Moon in Houses 6, 12"
      effect: "Mercury controls the malefic effects of planets in Houses 4,6,7,8,9."
    - condition: "Mercury dormant (aspect house blank)"
      effect: "Humanistic qualities; excellent ancestral house, family life, and progeny."
  malefic_effects:
    - condition: "Malefic Mercury"
      effect: "Unfavourable results for Houses 1,3,4,5,7,9, though Moon/Jupiter in House 3 or 9 wards this off."
    - condition: "Unfavourable for father"
      effect: "Not for progeny though; wife stays a good, helpful partner; a copper coin/paisa around the neck is benefic."
    - condition: "Moon or Jupiter weak/malefic, especially Moon posited before Mercury"
      effect: "Evil results of Mercury; his own words become a source of loss."
  remedy: "Pearls and silver are gainful. A copper coin with a hole worn as a necklace. Nose hole."
  source: "Goswami 1952, 'Mercury in House No. 5', pp. 525-526"

- id: mercury_house_6
  planet: Mercury
  house: 6
  summary: >
    Mercury in House 6 gives an "unknown Yogi, King by heart" — kind
    words do good, greed damages; excellent with a favourable Venus and
    unafflicted Mars/Moon.
  severity: mixed
  benefit_effects:
    - condition: "General placement"
      effect: "Forceful words that come true; self-made wealthy, comfortable life, gains through voyages, more prosperous when content."
    - condition: "Intellectual pursuits/business"
      effect: "Gains; law suits favour the native; gains from agriculture land and honest business."
    - condition: "Self-made position (House 2/Venus link)"
      effect: "Self-made King; follows another benefic planet, especially in House 2; helpful Mercury-items, promotion, journey gains."
    - condition: "Mercury in House 6 alone and unaspected"
      effect: "Moon benefic for his items (except living ones); printing press/paper business profitable."
    - condition: "Saturn in House 9 or 11"
      effect: "Wife from a wealthy family."
    - condition: "Sun, Jupiter or Saturn in House 1"
      effect: "Royal Combination — wealthy, power, authority, immovable property."
    - condition: "Jupiter benefic, unafflicted, strong, well-placed"
      effect: "Royal Combination — paper/printing dealings favourable; honestly earned wealth beneficial."
  malefic_effects:
    - condition: "Mercury malefic"
      effect: "Greedy; a daughter married north of the ancestral house won't lead a comfortable life; a north-facing house is highly inauspicious; mother's death or adversity around age 34."
    - condition: "Mars in House 4 or 8"
      effect: "Early death of mother and a troubled life."
    - condition: "Venus in House 4 with malefic Ketu"
      effect: "Child born after age 34 survives; earlier-born child dies; wife should wear a silver ring on the left hand."
    - condition: "Moon and Jupiter in House 2, or Jupiter in House 11 and Moon in House 2"
      effect: "Defective eyesight; malefic Saturn; troubled old age around age 90."
    - condition: "Venus in House 4 (alternate combination)"
      effect: "Mars malefic till age 34; mother damaged."
  remedy: >
    When Venus is malefic, propitiate Moon and bury a bottle of Ganges
    water under agricultural land. When Mercury is malefic, bury a
    container of milk in a jungle. Wearing gold is generally helpful.
  source: "Goswami 1952, 'Mercury in House No. 6', pp. 527-528"

- id: mercury_house_7
  planet: Mercury
  house: 7
  summary: >
    Mercury in House 7 is benefic for others in a male chart, and for the
    self in a female chart — alive Mercury shines like a diamond, dormant
    Mercury is malefic.
  severity: mixed
  benefit_effects:
    - condition: "Mercury alive, a planet in House 1"
      effect: "Mercury benefic; helpful to family and relatives."
    - condition: "Moon in House 1"
      effect: "Gains through sea voyages."
    - condition: "Saturn in House 3"
      effect: "In-laws become rich and wealthy."
    - condition: "Some planet (friendly or inimical) in Houses 1 and 10"
      effect: "No malefic effect from these planets."
    - condition: "General placement"
      effect: "Comfortable old age, gains in speculation, skilled art, literary pursuits; no litigation/quarrels/criminal trouble; Venus-items extremely benefic."
  malefic_effects:
    - condition: "Ketu in House 1 or 8"
      effect: "Defamation through his sister-in-law; spoils Venus and Mars too."
    - condition: "House 1 blank (dormant Mercury)"
      effect: "Malefic — loss in business or childhood trouble, though comfortable old age; Venus stays malefic till age 34."
    - condition: "Jupiter in House 9"
      effect: "Troubled domestic life."
  remedy: "Serve a black, handicapped cow."
  source: "Goswami 1952, 'Mercury in House No. 7', pp. 529-530"

- id: mercury_house_8
  planet: Mercury
  house: 8
  summary: >
    Mercury in House 8 brings disease, blame, and a trap of destruction —
    damage to honour and wealth, though a male planet's company neutralises
    the malefic tendency.
  severity: caution
  benefit_effects:
    - condition: "A male planet conjoined with Mercury in House 8"
      effect: "Mercury not malefic; gives the same benefic effects as that planet."
    - condition: "Sun, Moon or House 4 benefic"
      effect: "Native benefited; Ketu saved at age 34; mother lives long; Moon-items beneficial."
    - condition: "Mars in House 12"
      effect: "Mercury not malefic."
    - condition: "Mars conjoins Mercury"
      effect: "Both give excellent results, though alone each is malefic in House 8."
    - condition: "Mercury in House 8 alone"
      effect: "Learned, scholarly, intelligent."
  malefic_effects:
    - condition: "General affliction"
      effect: "Health afflicted via teeth/intestines (though helps blood/eyesight); financial loss; troubles through superiors/government; a woman with this placement is termed shameless."
    - condition: "General placement (further)"
      effect: "Punishment/suffering without fault; wealth halved; sudden royal-affairs reversals causing financial loss; all living Mercury-objects become deceptive; Mars-items also malefic."
    - condition: "Mercury in House 8 alone (malefic variant)"
      effect: "Seldom any benefic results."
    - condition: "House 2 blank (natal or transit)"
      effect: "Malefic for 34 years — 'ringing death bells'; poisons debilitated planets further."
    - condition: "Jupiter in House 2, or some planet in House 2"
      effect: "Loss to father around ages 16-21; his longevity/health afflicted; a malefic House 2 planet adds to Mercury's poison."
    - condition: "House 12 blank"
      effect: "Muscular disease."
    - condition: "Sun, Jupiter, Mars in House 6"
      effect: "Early death of mother, or both mother and native diseased; mother's brother and children troubled."
    - condition: "House 6 polluted"
      effect: "A planet other than Jupiter gives poor results."
  remedy: >
    34 days before/after the birthday (and one day before/after), bury an
    earthen bowl full of honey in a jungle. Throw a copper pot full of
    moong dal into a river within 34-42 days of the birthday. Apply black
    antimony as a mole on the hips. Keep rainwater/milk on the rooftop,
    or a silver ring in a daughter's nose. Avoid red clothing/colour.
    Donate House-2-planet items; give 24 milk sweet cakes (no sugar) to a
    dog for Moon in House 2.
  source: "Goswami 1952, 'Mercury in House No. 8', pp. 531-533"

- id: mercury_house_9
  planet: Mercury
  house: 9
  summary: >
    Mercury in House 9 makes "a King and a leper" — together unlucky,
    short age; Venus and Mercury here are almost always malefic, resulting
    in a worried native with moderate income.
  severity: caution
  benefit_effects:
    - condition: "Moon, Ketu, Jupiter in Houses 1,3,6,7,9,11"
      effect: "Mercury benefic; lucky, wealthy, comfortable, long life, religious, big family."
    - condition: "Moon in House 3, 5, 8, or 9"
      effect: "Washing clothes in river water before wearing them (daytime) saves against Mercury's malefic effects in House 9."
  malefic_effects:
    - condition: "General placement (mysterious birth signaled by a stammer)"
      effect: "Mars or Sun turn malefic; ages 1,4,13,15,17,38 and 34 troublesome; a nose piercing (silver, 96 hours or 100 days) is the only remedy; father suffers for 29 years; from age 34 Mercury behaves like Mars-negative."
    - condition: "Moon, Ketu in House 11"
      effect: "Cheat, liar, full of vices."
    - condition: "Jupiter alone in Houses 6, 8, 10"
      effect: "Short age (~64 years); progeny/wife adversely affected despite a benefic Moon."
    - condition: "Moon or Jupiter (or both) in Houses 3, 6, 7"
      effect: "Long life, but troubles in married life and with children."
    - condition: "House 1 blank"
      effect: "Mischievous, quarrelsome; possible blood poisoning; fingernails turn green."
    - condition: "Mercury in House 9 transits to House 11 (ages 76, 96, 108, 120)"
      effect: "Highly troubled life; accepting a chain from a Sadhu brings misery within 17-34 days."
    - condition: "Mercury in House 9 alone"
      effect: "Unfaithful; taking a charm from a fakir proves disastrous."
  remedy: >
    Don't accept/keep charms or ash. Don't keep brass utensils inverted
    or empty. Don't keep/rear a basil plant/chain, parrot, or goat. Don't
    keep idols at home. Flow rice + pulse in water. Keep a red iron ball.
  source: "Goswami 1952, 'Mercury in House No. 9', pp. 534-536"

- id: mercury_house_10
  planet: Mercury
  house: 10
  summary: >
    Mercury in House 10 is totally subservient — a sycophant but a happy
    soul — following Saturn's dictates exactly, giving twice the benefic
    or twice the malefic effect.
  severity: mixed
  benefit_effects:
    - condition: "House 2 blank"
      effect: "Benefits through voyages; skilled, wealthy."
    - condition: "House 2 benefic"
      effect: "Mercury twice benefic; wealth flows in abundance."
    - condition: "Saturn benefic"
      effect: "Mercury extremely benefic."
    - condition: "Moon in Houses 3, 4, 5"
      effect: "Effect of the 'Lion house' (3 balance); arms dealing benefic, though malefic for wife and children."
  malefic_effects:
    - condition: "Addicted to liquor or overeating"
      effect: "Saturn turns malefic, causing ruin; Mercury follows suit through Saturn's, Rahu's and Ketu's periods."
    - condition: "Malefic Saturn"
      effect: "Causes death of father; Saturn twice effective."
    - condition: "House 8 malefic"
      effect: "Mercury twice malefic — troubled, worried, possibly blind."
  remedy: "Propitiation of Saturn helps."
  source: "Goswami 1952, 'Mercury in House No. 10', pp. 537"

- id: mercury_house_11
  planet: Mercury
  house: 11
  summary: >
    Mercury in House 11 is "rich since birth, an owl, a leper" until age
    34, then "a diamond" — extreme misery early on, extreme benefit
    after.
  severity: mixed
  benefit_effects:
    - condition: "House 2 blank"
      effect: "Skilful and respectful."
    - condition: "Mercury in House 11 (natal) transits House 1 at ages 11,23,36,48,57,72,84,94,105,119"
      effect: "Tremendous gain."
    - condition: "After age 34 generally"
      effect: "Wealth and comforts, once Jupiter's air and Saturn's poison stop mixing into Mercury's effect."
  malefic_effects:
    - condition: "Before age 34"
      effect: "Mercury stupid; a copper coin around the neck helps; malefic effect of Jupiter, Saturn and Moon stays in force."
    - condition: "Mercury in House 9 transits to House 11 and a charm is accepted from a fakir"
      effect: "Extremely destructive; if such a charm is already at home, flow it away in water."
  remedy: "Keep a red ball of iron."
  source: "Goswami 1952, 'Mercury in House No. 11', pp. 538"

- id: mercury_house_12
  planet: Mercury
  house: 12
  summary: >
    Mercury in House 12 is malefic for males, not for females — a long,
    comfortable life overall, but during transit it destroys peace of
    mind; with Saturn/Jupiter it becomes "a pond full of nectar".
  severity: mixed
  benefit_effects:
    - condition: "Jupiter or Saturn in Houses 2, 12; or Jupiter/Saturn in House 3 and Jupiter in Houses 2, 12"
      effect: "Prosperous and wealthy; respect, power, comforts — though loss through theft or unwanted expenditure persists."
    - condition: "Saturn and Jupiter in House 7 (Fish Line)"
      effect: "Benefic Mercury as long as Saturn/Jupiter don't join Mercury directly; malefic effect falls on sister/daughter/aunts (unlucky at native's house, comfortable with their in-laws) rather than the native."
  malefic_effects:
    - condition: "General placement"
      effect: "Changeable nature — euphoric then depressed, obstinate, twists arguments, lies; malefic effects begin with drinking; leprosy risk; wife troubled and unlucky; energy wasted on useless pursuits."
    - condition: "Mercury in House 12 generally (Ketu/Venus)"
      effect: "Makes Ketu and Venus malefic; children troubled; loss through speculation/air travel agents."
    - condition: "Marriage at age 25"
      effect: "Every third year unlucky; wife and father both become unlucky."
    - condition: "30 or more than 32 teeth"
      effect: "Malefic; cowardly; head/tongue/teeth/nose/intestines afflicted."
    - condition: "Sun or Mars in House 6"
      effect: "Early death of mother; maternal uncle troubled if alive."
    - condition: "Jupiter in House 6"
      effect: "Loss of father's wealth and his early death."
  remedy: >
    Nose piercing; wearing gold is favourable; wear a jointless
    iron/platinum ring (not received as a gift). Apply a turmeric/saffron
    Tilak on the forehead. Throw an empty earthen pot in running water.
    Serve dogs (three worldly dogs). Worship Lord Ganesh.
  source: "Goswami 1952, 'Mercury in House No. 12', pp. 539-541"

- id: saturn_house_1
  planet: Saturn
  house: 1
  summary: >
    Saturn in House 1 is three times malefic when bad, otherwise
    excellent across childhood, youth and old age — Saturn-Venus together
    here form either a "Crow Line" (malefic) or a "Fish Line" (benefic).
  severity: mixed
  benefit_effects:
    - condition: "Mercury in House 7"
      effect: "Mercury gives results like Ketu there; a male child is born; unlimited parental wealth (with benefic Moon) through the Rahu-Ketu-Saturn period."
    - condition: "Rahu-Ketu in Houses 4, 10"
      effect: "Like Mars in Houses 6-12, Saturn forms a Fish Line for wealth, though family members' individual incomes aren't guaranteed."
    - condition: "Houses 7 and 10 blank (treated as such under specific sub-conditions)"
      effect: "Fish Line — wealth, property increase, lifelong comforts flow."
    - condition: "Sun comes to Saturn's aid"
      effect: "Saturn becomes excellent."
  malefic_effects:
    - condition: "Excessive body hair (a sign of poor Saturn)"
      effect: "Agent of death 'wraps up' wealth by age 18; addiction to liquor/romance is the cause; a west-facing house doubles the malefic result; poverty/sickness at ages 36,39,42,45,48."
    - condition: "Rahu-Ketu poor"
      effect: "'Snake Line' and destruction; obstruction in education."
    - condition: "Rahu-Ketu poor and a planet in House 7"
      effect: "Saturn three times malefic — education, wealth, wife all in bad shape; Moon's luck also bad."
    - condition: "Mercury malefic"
      effect: "Ancestral business adversely affected; misfortune (funeral music) from birth itself."
    - condition: "Sun, Moon, Mars in House 4 (enemies of Saturn), or Sun/Rahu/Moon (enemies of Venus) in House 4 — except Saturn-Jupiter together"
      effect: "Father's condition poor; ancestral and Saturn/Rahu/Ketu items adversely affected, though the native's own life is long."
    - condition: "Sun in House 7"
      effect: "Doubtful/poor service matters."
    - condition: "Sun in Houses 10-11"
      effect: "Poor result of Venus; even Mars's effect poor; hard luck; relatives uncomfortable."
    - condition: "Mars negative (malefic)"
      effect: "Earnings affected, discomfort to children, eye damage, theft, deception, conflicts."
  remedy: >
    Seek Sun's help or rear a monkey (wealth). Mix sweet milk with
    Banyan-tree root soil as a Tilak (health). Bury black antimony in
    earth (business).
  source: "Goswami 1952, 'Saturn in House No. 1', pp. 551-553"

- id: saturn_house_2
  planet: Saturn
  house: 2
  summary: >
    Saturn in House 2 is "in service of the Guru" — barefoot temple
    visits and confession ward off adversity; House 8's planets largely
    determine Saturn's effect here.
  severity: mixed
  benefit_effects:
    - condition: "Milk/curd Tilak (not oil)"
      effect: "Improves both Saturn and Jupiter; a brown buffalo helps."
    - condition: "General placement"
      effect: "Good health though rarely visits temples; wise like a minister despite looking foolish; happy, kind-hearted, just; never a pauper."
    - condition: "Saturn in House 2 alive"
      effect: "A sense of detachment."
    - condition: "Moon excellent"
      effect: "Happy, long life, though father (Jupiter) is generally destroyed."
    - condition: "Jupiter in House 4"
      effect: "Razor-sharp intellect and self-confidence."
    - condition: "Ketu in House 8"
      effect: "Child-like innocence."
    - condition: "Ketu in House 9"
      effect: "Sharp intellect."
    - condition: "Mars in House 8"
      effect: "Rich."
    - condition: "Mercury in House 8"
      effect: "Wise man."
    - condition: "Jupiter in House 10"
      effect: "Religious, wise spender, patriotic."
    - condition: "Sun in House 10"
      effect: "Rich, jealous, miserly, nationalist Pandit, religious."
  malefic_effects:
    - condition: "Saturn malefic by nature"
      effect: "Hardship for in-laws from engagement/marriage; Saturnine acquisitions (houses, machines, cars) start disappearing from in-laws instead."
    - condition: "Rahu in Houses 8-12 (Saturn turns against Rahu/in-laws)"
      effect: "A 'two-eyed snake' destroys in-laws; Mercury mischief though Jupiter stays benefic; poverty from the engagement date, escalating; Rahu in House 8 costs male in-laws, in House 12 costs wealth."
    - condition: "Jupiter in House 11"
      effect: "Slavish nature, weak mind, coward, broken heart; poor reputation, selfish."
    - condition: "Sun in House 12"
      effect: "Likes to be notorious; mediocre status; famous gambler with suspicious nature; expenses/gains even out."
    - condition: "Mercury in House 12"
      effect: "Does no good without Saturn/Jupiter's help; a daughter born before age 34 should be given to her in-laws (not reared by her own parents) to bring prosperity."
    - condition: "Mars malefic"
      effect: "Sickness from ages 28 to 39."
    - condition: "Rahu in House 8 (temperament)"
      effect: "Suspicious nature."
    - condition: "Rahu in House 9 (temperament)"
      effect: "Fond of loneliness."
    - condition: "Mars in House 9 (temperament)"
      effect: "Full of thoughts of death."
    - condition: "Jupiter in House 8 (temperament)"
      effect: "Full of baseless thoughts."
    - condition: "Sun, Jupiter, Mercury in House 8 (temperament)"
      effect: "Endless depression, fond of loneliness."
    - condition: "Sun in House 8 (temperament)"
      effect: "Notorious."
  remedy: >
    Barefoot temple visits, confessing mistakes and seeking pardon.
    Serve milk to snakes to protect in-laws (avoid black/twin-coloured
    buffalo).
  source: "Goswami 1952, 'Saturn in House No. 2', pp. 554-557"

- id: saturn_house_3
  planet: Saturn
  house: 3
  summary: >
    Saturn in House 3 is generally malefic (twice as much when bad) but
    remediable — "a lion called a goat" that deprives one of wealth;
    Ketu's support is decisive.
  severity: mixed
  benefit_effects:
    - condition: "Ketu in House 3 or 10 (supportive)"
      effect: "Many houses as long as a dog is kept/three worldly dogs served; increase in wealth; can become a noted eye surgeon."
    - condition: "Mars negative (paradoxically here)"
      effect: "Strangers help too; may harm others' works but stays comfortable himself."
    - condition: "Free distribution of eye-treatment medicines"
      effect: "Benefits the native's own eyesight."
  malefic_effects:
    - condition: "Not keeping a dog"
      effect: "Ketu turns malefic and destroys Saturn; lack of intellect, indulgence; own relations become a source of discomfort — Ketu's treatment helps (unnecessary if Ketu itself sits in House 3 or 10); worship Lord Ganesha."
    - condition: "Sun in East (Houses 1,5) or South (House 3), south-facing door"
      effect: "Harmful; a stone pillar dug at the south door may bring 3 family deaths 40 days apart."
    - condition: "Sun in Houses 1, 3, 5"
      effect: "Poor results of Ketu and Saturn."
    - condition: "Moon in House 10"
      effect: "Malefic Saturn turns destructive; a well in the house causes death and destroyed wealth."
    - condition: "Enemy planets with/adjoining Saturn"
      effect: "Total destruction — thief, dacoit, loss of wealth."
  remedy: "Keep a dark room in the house for savings."
  source: "Goswami 1952, 'Saturn in House No. 3', pp. 557-558"

- id: saturn_house_4
  planet: Saturn
  house: 4
  summary: >
    Saturn in House 4 is "a watery snake" — dry poison kills, but
    poisonous water is unsafe for everyone; a sense of detachment from
    parental affection and romance follows.
  severity: mixed
  benefit_effects:
    - condition: "General placement (medical connection)"
      effect: "A '4-eyed snake' that doesn't harm the native; can even revive a paralysed man; Saturn-items relieve poverty; many family members become doctors, including the native himself."
    - condition: "Moon in Houses 2, 3"
      effect: "Comfort of parents and in worldly affairs."
    - condition: "Ill health"
      effect: "Saturn-items (liquor, oil, intoxicants) help; Moon-items are ineffective here."
    - condition: "Serving milk to snakes, rearing fish/buffalo/crow, serving labourers"
      effect: "Dilutes Saturn's poison and helps mother and her family; throwing milk in a well improves finances."
  malefic_effects:
    - condition: "Moon in Houses 2, 3 (Father's Debt / Rin), Jupiter in House 3"
      effect: "Destroys wealth; Jupiter here robs others to gain for himself."
    - condition: "Moon with Saturn"
      effect: "Venus poisoned; Moon in House 9 makes mother unhappy."
    - condition: "Destroying Saturn by drinking, killing snakes, or laying house foundations at night"
      effect: "Mother gets 'snake bite', maternal uncle gets poisoned; own finances stay destroyed till Saturn's age/period."
    - condition: "Womanising"
      effect: "Venus's effect gets poisoned."
    - condition: "Milk taken at night"
      effect: "Acts like poison."
    - condition: "Selling oil (Saturn-items)"
      effect: "Loses children."
    - condition: "Moon in Houses 4, 10"
      effect: "Moon destroyed; mother unhappy; poison to maternal uncle; water becomes dangerous; loss of property, travel expenses, widowhood, discomfort from women."
  remedy: >
    Saturn-items (liquor, oil, intoxicants) for ill health. Milk to
    snakes, or serving fish/crow/labourers, clears Saturn's poison.
    Throwing Moon-items in a well brings financial prosperity.
  source: "Goswami 1952, 'Saturn in House No. 4', pp. 558-559"

- id: saturn_house_5
  planet: Saturn
  house: 5
  summary: >
    Saturn in House 5 is "a snake which devours children" — the native
    himself may be safe, but wealth and progeny suffer; Ketu decides sons,
    Rahu decides houses.
  severity: caution
  benefit_effects:
    - condition: "Ketu benefic"
      effect: "Inquisitive nature drives advancement; children grow."
    - condition: "Rahu benefic"
      effect: "Number of houses increases."
    - condition: "Venus in Houses 7-12, Sun-Moon in Houses 5-9-10, Mars-Jupiter in House 10"
      effect: "No malefic effect on children (no remedy needed), though children may be of little use to parents (may even steal and sell family items cheaply)."
    - condition: "House 11 blank"
      effect: "Saturn acts as a religious God."
    - condition: "Jupiter in House 9"
      effect: "Good luck at ages 5,17,41,49,53,65, though children's condition stays poor."
    - condition: "Ketu in House 4"
      effect: "Saturn won't adversely affect children regardless of whether the first son survives; the family priest bears the brunt instead; serving three worldly dogs helps."
  malefic_effects:
    - condition: "Saturn in Houses 5, 7 natally, with Sun/Moon/Mars transiting House 7"
      effect: "Health adversely affected."
    - condition: "Saturn's age periods (9, 18, 36)"
      effect: "House 2 items damaged/'snake-bitten'; Saturn takes on an artificial 'Rahu temper' if Mars and Mercury conjoin/aspect together."
    - condition: "Bad times generally"
      effect: "Someone loses wealth, some children, or is otherwise destroyed."
    - condition: "House 10 blank"
      effect: "'Blind snake' devouring children — even with seven wives and many children, only one son survives past age 48; building/buying a house (without Venus in Houses 7/12 or Sun/Moon in Houses 5-9) rusts the children's fortunes."
    - condition: "Saturn malefic (Rahu/Ketu period)"
      effect: "Malefic till the Rahu/Ketu age; a life spent in poverty."
    - condition: "Sun or Saturn in House 1 (transit)"
      effect: "No wealth despite effort."
  remedy: >
    Establish Sun-items (skylight, monkey, copper, brown buffalo),
    Moon-items (rice, milk, pearls, chakor), Jupiter-items (gold,
    saffron), Mars-items (honey, sugar, aniseed, coral, weapons) in the
    ancestral house — but destroy Mars-items there if Rahu-Ketu is in
    House 10. When Saturn transits House 5, take almonds to a temple,
    leave half, bring half home. Distribute salty (not sweet) items at a
    child's birth.
  source: "Goswami 1952, 'Saturn in House No. 5', pp. 560-562"

- id: saturn_house_6
  planet: Saturn
  house: 6
  summary: >
    Saturn in House 6 is "the ink of destiny" — one unit malefic; a
    truant son or counterfeit coin can still prove useful at times; after
    age 42, Saturn turns excellent and compensates for everything.
  severity: mixed
  benefit_effects:
    - condition: "Mercury and Ketu not malefic"
      effect: "Not childless."
    - condition: "Marriage after age 28"
      effect: "24 years of sons; comfortable parents; bountiful prosperity and education."
    - condition: "Friendly planets (Mercury, Venus, Rahu) in House 10, Mercury in House 2"
      effect: "Saturn does not help the agent of death."
    - condition: "Rahu in House 3 and 6 (natal/transit, exalted)"
      effect: "After age 42, Saturn gives excellent results even with Sun in House 12 — wiping out prior misfortune."
    - condition: "Sun in House 12 (alternate note)"
      effect: "Venus is 'in full bloom' and wife is happy."
    - condition: "Ketu in House 10, or exalted"
      effect: "Sons instead of daughters; beneficial travels; son more successful than father; all-round prosperity."
  malefic_effects:
    - condition: "Bad condition of Saturn-items (leather shoes, iron articles)"
      effect: "First sign of malefic Saturn; drinking and house-building worsen it; buying new leather shoes after malefic Saturn transits House 6 damages court/service/royalty matters — best avoided."
    - condition: "Saturn malefic ('lord of destiny')"
      effect: "One-unit malefic, not permanent; wraps the native in discomfort if it doesn't cause outright poisoning; Jupiter (wherever placed) becomes certainly malefic too."
    - condition: "Marriage before age 28"
      effect: "Saturn moves like a poisonous snake on the chest; Mercury afflicted; damage to mother/children at ages 34-36 (native himself may be spared); Ketu also turns malefic; building a house is best delayed past 36-39 (preferably 48)."
    - condition: "Mars in House 2 with Rahu in House 1"
      effect: "Elder brother and father adversely affected by Saturn's aspect; maternal uncle may go blind at age 21."
    - condition: "Mercury, Venus, Rahu in Houses 4-10, or Mercury in House 2, or Sun/Moon/Mars conjoined with Saturn"
      effect: "Death by severing of the head; secretive work; hard luck."
    - condition: "Venus or Moon in House 2"
      effect: "Poor luck; Saturn becomes a malicious snake; loss of cow and money, especially with Rahu afflicted in House 8."
  remedy: >
    Flow coconut or almonds in water. Worship snakes for more children.
    Rear a pitch-black dog (Ketu protection); mustard/Rahu-items help.
    Bury an earthen pot full of mustard oil under soil by a river/tank to
    keep Saturn "blind at night" — Saturn-related work is safest started
    on a moonless night.
  source: "Goswami 1952, 'Saturn in House No. 6', pp. 563-566"

- id: saturn_house_7
  planet: Saturn
  house: 7
  summary: >
    Saturn in House 7 is "the pen of the Almighty for earning" —
    liaisons with other women act as a coffin for the self; Venus is
    Saturn's foundation here, multiplying its power sevenfold.
  severity: mixed
  benefit_effects:
    - condition: "Mercury, Venus, Rahu (friends) in Houses 3,5,7,11"
      effect: "Excellent results across Saturn/Venus/Mercury/Rahu, though a Saturnine business partner causes loss."
    - condition: "Mars benefic"
      effect: "High monthly income, though ancestral property may be modest."
    - condition: "Mercury in House 11"
      effect: "Wealthy, head of a village/area."
    - condition: "Mercury or Venus with Saturn"
      effect: "Mars and Ketu twice benefic; long, healthy life; comfort from children; secret help against enemies."
    - condition: "Mars, Jupiter or Venus aspect Saturn"
      effect: "Very wealthy."
    - condition: "Mars/Moon or Mars/Saturn aspect Jupiter"
      effect: "Providential help."
    - condition: "House 1 blank"
      effect: "All prosper, but a pot full of honey must be kept at home, or wealth is lost after a grandson's birth."
    - condition: "A pillar in the house"
      effect: "Indicates benefic Saturn acting like an exalted Jupiter, making the native very rich (with Venus's help too)."
  malefic_effects:
    - condition: "Saturn in Houses 5 or 7, with Sun/Moon/Mars transiting House 7"
      effect: "Adverse effect on health."
    - condition: "Liaisons with other women"
      effect: "Loss of children, devoid of progeny, money loss — contained as long as the ancestral house stays intact."
    - condition: "Saturn malefic"
      effect: "Malefic; drinking gives a Crow Line effect; frequent imprisonment (theft/dacoity)."
    - condition: "Mars, Moon, Venus weak"
      effect: "Full of miseries."
    - condition: "Jupiter malefic"
      effect: "Inwardly poor/mean despite outward pretensions."
    - condition: "Mars-Mercury or Jupiter-Venus conjoined"
      effect: "Forms an 'artificial Saturn' (Ketu-temper or Rahu-temper); poor health till 29 (a doubtful year); quarrelsome, unlucky."
    - condition: "Moon malefic"
      effect: "Turns Saturn malefic; hard struggle for wealth; head diseases."
    - condition: "Venus with Saturn"
      effect: "Selfish, ruthless, loose character; diseased wife."
    - condition: "Mercury in House 1"
      effect: "Death by severing of the head."
    - condition: "Mercury in House 7 (transit)"
      effect: "Damaged eyesight."
    - condition: "Sun in House 4"
      effect: "Eunuch, useless; planets dormant at night."
    - condition: "Mars negative"
      effect: "Malefic effect of Saturn in House 1; life apprehended till age 27."
    - condition: "Mercury or Sun/Moon/Mars in Houses 3,5,7,10 (enemies)"
      effect: "Age, wealth, father, ancestral and own property all adversely affected."
  remedy: >
    Fill a flute with sugar and bury it outside if House 1 is blank;
    otherwise keep a pot of honey at home.
  source: "Goswami 1952, 'Saturn in House No. 7', pp. 567-569"

- id: saturn_house_8
  planet: Saturn
  house: 8
  summary: >
    Saturn in House 8 is Saturn's headquarters — neither the Saturn-items
    themselves nor Saturn are inherently poor here; Mercury and Rahu-Ketu
    determine its actual conduct.
  severity: mixed
  benefit_effects:
    - condition: "General placement"
      effect: "Proud, self-conceited; effects 'doubtful' overall — a dead snake or thief still causes fear; treats himself as he treats others."
    - condition: "Saturn relies on Rahu and Ketu as agents"
      effect: "Mercury and Rahu-Ketu determine its conduct; generally acts like Mars in the chart."
    - condition: "Keeping a square piece of silver with oneself"
      effect: "Reveals Saturn's results when Saturn is alone/malefic."
  malefic_effects:
    - condition: "Drinking"
      effect: "Increases Saturn's poison — give it up to reduce it."
    - condition: "More planets alongside Saturn in House 8"
      effect: "More deaths."
    - condition: "Sun, Moon, Mars in Houses 8, 9 (enemies)"
      effect: "Numerous deaths; damaged eyesight in old age."
    - condition: "House 12 blank"
      effect: "Lifelong misery and poverty; relatives suffer too."
  remedy: >
    Keep a square piece of silver (Moon remedy). Bathe in milk while
    sitting on a stone, feet not touching earth directly. Draw a
    Rahu-Ketu-Saturn "snake" diagram to trace where Saturn's effect
    flows. Flow 8kg of Urad or 8 almonds in running water (up to age
    39). Sprinkle unboiled milk on the floor.
  source: "Goswami 1952, 'Saturn in House No. 8', pp. 569-570"

- id: saturn_house_9
  planet: Saturn
  house: 9
  summary: >
    Saturn in House 9 is "God's own pen" — a poor man wakes to find
    himself rich, with no thefts ever; excellent for 60 years, though
    scared of Mercury.
  severity: positive
  benefit_effects:
    - condition: "General placement"
      effect: "Intelligent, blessed with 3 houses (the 3rd signals life's end); generous, learned, charitable, gains through journeys."
    - condition: "Charitable conduct"
      effect: "Large rich family, comfortable life, prosperity for 60 years; Jupiter's treatment helps if trouble follows father's death."
    - condition: "Venus wherever it is"
      effect: "Excellent results, as of Venus in House 2 (Moon becomes malefic though)."
    - condition: "Venus in House 2"
      effect: "Saturn 9x excellent (Moon malefic)."
    - condition: "Mercury in House 6 or Venus in House 7"
      effect: "Saturn, Mercury, Venus all excellent; good results for comforting others; wife from a rich family."
    - condition: "Sun, Mars, Moon in House 3, Jupiter in House 5"
      effect: "Saturn not malefic; no death/untoward event in the family (unless a south-facing skylight is created in the last dark room, ruining things within 3 years)."
    - condition: "Jupiter in House 5"
      effect: "Good progeny condition."
    - condition: "Moon in House 4"
      effect: "Gains through parents; auspicious, rich wife."
    - condition: "Sun in House 5"
      effect: "Help from others and parents; no Sun-Saturn conflict."
    - condition: "Jupiter in House 2"
      effect: "Abundant wealth, though he won't care for it."
    - condition: "Ketu in House 5"
      effect: "Large family."
  malefic_effects:
    - condition: "General placement"
      effect: "Won't let even a poor man rest overnight for fear of theft."
    - condition: "House made/purchased during his conception"
      effect: "Destroys father by his age 36; slow, steady court progress; wooden items bring hard luck (Jupiter's treatment helps)."
    - condition: "Mars in House 4"
      effect: "Saturn highly malefic, like a plague-carrying rat; profits from selling others' coffins."
    - condition: "House 2 blank"
      effect: "Wealthy but cruel and licentious."
    - condition: "Rahu/Ketu linked (aspect or conjoined)"
      effect: "Saturn like a rolling stone without a base; turns riches to poverty; delays children's births; vindictive nature passed to children; fireworks/Saturn-items cause loss (Jupiter/Moon items help)."
  remedy: null
  source: "Goswami 1952, 'Saturn in House No. 9', pp. 570-572"

- id: saturn_house_10
  planet: Saturn
  house: 10
  summary: >
    Saturn in House 10 ("plain writing paper") is generally extremely
    benefic — company or aspect of enemies is what turns it malefic; as
    one respects others, one progresses steadily.
  severity: positive
  benefit_effects:
    - condition: "Helpful planets in House 1"
      effect: "Saturn in House 10 doubly benefic (otherwise doubly malefic)."
    - condition: "Every 7th year"
      effect: "Lucky — blessed with wealth and respect; Saturn and Jupiter both benefic."
    - condition: "Saturn alone in House 10"
      effect: "Rises to dizzy heights every third year; controls all planets toward benefic results."
    - condition: "General placement"
      effect: "Wealthy, respected, Kingly, conveyance/properties of all kinds (may turn poor in old age if too gentle-natured); stationary work helps, outdoor life is extremely malefic."
    - condition: "Long life to father"
      effect: "Stays with father at ages 39/48; own age 90; respected everywhere; House 11 reveals his nature."
    - condition: "Avoiding drink"
      effect: "Lucky, intelligent, respected; if the house isn't built by age 48, Saturn keeps paying its equivalent value until construction begins."
    - condition: "Mercury in House 7 (transit)"
      effect: "Gain to in-laws, shared with the native."
    - condition: "Moon in House 1 and Jupiter in House 4"
      effect: "All-round comforts and conveyance."
    - condition: "House 2 blank"
      effect: "Saturn like a 'sleeping snake' but good."
  malefic_effects:
    - condition: "Sun, Mars or Moon with Saturn"
      effect: "All planets become 'blind', making Saturn malefic."
    - condition: "Sun, Moon, Mars poor in House 4"
      effect: "Ill repute; a 'killer' till age 27; poor wealth effect (Jupiter's help needed)."
  remedy: null
  source: "Goswami 1952, 'Saturn in House No. 10', pp. 573-574"

- id: saturn_house_11
  planet: Saturn
  house: 11
  summary: >
    Saturn in House 11 "writes his own fate like God himself" —
    religious and careful of gossip, steering clear of evil; Rahu and
    Ketu's conduct is decided here.
  severity: mixed
  benefit_effects:
    - condition: "General placement"
      effect: "Rich, though earns by unfair means; the 40th year decides fate (benefic → soil turns to gold, else vice versa)."
    - condition: "Saturn provides a son"
      effect: "Even without support from other placements; protects fortune and clears Rahu/Ketu's evil effects; religious bent of mind, may inherit wealth though not own much property."
    - condition: "Jupiter with/adjoining Saturn, Mercury not in House 3"
      effect: "Saturn swears by Jupiter, exalting benefic planets."
    - condition: "Rahu and Ketu with Moon, or in Houses 4-10"
      effect: "Saturn 'religious'; when it reaches House 1 (ages 11,23,36,40,37,72,84,94,105,119) it gives benefic results, helpful till age 84 with Jupiter."
    - condition: "Sun, Mars in House 10, Moon in House 6 (or Sun in House 1, Moon in House 2)"
      effect: "Bestows royalty, excellent wealth; Rahu/Ketu extremely useful."
    - condition: "Venus in House 7"
      effect: "Comfortable himself, capable of comforting others."
    - condition: "Mercury not in House 3"
      effect: "Saturn swears by Jupiter, enhancing all planets' benefic effect."
  malefic_effects:
    - condition: "Alcohol consumption"
      effect: "Reduces Saturn's benefic effects; a house built too early (before 36/39) leaves the owner sick, dying with family responsibilities in the lurch (best built at 54-55 instead)."
    - condition: "South-facing door"
      effect: "Damages wealth; rumours signal Saturn's negative effects."
    - condition: "Mercury-linked items (daughter, sister) malefic"
      effect: "Ill-gotten wealth brings death; changing the house door's direction brings misfortune."
    - condition: "Mercury in House 3 and Jupiter in House 9"
      effect: "Mercury, Jupiter and Saturn all become ineffective and malefic together."
    - condition: "Mercury afflicted"
      effect: "Saturn becomes useless."
    - condition: "Saturn malefic"
      effect: "Keep away from a sick wife for at least a year, or her disease worsens for 3 years."
  remedy: >
    Keep a pitcher full of water when performing auspicious work.
    Take help of Mars for Rahu/Ketu-caused problems, or Jupiter if Jupiter
    is weak or no elder male is alive. Throw fluid items (mustard oil,
    liquor, spirit) onto earth at sunrise; offer liquor at a Bhairon
    temple, or give it to 11 beggars/labourers.
  source: "Goswami 1952, 'Saturn in House No. 11', pp. 575-577"

- id: saturn_house_12
  planet: Saturn
  house: 12
  summary: >
    Saturn in House 12 ("pen of God, comfort") means a poisonous snake
    itself is helpful here — no enemy survives its aid; excellent as long
    as the native isn't a liar, drunkard, or glutton.
  severity: positive
  benefit_effects:
    - condition: "General placement"
      effect: "Conquers all enemies, bold excellent life, no untimely death; even going bald brings riches and comfort."
    - condition: "Rahu and Ketu present"
      effect: "Don't give malefic results; Mercury's mischief stays under control."
    - condition: "General placement (building)"
      effect: "Builds many houses every 6th/12th year; Saturn protects, even 'gives life to the dead'; snakes never bite, only protect."
    - condition: "Business/family placement"
      effect: "Full of prosperity; may become a millionaire, though given to cheating/fraud."
    - condition: "Sun, Mars, Moon absent from House 2 (enemies)"
      effect: "Full comfortable nights; prophetic powers."
    - condition: "Rahu-Ketu in Houses 3, 6; Ketu in Houses 9, 12; Mars in Houses 6-12"
      effect: "Excellent Fish Line results, as long as the last room of the house stays dark."
    - condition: "Rahu in House 12"
      effect: "Saturn gives excellent help."
  malefic_effects:
    - condition: "Liar, licentious, slimy, overly clever"
      effect: "Saturn's help no longer available; loose talk causes trouble."
    - condition: "Wife's sickness following the native's ill health"
      effect: "Indicates malefic Saturn."
    - condition: "Sun in House 6"
      effect: "Loss of wives, especially if the rear wall of the house is demolished."
    - condition: "Moon and Rahu in House 12"
      effect: "Dormant Moon."
    - condition: "Malefic Mercury"
      effect: "Suffering from Mercury-linked traits; if linked with Sun, acute anger and royal-affairs conflict."
  remedy: "Keep almonds in the south-eastern direction of a dark room."
  source: "Goswami 1952, 'Saturn in House No. 12', pp. 578-579"

- id: rahu_house_1
  planet: Rahu
  house: 1
  summary: >
    Rahu in House 1 is "an elephant riding steps" — an indicator of
    wealth, but eclipses whatever house Sun occupies; the throne starts
    shaking, mental peace and losses follow.
  severity: caution
  benefit_effects:
    - condition: "General placement"
      effect: "Prosperous, spends on good things; Sun/Moon aren't fully poisoned during eclipses — only partial darkness, and Sun resumes benefic effects afterward."
    - condition: "Houses 1-6 under Mercury's influence (Rahu's 'trunk'), Houses 7-12 under Ketu's ('body')"
      effect: "Effects follow Mercury's/Ketu's own position and strength respectively."
    - condition: "Placenta-cloth ritual, or alms of Sun-items"
      effect: "Gives excellent results."
    - condition: "Venus in House 7"
      effect: "Rich, though wife's health stays poor and doubtful."
    - condition: "Mars in House 12"
      effect: "Rahu silent — neither malefic nor benefic."
    - condition: "Sun in House 5 (of the Sun-house-by-house table)"
      effect: "Sun helps Rahu; a child arrives even amid difficulty."
  malefic_effects:
    - condition: "General placement (per house Sun occupies)"
      effect: >
        Table of effects by Sun's house: House 1 doubts/office mischief;
        2 irreligious, disrespectful to in-laws; 3 discomfort to
        siblings; 4 obstructs mother/earnings; 6 disgrace via children;
        7 losses in court/household; 8 losing investments; 9 destroys
        forefathers' religious wealth; 10 unreliable conduct; 11
        disrepute even to the just; 12 night-time disrepute/conflict.
    - condition: "Ill-timed storm at birth, or born opposite a desolate/issueless household"
      effect: "Malefic Rahu effects on related items till age 42."
    - condition: "General mischief"
      effect: "'Bitter smoke' — mischievous nature, theft in official position."
    - condition: "Rahu's age periods (11, 21, 42)"
      effect: "Hardship and losses to father."
    - condition: "Career pattern"
      effect: "Frequent transfers but infrequent promotions."
    - condition: "Sun's house (general, excepting Sun-Mercury in House 3)"
      effect: "That house gets eclipsed, not Sun itself; unnecessary obstructions; feels lack even amid plenty; malefic till age 42, nobody comes to help."
    - condition: "Receiving Saturn/Rahu (electric) items after marriage (dowry before marriage is fine)"
      effect: "Hardship in official position, like a solar eclipse."
    - condition: "Sun in House 9"
      effect: "Loss of religiosity and honour (Moon's help needed)."
  remedy: >
    Take Sun-item help (rear a monkey); take Moon's help during solar
    (Sun-Rahu) or lunar (Moon-Ketu) eclipse periods.
  source: "Goswami 1952, 'Rahu in House No. 1', pp. 586-588"

- id: rahu_house_2
  planet: Rahu
  house: 2
  summary: >
    Rahu in House 2 sits "under control of Jupiter" — the wheel of
    destiny turns between Houses 2 and 8, giving both gold and soil; a
    long life as a King or in a King's company is possible.
  severity: mixed
  benefit_effects:
    - condition: "Saturn benefic or transiting to House 1 with Jupiter also benefic"
      effect: "Real 'rain of wealth' falls."
    - condition: "Saturn benefic/in House 1, Jupiter exalted"
      effect: "Excellent results, plenty of wealth (malefic Saturn instead makes the smoke 'bitter and suffocating')."
    - condition: "General placement (real seat of Rahu, ruled by Jupiter)"
      effect: "Wealthy, charitable, generous; contented King's temperament; changeable luck but good health/long life; 25 years of wealth (Venus period)."
    - condition: "Not accepting donations"
      effect: "Avoids being accused of theft; may lose a kingdom but won't be imprisoned."
  malefic_effects:
    - condition: "New kitchen built (ages 10.5, 21, 42) in NW/East direction of the ancestral house"
      effect: "Destroys the native, ancestors and in-laws; particularly bad ages 36-42; seesaw fortunes, theft loss, imprisonment/deception risk."
    - condition: "General placement"
      effect: "May eat free food all his life without himself being charitable."
    - condition: "Saturn malefic"
      effect: "Misfortune all round; unhappy, troubled life."
    - condition: "General (funeral space)"
      effect: "May starve for funeral space; may commit temple thefts; Ketu in House 8 stays benefic till age 25, then both Rahu and Ketu turn malefic at 26."
  remedy: >
    Keep a solid ball of silver or gold, saffron; keep Moon-items in the
    NW direction of the house; mother's (Moon's) blessings help.
  source: "Goswami 1952, 'Rahu in House No. 2', pp. 589-591"

- id: rahu_house_3
  planet: Rahu
  house: 3
  summary: >
    Rahu in House 3 gives lifelong wealth — "an armed sentry" — wise
    enemies cause less harm than foolish friends; premonitions arrive two
    years in advance through dreams.
  severity: mixed
  benefit_effects:
    - condition: "Rahu alone"
      effect: "Highly wealthy, long life, bold, fearless, causes little damage to enemies."
    - condition: "General placement (premonition)"
      effect: "Untangles the 'knots of Trinity'; never without issue; Sun twice benefic; long life and promotions; leaves behind much property."
    - condition: "Mars in House 3"
      effect: "Kingly status in life."
    - condition: "Sun, Venus and Mars conjoin/adjoin Rahu"
      effect: "All-round happiness, wealth, comfort; enemies can't pollute Rahu; comforts of women."
  malefic_effects:
    - condition: "Brothers/relations generally"
      effect: "Become a source of wealth loss — deny debts or cheat (Moon's treatment helps)."
    - condition: "A planet in House 3 or 12 other than Mars in House 3"
      effect: "Mercury and Ketu stay malefic till age 34."
    - condition: "Sun, Mercury in House 3"
      effect: "Sister may become widow/unhappy between ages 21 (Sun) and 34/36 (Mercury), though the native himself stays happy, comfortable, honoured by government; avoid keeping ivory pieces at home."
  remedy: "Do not keep pieces of ivory at home."
  source: "Goswami 1952, 'Rahu in House No. 3', pp. 591-592"

- id: rahu_house_4
  planet: Rahu
  house: 4
  summary: >
    Rahu in House 4 is religious but brings a shortage of wealth — a bath
    in the Ganges is auspicious, but a bath in one's own house becomes
    just as good here.
  severity: mixed
  benefit_effects:
    - condition: "Rahu alone, or with Saturn and Ketu not siding with Moon"
      effect: "They give their own results — Rahu figuratively 'sits with folded hands at mother's feet' and swears off evil; bathing at home becomes like bathing in the Ganges."
    - condition: "Moon in House 1 or exalted"
      effect: "Large wealth; items from the Moon's house bring prosperity, flowing to the Mercury house."
    - condition: "Moon in House 1, Mercury in House 10"
      effect: "Full earnings from the royal court, filling relatives' coffers too."
    - condition: "Venus benefic"
      effect: "In-laws gain wealth from the wedding date; native gets his share too."
    - condition: "Sun or Mars (or both) in House 2"
      effect: "Rahu benefic; Sun and Mars helpful."
    - condition: "Ketu exalted"
      effect: "Gains from a son's birth, or during years 12, 24, 48."
  malefic_effects:
    - condition: "Inanimate Moon-articles (silver, rice, milk, pearl)"
      effect: "Cause loss from age 24-48, though the native stays religious and intelligent; Rahu and Ketu both turn beneficial from age 45; maternal uncle stays ruined till Moon's ages (6,12,24)."
    - condition: "Moon not benefic"
      effect: "Not favourable for wealth."
    - condition: "Moon or male planets (Sun, Mars, Jupiter) in House 10, Moon in House 4"
      effect: "All planets adversely affected till age 24; afterward a 'rainfall of wealth' recovers all losses."
  remedy: >
    If the roof is damaged, mix old roofing material with new when
    repairing, or replace both roof and walls together.
  source: "Goswami 1952, 'Rahu in House No. 4', pp. 592-594"

- id: rahu_house_5
  planet: Rahu
  house: 5
  summary: >
    Rahu in House 5 is mischievous and damages children, yet exalts the
    Sun — becoming a coward on a happy day creates conditions for
    childlessness.
  severity: caution
  benefit_effects:
    - condition: "Moon in House 5, or Sun in Houses 1,5,11"
      effect: "Rahu helps Moon and Sun; deeply religious with high intuition; may face obstructions to riches/male child, but if mother is alive gives a 'Fish Line' of prosperity."
    - condition: "Sun, Moon, Mars in Houses 4, 6, or Saturn/Mars in House 5"
      effect: "Number of children, long life, luck; lucky brothers (though fewer in number)."
  malefic_effects:
    - condition: "General ill health"
      effect: "Medical expenses."
    - condition: "Not celebrating children's birthdays (or celebrating in daytime instead of night)"
      effect: "Keeps the number of children small."
    - condition: "General delay"
      effect: "Male offspring delayed; children may die at conception or after birth; poor health till age 12; if first son born at 21, second at 42 — after the second, father-in-law or father dies."
    - condition: "Rahu malefic"
      effect: "Saturn also turns malefic, risking childlessness; first marriage may not yield a male child (remarrying the same wife removes Rahu's poison)."
    - condition: "Jupiter with or aspecting Rahu"
      effect: "Child's health poor till 12; native and father have ill luck lifelong."
  remedy: >
    Marry the same spouse twice. Put a silver piece in all four corners
    of the house before entering. Keep a cow or small silver elephant at
    home. Avoid Saturn-linked misdeeds (liquor, womanising, meat).
  source: "Goswami 1952, 'Rahu in House No. 5', pp. 594-595"

- id: rahu_house_6
  planet: Rahu
  house: 6
  summary: >
    Rahu in House 6 is "a helpful elephant who even saves one from
    hanging" — destroys enemies and carries high intellect, though
    killing brothers (metaphorically or literally) damages one's own
    progeny.
  severity: mixed
  benefit_effects:
    - condition: "General placement"
      effect: "Comfortable life, fond of good dresses."
    - condition: "Rahu alone in House 6"
      effect: "Helpful to others, intelligent, victorious over enemies; many promotions, few transfers; proud, self-conceited; power to acquit the condemned and punish thieves — like Saturn in House 12."
    - condition: "Keeping a jet-black dog, or a small round ball of lead/black glass"
      effect: "Favourable; installing black glass at office/home helps."
  malefic_effects:
    - condition: "Poor relations with brothers"
      effect: "Becomes unlucky — 'an elephant which destroys its own army'; a renowned thief."
    - condition: "Mercury or Ketu malefic"
      effect: "Disrespect, irreligious; in-laws' luck fluctuates, often unlucky; Houses 2 and 7 results malefic."
    - condition: "Mars in House 12"
      effect: "Persistent undiagnosed diseases; recurring financial losses."
    - condition: "Sun in House 2 and Mercury in House 12"
      effect: "Loss and misfortune if quarreling with elder siblings."
  remedy: null
  source: "Goswami 1952, 'Rahu in House No. 6', pp. 596-597"

- id: rahu_house_7
  planet: Rahu
  house: 7
  summary: >
    Rahu in House 7 is "devil, destroyer of wealth" — indiscriminate
    sexual indulgence and wild thoughts damage the marriage, though
    Saturn protects wealth.
  severity: caution
  benefit_effects:
    - condition: "General placement"
      effect: "Wealthy though married life is disturbed; man of power/authority/rank; Sun always benefic; Mercury and Saturn benefic and helpful; respect and gains from government; enemies destroyed."
    - condition: "Mercury and Venus in Houses 2, 11"
      effect: "Good luck — Fish Line of prosperity."
  malefic_effects:
    - condition: "Female marrying at or before 21"
      effect: "Damaging — divorce, separation, native's death, or widowhood; disturbed married life; ill fame."
    - condition: "Male marrying at or before 21"
      effect: "Same pattern of damage; very sexy, licentious habits; loss through speculation/friends; disturbed marriage."
    - condition: "Marriage before/at 21 (general)"
      effect: "Very unlucky; Rahu, Venus and Mercury all turn malefic."
    - condition: "Adopting a Rahu-profession (electricity, jails, police)"
      effect: "Fortune stays uncertain."
    - condition: "Marriage timing"
      effect: "Parents of the bride should gift a solid silver piece (kept, not sold) to ward off the above evils; Saturn's remedy (throw a coconut in running water) helps, though keeping a dog here causes ruin."
    - condition: "Rahu transits House 7 (annual chart)"
      effect: "Extra caution needed; seal a silver piece in a water pot; keep the water topped up."
    - condition: "Mercury, Saturn or Ketu in House 11"
      effect: "That planet's traits become the cause of loss/ruin."
    - condition: "Saturn or Mars, or Saturn-Mars, in House 5"
      effect: "Second male child born in the native's 42nd year."
  remedy: >
    Marry after age 21. Gift/keep a solid silver piece from in-laws.
    Throw a coconut in running water (Saturn's remedy). Seal silver in a
    water pot during Rahu's House 7 transit; donate Ganges-water silver
    pots in a temple if married before 21.
  source: "Goswami 1952, 'Rahu in House No. 7', pp. 597-599"

- id: rahu_house_8
  planet: Rahu
  house: 8
  summary: >
    Rahu in House 8 is "trumpet of departure, death lord, messenger of
    bitter dark smoke" — no appeal against its death warrant; arrogance
    costs the native his friends.
  severity: caution
  benefit_effects:
    - condition: "Mars in House 12"
      effect: "A benefic Rahu."
    - condition: "Mars, Saturn in Houses 1, 8"
      effect: "Lucky in the 28th year; Mars or Saturn yields wealth and revives fate, making up for all losses."
    - condition: "Keeping a rectangular piece of silver for 40-43 days"
      effect: "Helps balance the ups and downs of life; Rahu also gives Rahu-in-House-2 effects."
    - condition: "Eldest family member is black-complexioned, one-eyed, or childless (Rahu traits)"
      effect: "Rahu will not be malefic."
  malefic_effects:
    - condition: "General placement"
      effect: "Outwardly innocent/religious but bad, licentious actions; dishonestly earned wealth highly damaging; disrespect and ill fame; changeable luck."
    - condition: "Changing the house's foundation/root"
      effect: "Moon turns against Rahu, which then turns against Saturn even if exalted — litigation, unwanted expenditure, quarrels, arrogance-driven misfortune, especially when Rahu-Ketu-Saturn align and poison Moon."
    - condition: "Rahu transits House 8"
      effect: "Very malefic — losses, humiliation, hard luck across the board."
    - condition: "Mars, Mercury malefic anywhere (except Mars in House 12)"
      effect: "Unlucky period, especially age 21, if adopting professions ruled by Rahu's enemies (marriage/Venus at 21, electric service/Sun, forestry/Mars) or dishonest means."
    - condition: "Saturn in House 2 or 3"
      effect: "Uncle suffers loss of wealth/children in years 9-11, especially if he buys Rahu-items."
    - condition: "Saturn in House 6 and Rahu in House 8"
      effect: "Very malefic combination — may indicate death by imprisonment, life sentence, or hanging."
  remedy: >
    Take almonds daily into a temple and bring half back, from the 8th
    month after the birthday until the next. Throw 8 pieces of lead or
    soundless false coins in running water daily for 43 days. Putting
    copper coins in a furnace also helps.
  source: "Goswami 1952, 'Rahu in House No. 8', pp. 599-601"

- id: rahu_house_9
  planet: Rahu
  house: 9
  summary: >
    Rahu in House 9 is "a doctor of mental diseases, lunatic, but
    dishonest" — an elephant on a rampage destroying the native's and
    children's fate; can also make the native a psychiatrist.
  severity: caution
  benefit_effects:
    - condition: "Jupiter in Houses 5, 11"
      effect: "Renowned doctor of mental diseases (greed spoils this power)."
  malefic_effects:
    - condition: "General expenditure pattern"
      effect: "Extra unwanted spending on Sadhus etc."
    - condition: "General progeny pattern"
      effect: "Male child aborted or dies repeatedly after birth; father/in-laws/grandfather unlucky; litigation with blood relations risks childlessness; Rahu 9x malefic, obliterating Moon; Houses 5 and 11 (progeny, income) also affected."
    - condition: "House-4 planet transits House 1 (ages 6,16,28,40,52,64,76,88,100,114)"
      effect: "Malefic Rahu effects on its articles/professions/relations; conflict with relations, sickness to children, black-dog loss, dark-complexioned relative's death."
    - condition: "House 1 blank"
      effect: "Diseased and disrespected; worries from elders."
    - condition: "Saturn in House 5"
      effect: "Malefic combination for progeny; Saturn's malefic effect on House 5 prevails."
  remedy: >
    Remedy of Ketu. Live in a joint family, keep good relations with
    in-laws. Propitiate Jupiter and malefic Mars. Keep a dog (even if it
    keeps dying, it saves progeny).
  source: "Goswami 1952, 'Rahu in House No. 9', pp. 601-602"

- id: rahu_house_10
  planet: Rahu
  house: 10
  summary: >
    Rahu in House 10 is "jewel of the snake" — both harmful and helpful;
    twice benefic when paired with a benefic Saturn, but shortens life
    when Saturn is malefic.
  severity: mixed
  benefit_effects:
    - condition: "General placement"
      effect: "Wealthy, respected, kind; benefic to father (Rahu itself stays doubtful)."
    - condition: "Saturn benefic"
      effect: "Rahu benefic for wealth; bold, good businessman, long life."
    - condition: "Saturn benefic (facing friend troubles)"
      effect: "Victorious despite danger through friends; doubly benefic for wealth and power."
    - condition: "Mars benefic"
      effect: "Rahu becomes ineffective (neutral)."
  malefic_effects:
    - condition: "Saturn malefic"
      effect: "Native's and mother's health afflicted (father stays healthy and long-lived); loss of eyesight and longevity; gold turns to iron; destroys ancestral property."
    - condition: "Miserly, narrow-minded conduct"
      effect: "Causes enmity; Rahu malefic for finances."
    - condition: "Mars malefic"
      effect: "Poor, troubled life."
    - condition: "Sun, Venus and Mars conjoin with Rahu in House 10 ('blind chart')"
      effect: "Rahu gives malefic results; fear of enemies; self-destructive."
    - condition: "Moon in House 4"
      effect: "Worried, afflicted eyesight, loss of wealth (Mars's remedy helps)."
    - condition: "Rahu alone, Mars not conjoined, native goes bareheaded"
      effect: "Loss of wealth."
  remedy: null
  source: "Goswami 1952, 'Rahu in House No. 10', pp. 602-603"

- id: rahu_house_11
  planet: Rahu
  house: 11
  summary: >
    Rahu in House 11 is "plague — destroys other planets and father" —
    an ill-reputed person who sells others' wealth; as a son is born, the
    father may expire.
  severity: caution
  benefit_effects:
    - condition: "Father alive"
      effect: "While he lives, the native is blessed with wealth; after his death, keeping Jupiter-items (gold, yellow articles) benefits the native."
    - condition: "Saturn in Houses 3, 5"
      effect: "Makes a Yogi; Rahu not malefic for father."
    - condition: "Saturn and Ketu in Houses 1, 3"
      effect: "Becomes lucky, self-made rich; doesn't need help/wealth from mother or father."
  malefic_effects:
    - condition: "General placement (parents' wealth)"
      effect: "Parents may start well-off, but after his birth: wealth loss, fire, unwanted expenditure, fines, disease, strained relations with superiors."
    - condition: "House 2 aspected/connected with Rahu"
      effect: "Heavy suffering till age 36; troubles and distress all around."
    - condition: "General (father's fate)"
      effect: "Father disrespected; dies at the native's birth, or in an accident during pregnancy; often ruined in the 11th month/year or 21st year; fire loss, unrealised debts, theft, natural calamities."
    - condition: "General (savings)"
      effect: "No gain from father's/father-in-law's/maternal grandfather's wealth; troubled life; savings determined by the House-3 planet; Rahu highly unpredictable."
    - condition: "General summary rule"
      effect: "Father/son or grandfather/grandson cannot both live long — one side suffers even if their own planets are fine, since the native absorbs it instead."
    - condition: "Mars in House 3"
      effect: "Unlucky brother; father's elder brother becomes lame or devoid of progeny."
    - condition: "Ketu in House 5"
      effect: "Loss of three male children, though 3 sons survive up to age 36; ear/leg/spine/urinary/private-parts/knee troubles; maternal uncle's family suffers via Ketu's professions."
  remedy: >
    Pray and donate at a temple; don't wear blue. Remedy of Jupiter;
    wear gold (avoid Rahu-items like blue clothes, electric goods, blue
    sapphire). Donate to a (non-domestic) sweeper. Throw 4kg lead and 4
    coconuts in water. Don't keep a chimney in the kitchen or light
    smoky fires. Use an iron ring instead of gold if Jupiter also
    conjoins Rahu in House 11 or sits in House 3. Use silver drinking
    utensils.
  source: "Goswami 1952, 'Rahu in House No. 11', pp. 603-605"

- id: rahu_house_12
  planet: Rahu
  house: 12
  summary: >
    Rahu in House 12 is a "loose talker, making tall claims,
    self-conceited" — false hopes and dreams get upturned; heavy but
    good-cause expenses follow.
  severity: mixed
  benefit_effects:
    - condition: "General placement (per Mercury's chart condition)"
      effect: "Rahu's results follow Mercury's."
    - condition: "General placement (houses/walls)"
      effect: "Benefic results relate to houses and walls; auspicious expenses for family, especially sisters/daughters; comfortable nights; rich in-laws; protection from enemies."
    - condition: "Rahu with Mars"
      effect: "Excellent gains, comforts, royal favours."
    - condition: "Saturn benefic"
      effect: "Royal favours and recognition."
    - condition: "Venus in Houses 10-11"
      effect: "More daughters, more wealth; Mercury determines daughter count, Jupiter determines wealth."
  malefic_effects:
    - condition: "Inverse sneeze while starting good work"
      effect: "Bad results — conflict, litigation, theft, defalcation."
    - condition: "General family expenses"
      effect: "Heavy expenses."
    - condition: "General placement (earthquake/roof)"
      effect: "Native and protective roof threatened; wishes/dreams remain unfulfilled; hard work unrewarded; nighttime discomfort, depression, choking."
    - condition: "Stubborn attitude/renunciation"
      effect: "Unpropitious; mental exhaustion; possible loss of eyesight from excessive renunciation, though body stays otherwise healthy."
    - condition: "General reputation"
      effect: "False allegations, disrepute."
    - condition: "Sun, Venus (enemy planets) with Rahu"
      effect: "Terrible losses nearing destruction."
  remedy: >
    Establish Mars-items (sugar, aniseed) by the bedside. Eat food in the
    kitchen. Keep a 60g silver elephant at home.
  source: "Goswami 1952, 'Rahu in House No. 12', pp. 606-607"

- id: ketu_house_1
  planet: Ketu
  house: 1
  summary: >
    Ketu in House 1 keeps the native always keen to procreate, worried
    for children of the whole world — planned journeys tend to abort at
    the last moment.
  severity: mixed
  benefit_effects:
    - condition: "Mars in House 12"
      effect: "A benefic Ketu."
    - condition: "Sun in House 6 or 7"
      effect: "Benefic Sun; birth of a male child, though he shouldn't eat Sun-items early morning/evening or buy food at those times."
    - condition: "Ketu transits House 1 (annual chart)"
      effect: "Blessed with a son, or a grandson through daughter/brother."
    - condition: "General placement (Jupiter/father)"
      effect: "Jupiter also benefic; helpful to his father; respectful to his preacher; religious."
  malefic_effects:
    - condition: "General placement"
      effect: "Highly apprehensive nature; worried for children, sexy, licentious; wealth growth increases libido too."
    - condition: "Ketu unfavourable after marriage"
      effect: "Otherwise very malefic, may cause father's death; birth likely away from the ancestral place, bringing ruin there and to the neighbourhood (Saturn's remedy helps)."
    - condition: "Houses 2 and 7 blank"
      effect: "Mercury and Venus both malefic."
    - condition: "Sun in House 7"
      effect: "Unlucky health period, especially at a grandchild's birth."
  remedy: "Service to three worldly dogs helps, as does serving one's father. Remedy of Saturn if unfavourable after marriage."
  source: "Goswami 1952, 'Ketu in House No. 1', pp. 614-615"

- id: ketu_house_2
  planet: Ketu
  house: 2
  summary: >
    Ketu in House 2 gives a rich ruler-traveller — a child is born only
    in youth, not old age; frequent travels and royalty follow, but
    wealth doesn't accumulate.
  severity: mixed
  benefit_effects:
    - condition: "House 8 blank, Ketu alone in House 2"
      effect: "Benefic Ketu — frequent travels, promotions, comfortable life, man of power/authority; a forehead Tilak (or Ketu sign/triangle) helps."
    - condition: "Journeys tied to transfer/new business"
      effect: "Benefic land travel, promotions."
    - condition: "Venus generally"
      effect: "Always benefic (Moon may not be favourable)."
    - condition: "General placement"
      effect: "Honour, rank, power, authority, wealthy — though without accumulation; Jupiter determines wealth, Venus determines family life."
    - condition: "Sun in House 12"
      effect: "Earns after age 24; prosperous, comfortable life."
  malefic_effects:
    - condition: "Moon, Mars or Venus in House 8 (enemies)"
      effect: "Loss and unhappiness at age 16 or 22; short age indicated."
    - condition: "General placement (children)"
      effect: "However many children produced, none help in old age."
  remedy: "A Tilak or triangle sign of Ketu on the forehead."
  source: "Goswami 1952, 'Ketu in House No. 2', pp. 615-616"

- id: ketu_house_3
  planet: Ketu
  house: 3
  summary: >
    Ketu in House 3 is "a barking dog, but a pious person" — the blood of
    brothers never satisfies one's thirst; a sword around the neck
    always cuts the native.
  severity: mixed
  benefit_effects:
    - condition: "Mars in House 12"
      effect: "Long life and good finances from age 23, or from a first son's birth, especially with an elder grey-haired relative in the family."
    - condition: "General placement"
      effect: "Good children; can judge others' nobility; benefits flow at 24 or at a son's birth."
  malefic_effects:
    - condition: "General placement"
      effect: "Endorses others uncritically; nagging but noble; troubles from brothers, journeys, wealth/longevity loss; strained relations with wife/sisters-in-law; younger brother troubled too."
    - condition: "Moon or Mars (or both) in House 8, with a south-facing door"
      effect: "Residing 3 years in such a house risks progeny suffering/dying after the third year; malefic effects continue till age 24."
    - condition: "Mars or Moon in House 3 or 4"
      effect: "The native stays poor."
  remedy: >
    Throw Jupiter-items in running water, or apply saffron Tilak
    (for lung/health trouble). Wear gold on the body (financial
    success). Throw combined Sun-Moon items in running water
    (journey losses). Make up your own mind rather than following
    others' advice.
  source: "Goswami 1952, 'Ketu in House No. 3', pp. 616-618"

- id: ketu_house_4
  planet: Ketu
  house: 4
  summary: >
    Ketu in House 4 is "a dog that scares children, causes tides/storms
    at sea" — travels may be fruitful but delayed; wealth, age, mother
    and sea travel fare excellently.
  severity: mixed
  benefit_effects:
    - condition: "General placement"
      effect: "Lucky and favourable for father; exalts Jupiter's power; male child delayed but lives long with the family priest's blessing; long life and good wealth; studious, intelligent, God-fearing."
    - condition: "Mars/Moon absent from Houses 3 or 4"
      effect: "More daughters; native intelligent and wealthy."
  malefic_effects:
    - condition: "General placement"
      effect: "Poor health, diabetic tendencies; mother and children suffer; sons born late (36-48) even with the family priest's blessing; animal-like temper; progeny shortage."
    - condition: "Moon or Mars in House 3 or 4"
      effect: "Both Ketu and Moon malefic; mother unhappy; progeny may be denied."
  remedy: "Donate gold or yellow items in a temple or to the family priest, for children and wealth."
  source: "Goswami 1952, 'Ketu in House No. 4', p. 618"

- id: ketu_house_5
  planet: Ketu
  house: 5
  summary: >
    Ketu in House 5 lives "under Jupiter's patronage for its livelihood"
    — Ketu behaves as Jupiter does in the chart, excellent by itself and
    benefic after age 24.
  severity: mixed
  benefit_effects:
    - condition: "Good character in youth"
      effect: "Blessed with sons and grandsons; Ketu very benefic; longevity/children count follows Jupiter's position."
    - condition: "Jupiter, Sun or Moon in Houses 4, 6, 12"
      effect: "At least five sons, good finances, benefic Ketu."
    - condition: "Saturn in House 9 and Venus in House 4"
      effect: "Saturn benefic for children and domestic life — Fish Line."
  malefic_effects:
    - condition: "Jupiter malefic"
      effect: "Loss of handsomeness; malefic for children/self till age 45; may be denied a living male child."
    - condition: "Mercury, Venus, Rahu or Saturn in Houses 2,5,9,12 (Father's Debt / Rin)"
      effect: "Ketu malefic for domestic life, though two sons survive and do well; donation of Moon/Mars items helps."
    - condition: "Moon or Mars in House 3 or 4"
      effect: "Malefic Ketu; poor and troubled; donation of Mars-articles helps; children's condition follows the native's own character."
    - condition: "Saturn in House 5 or 9"
      effect: "After the death of three sons (till age 36), three remain alive, especially with Moon-Mars in Houses 3 or 4."
  remedy: "Donation of Moon-items and Mars-items."
  source: "Goswami 1952, 'Ketu in House No. 5', pp. 619-620"

- id: ketu_house_6
  planet: Ketu
  house: 6
  summary: >
    Ketu in House 6 is "a dog the size of a lion, dual life" — condition
    fluctuates like Ketu itself; here it reverses its usual alliance,
    befriending Mercury and opposing Venus.
  severity: mixed
  benefit_effects:
    - condition: "Ketu alone in House 6"
      effect: "Benefic in all directions; happy, comfortable life; exalts Jupiter (wherever posited), as Ketu in House 1 exalts Sun; ambitious, strong, fond of tasty food and saving money; royal-court support."
    - condition: "Mercury in House 6"
      effect: "Both Mercury and Ketu benefic."
    - condition: "Jupiter benefic"
      effect: "Benefic for children's birth; unafflicted others also helped."
    - condition: "Venus alive and benefic"
      effect: "Wards off many troubles."
    - condition: "Jupiter, Mars, Mercury in House 12, or Jupiter and Mars not in House 6"
      effect: "Ketu benefic, provided the native isn't arrogant/proud."
    - condition: "Jupiter benefic in House 2 with a benefic aspect on Ketu"
      effect: "70 years of life, comforts to maternal uncle, gain from journeys."
  malefic_effects:
    - condition: "General placement"
      effect: "Cowardly, troubled, unlucky; acts as friend of Mercury and enemy of Venus (reversed from usual); disrespected, like a rolling stone."
    - condition: "Ketu malefically aspected from House 2"
      effect: "Loss through Venus-related articles/professions/relations (a gold ring on the left hand helps)."
    - condition: "Jupiter malefic"
      effect: "Aimless journeys, enemies and opponents."
    - condition: "Moon in House 2"
      effect: "Unhappy mother and her brother; troubled old age (children/Ketu-items unaffected)."
    - condition: "Jupiter or Venus malefic"
      effect: "Troubles, dog bites, eczema/other foot diseases; malefic Venus."
    - condition: "Venus in House 6"
      effect: "Both Ketu and Venus malefic."
  remedy: "A gold ring on the left hand."
  source: "Goswami 1952, 'Ketu in House No. 6', pp. 620-622"

- id: ketu_house_7
  planet: Ketu
  house: 7
  summary: >
    Ketu in House 7 is "a shepherd's dog, helpful to children, strong
    like a lion" — constant complaining damages progeny; the family
    grows without obstruction.
  severity: mixed
  benefit_effects:
    - condition: "General placement"
      effect: "Children equal to the number of siblings; at 24, significant earnings giving 40 more years of comfort; wealth compounds with each subsequent son (per the source's formula: age/6 × 8 = wealth multiple)."
    - condition: "Mercury, Venus and Jupiter supportive"
      effect: "Providential help, as long as the native remains a man of his word."
  malefic_effects:
    - condition: "Pride"
      effect: "Causes bad luck — should be avoided."
    - condition: "Ketu malefic but transiting House 1 (ages 7,19,31,43,55,67,74,95,103,115, or son's age 18)"
      effect: "Luck returns."
    - condition: "Not being a man of his word"
      effect: "Suffers disease; Venus turns malefic, domestic trouble follows."
    - condition: "Mercury malefic"
      effect: "Troubled, unhappy life; if Mercury conjoins Ketu here, luck returns after age 34 (enemies trouble the native until then)."
    - condition: "Mercury in House 7, Mercury-profession (writer, journalist)"
      effect: "Benefits after age 34; enemies destroyed after 34, troublesome before."
  remedy: null
  source: "Goswami 1952, 'Ketu in House No. 7', pp. 622-623"

- id: ketu_house_8
  planet: Ketu
  house: 8
  summary: >
    Ketu in House 8 is "a dog crying on the roof in memory of children" —
    one who sees the demons of death; children die more often, though the
    native's own remorse-filled life tends to be long.
  severity: caution
  benefit_effects:
    - condition: "Mercury not malefic (condition of House 12)"
      effect: "Ketu not malefic."
    - condition: "General longevity"
      effect: "Whether a son is born early or late, the native's own age won't be less than 70."
    - condition: "Jupiter in Houses 1-2, or Moon in House 2 with benefic Mars"
      effect: "Ketu stays 'alive' — no treatment needed, many children; worship Moon if it's malefic."
    - condition: "Jupiter and Mars absent from Houses 6-12"
      effect: "No malefic effect of Ketu."
  malefic_effects:
    - condition: "General placement"
      effect: "Mercury and Venus generally in bad houses; his character reflects on his wife's health — worshipping Ketu and high morals protect her."
    - condition: "Children generally"
      effect: "Full of remorse over children; a crying rooftop dog is the first sign of a polluted Ketu; child-birth outer limit around age 34, rare comfort from children till 48."
    - condition: "Age progression"
      effect: "Ketu's results benefic till 25; Rahu/Ketu with Mercury/Saturn turn malefic from 26; marital life disturbed."
    - condition: "Jupiter malefic"
      effect: "Ketu, Mars, Mercury, Venus all give poor results."
    - condition: "Jupiter or Mars in House 6/12, Mars negative in House 4"
      effect: "Children and wealth affected; poor Ketu/Mercury results."
    - condition: "Saturn or Mars in House 7"
      effect: "Everything Ketu-related turns bad; roof collapse risk; household misery."
    - condition: "Mars in House 12 and Saturn in House 1"
      effect: "A brother would have died 12 years before this native's birth."
  remedy: >
    Adopt gold, apply saffron for children's condition. Ear piercing (96
    hours). Donate a two-coloured blanket in a temple; if a planet
    conjoins Ketu, bury its items wrapped in a two-coloured blanket in a
    deserted place.
  source: "Goswami 1952, 'Ketu in House No. 8', pp. 623-625"

- id: ketu_house_9
  planet: Ketu
  house: 9
  summary: >
    Ketu in House 9 is "a dog which follows the human voice, an obedient
    son" — the native keeps returning favours to parents all his life;
    benefic for father, less so for maternal uncle.
  severity: positive
  benefit_effects:
    - condition: "General placement"
      effect: "Promotions without frequent transfers; wealthy through self-effort; handicrafts beneficial; rearing three worldly dogs beneficial; faithful, bold — traits inherited by sons too."
    - condition: "Wealth after the 7th house's ruling planet's period; keeping gold in the house until then"
      effect: "Remains lucky, derives Ketu's benefits."
    - condition: "Residence abroad, obedience to father at ages 12, 24, 48"
      effect: "Blessed with three sons leading comfortable lives."
    - condition: "Moon in a benefic house or benefic"
      effect: "Helpful for mother's relations."
    - condition: "Jupiter or Rahu benefic/exalted, or House 2 strong and aspected by benefics"
      effect: "Power and authority, helpful and lucky for father."
  malefic_effects:
    - condition: "Ketu malefic (Moon also turns malefic)"
      effect: "Maternal uncle becomes very unlucky."
    - condition: "Moon or Mars in House 3 (enemy planets)"
      effect: "Death of children."
    - condition: "Malefic Saturn"
      effect: "Thief, liar, cheat, unlucky individual."
  remedy: "Keep a gold bar at home; wear gold in the ears."
  source: "Goswami 1952, 'Ketu in House No. 9', pp. 626-627"

- id: ketu_house_10
  planet: Ketu
  house: 10
  summary: >
    Ketu in House 10 is "a silently walking opportunist dog" — the
    native forgives even a brother who wrongs him; Ketu here never costs
    him his livelihood.
  severity: mixed
  benefit_effects:
    - condition: "General forgiveness"
      effect: "Brother pardoned even if harmed by the native — brother too prospers."
    - condition: "Saturn benefic, exalted, in good houses"
      effect: "Soil turns to gold; good wealth (only progeny suffers); son arrives in the 24th year; good Jupiter results."
    - condition: "General placement"
      effect: "Harmless, silently-moving dog; rich if morally upright; a renowned player, for better or worse."
  malefic_effects:
    - condition: "Poor Saturn"
      effect: "Ketu-related items adversely affected till ages 24, 48."
    - condition: "Malefic Saturn or in bad houses"
      effect: "Loss of a child; bury honey in a silver box at an isolated place; rearing a dog after age 48 is compulsory and useful; keep morals upright; treat as per Ketu House 8."
    - condition: "Mars not in House 10"
      effect: "Helps (otherwise both benefic together)."
    - condition: "Saturn malefic (both Ketu and Saturn malefic)"
      effect: "Destroys family welfare, financial losses (Moon's help needed); bury milk and honey in house foundations."
    - condition: "Saturn in House 4"
      effect: "Loss of three children, though no loss of property/wealth."
  remedy: >
    Bury honey in a silver box at an isolated place. Rear a dog after age
    48. Bury milk and honey in house foundations.
  source: "Goswami 1952, 'Ketu in House No. 10', pp. 628-629"

- id: ketu_house_11
  planet: Ketu
  house: 11
  summary: >
    Ketu in House 11 is "a cowardly dog" — forget the past, think of the
    future; Ketu here is 11 times strong, giving excellent wealth.
  severity: mixed
  benefit_effects:
    - condition: "Mercury not posited in House 3"
      effect: "Ketu in House 11 gives a royal position."
    - condition: "Saturn in House 3"
      effect: "Very benefic — wealth grows 11-fold."
    - condition: "Ketu transits House 1 at ages 11, 23, 36, 48"
      effect: "Becomes lucky and gains wealth even if male/female planets are malefic."
    - condition: "General placement"
      effect: "Self-earned wealth far exceeds inherited wealth."
  malefic_effects:
    - condition: "General placement (mother)"
      effect: "At the son's birth, the native's mother would have already died; loss through Moon's liquid articles; the native himself may be poor while children fare well if Rahu is benefic in House 5 (opposite for a female chart, where Ketu turns auspicious)."
    - condition: "Mercury in House 3"
      effect: "Malefic Moon effect at ages 11, 23, 36, 48 (remedy same as Moon in House 11)."
    - condition: "Saturn malefic"
      effect: "Loss of children and property (for a female chart, a malefic Saturn means Ketu won't give its malefic effect)."
  remedy: >
    If the first male child is born dead: the mother keeps white radish
    (Saturn-item) by her head at night and donates it at a temple in the
    morning — this saves her and helps her bear a male child the
    following year. Also give 11 bags of milk at a Bhairon temple.
  source: "Goswami 1952, 'Ketu in House No. 11', pp. 629-630"

- id: ketu_house_12
  planet: Ketu
  house: 12
  summary: >
    Ketu in House 12 brings comforts and inheritance — a family full of
    children and wealth; if Ketu's root (House 6) is blank, it's exalted
    and gives comforts.
  severity: positive
  benefit_effects:
    - condition: "General placement"
      effect: "Promotions rather than transfers."
    - condition: "Ketu ineffective in House 12"
      effect: "Falls back to Ketu-in-House-2 style results (like Jupiter in House 2) — from a son's birth or the native's 24th year, respect, wealth, comfort follow."
    - condition: "Saturn, Venus and Jupiter benefic (Mars malefic)"
      effect: "A decent house, gain through journeys, a supportive son."
    - condition: "Worship/establishing Ketu"
      effect: "Abundance of wealth."
    - condition: "Rahu alone in House 6, or House 6 blank"
      effect: "Wealthy, gain through ancestral property; Ketu also benefic; good, comfortable domestic life; happy, lucky family."
  malefic_effects:
    - condition: "Rahu in House 6 conjoined with Mars, Moon, Sun or Venus"
      effect: "No issue till age 28 (Mars), 32 (Moon), 42 (Sun), or 25 (Venus) — though a licentious native's progeny flourishes instead."
    - condition: "Moon in House 2"
      effect: "Either benefic; building a house on land of an issueless person risks the native remaining so too."
    - condition: "Moon in House 6"
      effect: "Death of male children; when Ketu is malefic, no children are born or they die (not malefic for the self)."
  remedy: null
  source: "Goswami 1952, 'Ketu in House No. 12', pp. 630-631"
